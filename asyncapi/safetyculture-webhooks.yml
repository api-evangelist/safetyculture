generated: '2026-07-21'
method: searched
source: https://developer.safetyculture.com/reference/webhooks
type: Webhooks
summary: >-
  SafetyCulture delivers near real-time event notifications via webhooks. You register
  a receiving URL and subscribe to trigger event types. Payloads carry webhook_id,
  version, an event object (date_triggered, event_types, triggered_by), a resource
  (id + type) and a data subset. A signature secret (get/regenerate) is available for
  verifying delivery authenticity.
payload_fields: [webhook_id, version, event, resource, data]
event_object_fields: [date_triggered, event_types, triggered_by]
resource_fields: [id, type]
management_operations:
- name: List webhooks
  reference: https://developer.safetyculture.com/reference/webhooksservice_listwebhooks
- name: Create a webhook
  reference: https://developer.safetyculture.com/reference/webhooksservice_createwebhook
- name: Get a webhook
  reference: https://developer.safetyculture.com/reference/webhooksservice_getwebhook
- name: Update a webhook
  reference: https://developer.safetyculture.com/reference/webhooksservice_updatewebhook
- name: Delete a webhook
  reference: https://developer.safetyculture.com/reference/webhooksservice_deletewebhook
- name: Get signature secret
  reference: https://developer.safetyculture.com/reference/webhooksservice_gettoken
- name: Regenerate signature secret
  reference: https://developer.safetyculture.com/reference/webhooksservice_generatetoken

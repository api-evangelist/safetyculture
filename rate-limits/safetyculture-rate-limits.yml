name: SafetyCulture (Mitti) rate limits
generated: '2026-10-20'
method: searched
source: https://developer.mitti.com/reference/rate-limits
docs: https://developer.mitti.com/reference/rate-limits
summary: Hard throttling limit per endpoint over a 60-second interval; requests sent by the same user simultaneously
  at a high rate are throttled. The docs page carries no plan tie for these limits (monthly API call quotas per
  plan are on the pricing page, see plans/).
throttle_status: 429
throttle_message: Too Many Requests
headers:
- name: x-ratelimit-limit
  description: The rate limit credit for that given endpoint
- name: x-ratelimit-remaining
  description: The number of requests left for the window
- name: x-ratelimit-reset
  description: The number of seconds until this window resets

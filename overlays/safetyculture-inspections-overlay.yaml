overlay: 1.0.0
info:
  title: SafetyCulture Mitti Inspections API enhancements
  version: 1.0.0
extends: openapi/safetyculture-inspections-api-openapi.yml
actions:
- target: $.info
  update:
    x-provider: SafetyCulture (Mitti)
    x-apievangelist-mcp:
      endpoint: https://mcp.mitti.com/mcp
      auth: oauth
      status: early-access
      docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
    x-llms-txt: https://developer.mitti.com/llms.txt
- target: $
  update:
    externalDocs:
      description: Mitti developer portal
      url: https://developer.mitti.com/reference/introduction
- target: $.components.securitySchemes.BearerAuthentication
  update:
    description: 'User API token sent as Authorization: Bearer {api_token}. Tokens are managed per user (https://help.mitti.com/000007).'
- target: $.paths['/audits/search'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/audits/{audit_id}'].get
  update:
    x-legacy: true
- target: $.paths['/audits/{audit_id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/audits/{audit_id}/media/{media_id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/audits/{audit_id}/web_report_link'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/inspections/integration/v1/inspections/{inspection_id}/access'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/inspections/v1/answers/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/inspections/v1/inspections/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/inspections/v1/inspections/{id}/details'].get
  update:
    x-agent-safe: read-only

overlay: 1.0.0
info:
  title: SafetyCulture Mitti Actions API enhancements
  version: 1.0.0
extends: openapi/safetyculture-actions-api-openapi.yml
actions:
- target: $.info
  update:
    x-provider: SafetyCulture (Mitti)
    x-apievangelist-mcp:
      endpoint: https://mcp.mitti.com/mcp
      auth: oauth
      status: early-access
      docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
    x-llms-txt: https://developer.mitti.com/llms.txt
- target: $
  update:
    externalDocs:
      description: Mitti developer portal
      url: https://developer.mitti.com/reference/introduction
- target: $.components.securitySchemes.BearerAuthentication
  update:
    description: 'User API token sent as Authorization: Bearer {api_token}. Tokens are managed per user (https://help.mitti.com/000007).'
- target: $.paths['/tasks/v1/actions/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/actions/{task_id}/shared_link'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/customer_configuration/action_labels'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/customer_configuration/task_type/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/customer_configuration/task_types'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/customer_configuration/{type_id}/custom_fields/mapped'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/tasks/v1/customer_configuration/{type_id}/custom_fields/unmapped'].get
  update:
    x-agent-safe: read-only

overlay: 1.0.0
info:
  title: SafetyCulture Mitti Users API enhancements
  version: 1.0.0
extends: openapi/safetyculture-users-api-openapi.yml
actions:
- target: $.info
  update:
    x-provider: SafetyCulture (Mitti)
    x-apievangelist-mcp:
      endpoint: https://mcp.mitti.com/mcp
      auth: oauth
      status: early-access
      docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
    x-llms-txt: https://developer.mitti.com/llms.txt
- target: $
  update:
    externalDocs:
      description: Mitti developer portal
      url: https://developer.mitti.com/reference/introduction
- target: $.components.securitySchemes.BearerAuthentication
  update:
    description: 'User API token sent as Authorization: Bearer {api_token}. Tokens are managed per user (https://help.mitti.com/000007).'
- target: $.paths['/permissions/v1/permission_set/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/users'].post
  update:
    x-legacy: true
- target: $.paths['/users/search'].post
  update:
    x-legacy: true
- target: $.paths['/users/v1/users/{user_id}/attributes'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/users/{user_id}'].get
  update:
    x-legacy: true
- target: $.paths['/users/{user_id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/users/{user_id}'].put
  update:
    x-legacy: true

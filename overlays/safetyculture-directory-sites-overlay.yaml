overlay: 1.0.0
info:
  title: SafetyCulture Mitti Directory (Sites) API enhancements
  version: 1.0.0
extends: openapi/safetyculture-directory-sites-api-openapi.yml
actions:
- target: $.info
  update:
    x-provider: SafetyCulture (Mitti)
    x-apievangelist-mcp:
      endpoint: https://mcp.mitti.com/mcp
      auth: oauth
      status: early-access
      docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
    x-llms-txt: https://developer.mitti.com/llms.txt
- target: $
  update:
    externalDocs:
      description: Mitti developer portal
      url: https://developer.mitti.com/reference/introduction
- target: $.components.securitySchemes.BearerAuthentication
  update:
    description: 'User API token sent as Authorization: Bearer {api_token}. Tokens are managed per user (https://help.mitti.com/000007).'
- target: $.paths['/directory/v1/folder/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/folder/{id}/users'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/folder/{id}/users/associated'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/folder/{id}/users/inherited'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/folders'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/organization/labels'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/parent/{id}/folders'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/directory/v1/user/folder_ids'].get
  update:
    x-agent-safe: read-only

overlay: 1.0.0
info:
  title: SafetyCulture Mitti Assets API enhancements
  version: 1.0.0
extends: openapi/safetyculture-assets-api-openapi.yml
actions:
- target: $.info
  update:
    x-provider: SafetyCulture (Mitti)
    x-apievangelist-mcp:
      endpoint: https://mcp.mitti.com/mcp
      auth: oauth
      status: early-access
      docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
    x-llms-txt: https://developer.mitti.com/llms.txt
- target: $
  update:
    externalDocs:
      description: Mitti developer portal
      url: https://developer.mitti.com/reference/introduction
- target: $.components.securitySchemes.BearerAuthentication
  update:
    description: 'User API token sent as Authorization: Bearer {api_token}. Tokens are managed per user (https://help.mitti.com/000007).'
- target: $.paths['/assets/v1/assets/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/assets/v1/assets:GetAssetByCode'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/assets/v1/maintenance/program'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/assets/v1/status-groups/{id}'].get
  update:
    x-agent-safe: read-only
- target: $.paths['/assets/v1/types/{id}'].get
  update:
    x-agent-safe: read-only

    s12.tasks.v1.TimelineItem.Type:
      type: string
      enum:
      - TIMELINE_ITEM_UNKNOWN
      - TASK_CREATED
      - TASK_TITLE_UPDATED
      - TASK_DESCRIPTION_UPDATED
      - TASK_ASSIGNEE_ADDED
      - TASK_ASSIGNEE_REMOVED
      - TASK_DUE_AT_UPDATED
      - TASK_STATUS_UPDATED
      - TASK_PRIORITY_UPDATED
      - TASK_COMMENT_ADDED
      - TASK_IMAGE_UPLOADED
      - TASK_SITE_UPDATED
      - TASK_DELETED
      - TASK_CATEGORY_UPDATED
      - INCIDENT_CREATED
      - TASK_NOTIFICATION_SENT
      - TASK_MEDIA_UPLOADED
      - TASK_ASSIGNEE_UPDATED
      - TASK_LOCATION_ADDED
      - TASK_INSPECTION_COMPLETED
      - TASK_INSPECTION_DELETED
      - TASK_INSPECTION_ADDED
      - TASK_ANSWER_ADDED
      - TASK_ASSET_UPDATED
      - TASK_LABELS_UPDATED
      - TASK_SCHEDULE_UPDATED
      - INCIDENT_CHILD_CREATED
      - TASK_CUSTOM_FIELD_UPDATED
      - TASK_OCCURRED_AT_UPDATED
      - TASK_MEDIA_DELETED
      default: TIMELINE_ITEM_UNKNOWN
      description: "The type of the timeline item.\n\n - TIMELINE_ITEM_UNKNOWN: Removed fields related to the cancelled actions/issues integration\nAn unknown type of timeline item.\n - TASK_CREATED: A timeline item for the creation of an action.\n - TASK_TITLE_UPDATED: A timeline item indicating that the title of the task has been updated.\n - TASK_DESCRIPTION_UPDATED: A timeline item indicating that the task's description has been updated.\n - TASK_ASSIGNEE_ADDED: A timeline item indicating that an assignee has been added to the task.\n - TASK_ASSIGNEE_REMOVED: A timeline item indicating that an assignee has been removed from the\ntask.\n - TASK_DUE_AT_UPDATED: A timeline item indicating that the due date of the task has been\nupdated.\n - TASK_STATUS_UPDATED: A timeline item indicating that the status of the task has been updated.\n - TASK_PRIORITY_UPDATED: A timeline item indicating that the priority of the task has been\nupdated.\n - TASK_COMMENT_ADDED: A timeline item indicating that a comment has been added to the task.\n - TASK_IMAGE_UPLOADED: A timeline item indicating that an image was added to the task.\nThis field is deprecated, and was replaced by the `TASK_MEDIA_ADDED`\ntype. It is kept here to maintain backwards compatibility.\n\n@deprecated use TASK_MEDIA_UPLOADED instead\n - TASK_SITE_UPDATED: A timeline item indicating that the folder (site) of the task has been\nupdated.\n - TASK_DELETED: A timeline item indicating that this task has been deleted.\n - TASK_CATEGORY_UPDATED: A timeline item indicating that the category of this task has been\nupdated. This type is only relevant to issues.\n - INCIDENT_CREATED: A timeline item for the creation of an issue.\n - TASK_NOTIFICATION_SENT: A timeline item indicating that a notification about this task has been\nsent.\n - TASK_MEDIA_UPLOADED: A timeline item indicating that media has been added to this task.\n - TASK_ASSIGNEE_UPDATED: reserved 17, 18, 19;\n17 - 19 reserved for the cancelled actions/issues integration feature.\nA timeline item indicating that the assignee of this task has been\nupdated.\n - TASK_LOCATION_ADDED: A timeline item indicating the geolocation of this issue.\nThis type is only relevant to issues.\n - TASK_INSPECTION_COMPLETED: A timeline item indicating that an inspection that has been linked to an\nissue has been completed. This type is only relevant to issues.\n - TASK_INSPECTION_DELETED: A timeline item indicating that an inspection that has been linked to an\nissue has been deleted. This type is only relevant to issues.\n - TASK_INSPECTION_ADDED: A timeline item indicating that an inspection has been linked to an\nissue. This type is only relevant to issues.\n - TASK_ANSWER_ADDED: A timeline item indicating that an issue's custom question has been\nanswered. This type is only relevant to issues.\n - TASK_ASSET_UPDATED: A timeline item indicating that an action has an asset updated\n - TASK_LABELS_UPDATED: A timeline item indicating that an action has labels updated\n - TASK_SCHEDULE_UPDATED: A timeline item indicating that the schedule that created this action was\nupdated.\n - INCIDENT_CHILD_CREATED: A timeline item indicating that an action has been created from an issue\n - TASK_CUSTOM_FIELD_UPDATED: A timeline item indicating that a custom field on this task was updated.\n - TASK_OCCURRED_AT_UPDATED: A timeline item indicating that occurred at date for the task has been\nupdated.\n - TASK_MEDIA_DELETED: A timeline item indicating that media has been deleted from this task."
    s12.tasks.v1.Task.AddressAnswer:

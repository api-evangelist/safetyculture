openapi: 3.2.0
info:
  title: Mitti Assets API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Assets
paths:
  /assets/v1/assets:
    post:
      summary: Create an asset
      operationId: AssetsService_CreateAsset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.assets.v1.CreateAssetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.assets.v1.CreateAssetRequest'
        description: The parameters for `CreateAsset`
        required: true
      tags:
      - Assets
  /assets/v1/assets/bulk:

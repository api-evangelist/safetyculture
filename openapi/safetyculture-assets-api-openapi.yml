            specified, the API will return the next batch of results following the

            previous list asset service history request.'
        page_size:
          type: integer
          format: int32
          description: 'OPTIONAL. The number of asset service history to return. By default, each request

            returns 50 assets service history. You can specify a

            page_size value between 1 to 100.'
      description: The parameters for `ListAssetServiceHistory`
      title: ListAssetServiceHistory
    s12.assets.v1.DeleteProgramResponse:
      type: object
      description: Result returned from `DeleteProgram`
      title: RemoveProgramResponse
    s12.assets.v1.MaintenanceProgram:
      type: object
      properties:
        id:
          type: string
          description: The identifier of the maintenance program.
        name:
          type: string
          description: The name of the maintenance program.
        description:
          type: string
          description: Description and extra information for a maintenance program

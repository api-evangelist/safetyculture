  /assets/v1/assets/{id}:
    get:
      summary: Get full detail information of an asset
      operationId: AssetsService_GetAsset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.assets.v1.GetAssetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Identifier of asset to retrieve.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Assets
    patch:
      summary: Update an asset
      operationId: AssetsService_UpdateAsset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.assets.v1.UpdateAssetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The unique identifier of an asset. This ID is system-generated.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: The user-defined unique identifier of an asset. This ID is user-generated.
                type:
                  $ref: '#/components/schemas/s12.assets.v1.AssetType'
                  description: The asset type of an asset.
                fields:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/s12.assets.v1.AssetField'
                  description: 'The associated fields of an asset contained in an array. Each asset''s

                    fields are based on its asset type. Please make sure the asset fields you

                    use associated with the specified asset type. You can retrieve the

                    associated fields using the list type and field association endpoint.'
                media:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/s12.common.Media'
                  description: All the media directly uploaded to an asset.
                  readOnly: true
                created_at:
                  type: string
                  format: date-time
                  description: The date created timestamp of an asset.
                  readOnly: true
                modified_at:
                  type: string
                  format: date-time
                  description: The date last modified timetstamp of an asset.
                  readOnly: true
                site:
                  $ref: '#/components/schemas/s12.assets.v1.AssetSite'
                  description: 'The assigned site of an asset as object. If an asset is not assigned to a

                    site, the API will return nil.'
                profile_image:
                  $ref: '#/components/schemas/s12.common.Media'
                  description: 'The profile image for an asset. If an asset doesn''t have a profile picture,

                    the API will return nil.'
                  readOnly: true
                state:
                  $ref: '#/components/schemas/s12.assets.v1.AssetState'
                  description: The indicator for whether an asset is active or archived.
                inspected_at:
                  type: string
                  format: date-time
                  description: The date last modified inspection of an asset.
                  readOnly: true
                sourced_from_external_system:
                  type: boolean
                  description: '@deprecated. Use GetAsset API to get the sourced_from_external_system

                    Indicates if an asset is sourced from an external system.'
                  readOnly: true
                statuses:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/s12.assets.v1.AssetStatus'
                  description: The status assigned to the asset. Although this is a repeated field, only one entry is currently supported. Each entry must belong to the status group associated with the asset type.
              title: Asset which replaces the one with matching identifier on the server.
        description: Asset which replaces the one with matching identifier on the server.
        required: true
      tags:
      - Assets
    delete:
      summary: Delete an asset
      operationId: AssetsService_DeleteAsset
      responses:

          description: 'Type of media specified by `media_id`.

            The only supported types are MEDIA_TYPE_IMAGE and MEDIA_TYPE_PDF.'
          allOf:
          - $ref: '#/components/schemas/s12.common.MediaType'
        filename:
          type: string
          description: Full file name including extension.
      description: 'This object is used to define media object associated with an asset,

        including profile image, photos and documents.'
    s12.assets.v1.AssetService:
      type: object

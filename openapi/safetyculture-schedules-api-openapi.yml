openapi: 3.2.0
info:
  title: Mitti Schedules API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Schedules
paths:
  /scheduling/v1/schedule_targets/{schedule_id}:
    get:
      summary: List schedule targets
      description: Returns the sites or assets a schedule applies to, along with the recurrence for each. Results are filtered by the caller's access — only items the caller has permission to view are returned. total_count reflects the full number of sites or assets on the schedule and may exceed the number of items returned.
      operationId: SchedulingService_ListScheduleTargets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.ListScheduleTargetsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: ID of the schedule (Required).
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: Number of sites or assets per page (max 1000).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: Token for fetching a specific page of results.
        in: query
        required: false
        schema:
          type: string
      - name: search_query
        description: 'Text search query to filter results by site name or asset name. Case-insensitive.

          Does not affect total_count, which always reflects the full unfiltered count.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Schedules
  /scheduling/v1/schedules:
    post:
      summary: Create a new schedule
      description: Creates a new schedule with the specified configuration. For site/asset targets, sub-schedules are created asynchronously. Poll the schedule state to check creation progress.
      operationId: SchedulingService_CreateNewSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.CreateNewScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.CreateNewScheduleRequest'
        description: 'CreateNewSchedule creates a schedule that generates recurring work items (e.g., inspections).


          Schedules can target:

          - Specific users (no target, just assignment.users)

          - Sites (target.sites) - creates sub-schedules per site

          - Assets (target.assets) - creates sub-schedules per asset


          For site/asset targets, sub-schedules are created asynchronously.'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{id}:
    delete:
      summary: Delete a schedule
      description: Deletes a schedule. Deleted schedules are no longer active and will not generate new occurrences. This action cannot be undone.
      operationId: SchedulingService_DeleteSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.DeleteScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Unique identifier of the schedule to delete.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Schedules
  /scheduling/v1/schedules/{id}/end:
    patch:
      summary: End a schedule
      description: Ends an active or paused schedule so that it stops generating new occurrences. Existing occurrences are not affected. This action cannot be undone — ended schedules cannot be reactivated.
      operationId: SchedulingService_EndSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.EndScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Unique ID of the schedule.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.EndScheduleBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{id}/pause:
    patch:
      summary: Pause a schedule
      description: Pauses an active schedule so that it stops generating new occurrences. Existing occurrences are not affected. Optionally pause only the sub-schedules for specific sites or assets by setting `sites` or `assets`. The schedule can be resumed later via the Resume schedule endpoint.
      operationId: SchedulingService_PauseSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.PauseScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Unique ID of the schedule to pause.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.PauseScheduleBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{id}/resume:
    patch:
      summary: Resume a schedule
      description: Resumes a paused schedule so that it begins generating new occurrences again. Optionally resume only the sub-schedules for specific sites or assets by setting `sites` or `assets`. Schedules that have ended cannot be resumed.
      operationId: SchedulingService_ResumeSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.ResumeScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Unique identifier of the customer schedule to resume or resume sub-schedules for.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.ResumeScheduleBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}:
    get:
      summary: Get a schedule
      description: Returns the full configuration of a schedule by its ID. For site and asset schedules, target counts are returned as totals only.
      operationId: SchedulingService_GetSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.GetScheduleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: The schedule ID.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}/access:
    get:
      summary: List schedule access
      description: Returns a list of authorization rules for the schedule.
      operationId: SchedulingService_ListScheduleAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.ListScheduleAccessResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: ID of the schedule.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}/assignees:
    patch:
      summary: Update schedule assignees
      description: Replaces the assignment rule for a schedule. The selected option replaces the current assignees entirely. Use 'users' to assign specific users, 'groups' to assign all members of a group, 'site_members' to assign all members of the target site(s), or 'site_members_in_group' to assign site members who are also in a group. The site_members and site_members_in_group options require the schedule to have targets (sites or assets) set.
      operationId: SchedulingService_UpdateScheduleAssignees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.UpdateScheduleAssigneesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: ID of the schedule to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.UpdateScheduleAssigneesBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}/details:
    patch:
      summary: Update schedule details
      description: Updates schedule details such as title or completion rule.
      operationId: SchedulingService_UpdateScheduleDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.UpdateScheduleDetailsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: ID of the schedule to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.UpdateScheduleDetailsBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}/recurrence:
    patch:
      summary: Update schedule recurrence
      description: Updates the recurrence configuration for a schedule, including the recurrence pattern, duration, timezone, and late submission rule. All recurrence fields are replaced with the provided values. Use `effective_from` to control whether changes apply from the current or next occurrence.
      operationId: SchedulingService_UpdateScheduleRecurrence
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.UpdateScheduleRecurrenceResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: Unique identifier of the schedule to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.UpdateScheduleRecurrenceBody'
        required: true
      tags:
      - Schedules
  /scheduling/v1/schedules/{schedule_id}/target:
    patch:
      summary: Update schedule target
      description: Updates schedule targets (sites or assets) and related configuration.
      operationId: SchedulingService_UpdateScheduleTarget
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.scheduling.v1.UpdateScheduleTargetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: schedule_id
        description: ID of the schedule to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.scheduling.v1.SchedulingService.UpdateScheduleTargetBody'
        required: true
      tags:
      - Schedules
components:
  schemas:
    s12.scheduling.v1.AssetScheduleTarget:
      type: object
      properties:
        id:
          type: string
          description: System-generated unique ID of the asset.
        code:
          type: string
          description: The asset's code - its user-defined unique identifier.
        display_name:
          type: string
          description: Display name of the asset.
        type:
          description: The asset's type.
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.AssetTargetType'
        site:
          description: The site this asset is linked to.
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.AssetSite'
      description: AssetScheduleTarget is an asset a schedule applies to.
    s12.scheduling.v1.Assets:
      type: object
      properties:
        asset_ids:
          type: array
          items:
            type: string
          description: A list of asset IDs.
      description: Assets specifies a list of assets.
      required:
      - asset_ids
    s12.scheduling.v1.GetScheduleResponse:
      type: object
      properties:
        id:
          type: string
          description: The schedule ID.
          readOnly: true
        title:
          type: string
          description: The schedule title.
          readOnly: true
        status:
          description: 'The current status of the schedule.

            Deleted schedules are not returned — this API returns NOT_FOUND if the

            schedule has been deleted.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.Status'
        work_type:
          description: The type of work to be done for each occurrence.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.ScheduleWorkTypeInfo'
        recurrence:
          description: The recurrence pattern for this schedule.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.ScheduleRecurrenceInfo'
        completion_rule:
          description: 'The completion rule for the schedule.

            Indicates how many assigned users must complete the work for an occurrence to be considered complete.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.CompletionRule'
        assignment:
          description: 'The assignment rule that determines who is assigned to complete the work at

            each occurrence, as set at creation or last update.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.ScheduleAssignmentRuleInfo'
        target_summary:
          description: 'The sites or assets this schedule runs against.


            When absent, the schedule runs directly for the assigned users with no

            site or asset targeting. When present, a separate occurrence is created

            per target at each recurrence.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.ScheduleTargetSummary'
        creator:
          description: Who created this schedule.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.User'
        created_at:
          type: string
          format: date-time
          description: When this schedule was created.
          readOnly: true
        last_modified_by:
          description: Who last modified this schedule.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.User'
        last_modified_at:
          type: string
          format: date-time
          description: When this schedule was last modified.
          readOnly: true
        next_occurrence:
          description: 'The start and end time of the next upcoming occurrence.

            Absent when there are no future occurrences (e.g. status is ENDED or FINISHED).'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.GetScheduleResponse.NextOccurrenceDateRange'
      description: Response message for GetSchedule.
    s12.scheduling.v1.ScheduleUserAssignmentInfo:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.scheduling.v1.User'
          readOnly: true
      description: Assignment to specific users.
    s12.scheduling.v1.ScheduleTargetSummary:
      type: object
      properties:
        target_type:
          description: Whether the targets are sites or assets.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.ScheduleTargetType'
        total_count:
          type: integer
          format: int32
          description: 'Number of resolved targets this schedule applies to.

            For site targets, each registered site is expanded to the locations it

            represents, so the count may differ from the number of registered site IDs.'
          readOnly: true
      description: The type and count of targets (sites or assets) attached to a schedule.
    s12.scheduling.v1.DeleteScheduleResponse:
      type: object
    s12.scheduling.v1.ScheduleByAssets:
      type: object
      properties:
        asset_ids:
          type: array
          items:
            type: string
          description: Assets included in the schedule.
      description: 'ScheduleByAssets is a list of assets a schedule applies to.

        Assignment and progress is tracked separately for each asset.

        Assignees can be specified, or derived through the respective asset''s site.'
      required:
      - asset_ids
    s12.scheduling.v1.GetScheduleResponse.NextOccurrenceDateRange:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
          description: When the occurrence starts.
          readOnly: true
        end_time:
          type: string
          format: date-time
          description: When the occurrence is due.
          readOnly: true
        timezone:
          type: string
          description: The IANA timezone for the occurrence (e.g. "America/New_York").
          readOnly: true
      description: The start and end time of an upcoming occurrence.
    s12.scheduling.v1.ScheduleBySites:
      type: object
      properties:
        site_ids:
          type: array
          items:
            type: string
          description: Sites included in the schedule.
      description: 'ScheduleBySites is a list of sites a schedule applies to.

        Assignment and progress is tracked separately for each site.

        Assignees can be specified, or derived from site membership.'
      required:
      - site_ids
    s12.scheduling.v1.ScheduleTargetType:
      type: string
      enum:
      - SCHEDULE_TARGET_TYPE_UNSPECIFIED
      - SCHEDULE_TARGET_TYPE_SITES
      - SCHEDULE_TARGET_TYPE_ASSETS
      default: SCHEDULE_TARGET_TYPE_UNSPECIFIED
      description: "Whether a schedule targets sites or assets.\n\n - SCHEDULE_TARGET_TYPE_SITES: The schedule targets specific sites.\n - SCHEDULE_TARGET_TYPE_ASSETS: The schedule targets specific assets."
    s12.scheduling.v1.UpdateScheduleDetailsResponse:
      type: object
      description: Response message for UpdateScheduleDetails.
    s12.scheduling.v1.UpdateScheduleRecurrenceResponse:
      type: object
      description: Response message for UpdateScheduleRecurrence.
    s12.scheduling.v1.ScheduleSiteMemberAssignmentInfo:
      type: object
      description: Assignment to all members of each target site.
    s12.scheduling.v1.ScheduleSiteMemberAssignment:
      type: object
      description: 'ScheduleSiteMemberAssignment assigns work to all members of each target site.

        For asset targets, assigns to members of the asset''s parent site.

        No additional configuration needed - membership is derived from the target.'
    s12.scheduling.v1.ScheduleSiteMemberInGroupAssignment:
      type: object
      properties:
        group_ids:
          type: array
          items:
            type: string
          description: Group IDs for intersection filtering. Currently supports only one group.
      description: 'ScheduleSiteMemberInGroupAssignment assigns the scheduled work to users who are

        both site members AND members of the specified group.

        For asset targets, uses members of the asset''s parent site.'
      required:
      - group_ids
    s12.scheduling.v1.ScheduleSiteMemberInGroupAssignmentInfo:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.scheduling.v1.AssignmentGroup'
          readOnly: true
      description: Assignment to users who belong to both the target site and specified groups.
    s12.scheduling.v1.SiteScheduleTarget:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the site.
        name:
          type: string
          description: Name of the site.
        timezone:
          type: string
          description: IANA time zone of the site (e.g. "Australia/Sydney"). Empty when the site has no time zone set.
      description: SiteScheduleTarget is a site a schedule applies to.
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := ptypes.MarshalAny(foo)\n     ...\n     foo := &pb.Foo{}\n     if err := ptypes.UnmarshalAny(any, foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    s12.scheduling.v1.ScheduleUserAssignment:
      type: object
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: User IDs to assign.
      description: ScheduleUserAssignment assigns the scheduled work to specific users.
      required:
      - user_ids
    s12.scheduling.v1.ScheduleTarget:
      type: object
      description: Specifies which sites or assets this schedule applies to. Exactly one must be set.
      oneOf:
      - type: object
        title: Sites
        description: Target specific sites. A separate occurrence is created for each site at each recurrence.
        properties:
          sites:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleBySites'
        required:
        - sites
      - type: object
        title: Assets
        description: Target specific assets. A separate occurrence is created for each asset at each recurrence.
        properties:
          assets:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleByAssets'
        required:
        - assets
    s12.scheduling.v1.Grantee:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/s12.scheduling.v1.User'
        group:
          $ref: '#/components/schemas/s12.scheduling.v1.Group'
      description: 'Grantee is the typed identifier of an entity holding an access grant.

        Exactly one variant must be set.'
    s12.scheduling.v1.ScheduleInspectionWork:
      type: object
      properties:
        template_id:
          type: string
          description: The ID of the inspection template to use.
      description: ScheduleInspectionWork configures the schedule to create inspections.
      required:
      - template_id
    s12.scheduling.v1.ScheduleRecurrence:
      type: object
      properties:
        dtstart_rrule:
          type: string
          description: "Examples:\n  - \"DTSTART:20240101T140000Z\\nRRULE:FREQ=WEEKLY;BYDAY=MO,WE,FR\" (UTC timezone)\n  - \"DTSTART;TZID=America/New_York:20240101T140000\\nRRULE:FREQ=DAILY;INTERVAL=1\" (with timezone)"
          title: 'Supported RRULE frequencies and intervals:

            - WEEKLY: BYDAY with multiple weekdays (e.g., BYDAY=MO,WE,FR)

            - MONTHLY: BYMONTHDAY=1-28 OR BYSETPOS=1-4,-1 with BYDAY (single weekday)

            - YEARLY: BYMONTH (required) with either BYMONTHDAY or BYSETPOS+BYDAY'
        duration:
          type: string
          description: Duration in ISO 8601 format (e.g., "PT1H"). Defines the window from start to due.
        use_site_timezone:
          type: boolean
          description: 'When true, use each target site''s timezone instead of the RRULE timezone.

            Only applicable when target is sites or assets (uses the asset''s parent site timezone).

            When enabled, any timezone specified in the RRULE will be ignored and set to the default time, UTC.'
        late_submission_rule:
          description: 'The conditions under which users can submit work late for each occurrence.

            When not set, late submission is not allowed.'
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.LateSubmissionRule'
      description: "ScheduleRecurrence defines when and how often the schedule repeats.\n\nRFC 5545 recurrence definition combining DTSTART and RRULE properties.\n DTSTART specifies the start time and timezone. RRULE defines the recurrence pattern.\n Timezone defaults to UTC if unspecified, or if `use_site_timezone` is true.\n\n Expected format: \"DTSTART;TZID=America/New_York:20240101T140000\\nRRULE:FREQ=DAILY;INTERVAL=1\""
      required:
      - dtstart_rrule
      - duration
    s12.scheduling.v1.ScheduleAssignmentRule:
      type: object
      description: Specifies which users are assigned to complete the scheduled work. Exactly one rule must be set.
      oneOf:
      - type: object
        title: Specific Users
        description: Assign to a specific list of users by ID.
        properties:
          users:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleUserAssignment'
        required:
        - users
      - type: object
        title: Group
        description: Assign to all members of a group.
        properties:
          groups:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleGroupAssignment'
        required:
        - groups
      - type: object
        title: Site Members
        description: Assign to all members of each target site. Requires the schedule to have site or asset targets.
        properties:
          site_members:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleSiteMemberAssignment'
        required:
        - site_members
      - type: object
        title: Site Members in Group
        description: Assign to users who are both site members and in a specific group. Requires site or asset targets.
        properties:
          site_members_in_group:
            $ref: '#/components/schemas/s12.scheduling.v1.ScheduleSiteMemberInGroupAssignment'
        required:
        - site_members_in_group
    s12.scheduling.v1.ScheduleRecurrenceInfo:
      type: object
      properties:
        dtstart_rrule:
          type: string
          description: 'The recurrence pattern as a combined DTSTART + RRULE string.


            Format: "DTSTART[;TZID=<timezone>]:<datetime>\nRRULE:<rule>"

            Example: "DTSTART;TZID=America/New_York:20240101T090000\nRRULE:FREQ=WEEKLY;BYDAY=MO"


            When use_site_timezone is true, DTSTART is in UTC and each target site''s

            local timezone is applied at runtime.'
          readOnly: true
        duration:
          type: string
          description: 'How long assignees have to complete the work after an occurrence starts.

            ISO 8601 format (e.g. "PT8H", "P1D").'
          readOnly: true
        use_site_timezone:
          type: boolean
          description: 'When true, each target site''s local timezone is used instead of the

            timezone in dtstart_rrule. Only applies to site and asset schedules.'
          readOnly: true
        late_submission_rule:
          description: 'How long after an occurrence is due assignees can still submit work.

            When absent, late submission is not allowed.'
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.LateSubmissionRule'
      description: The recurrence configuration for a schedule.
    s12.scheduling.v1.LateSubmissionRule:
      type: object
      properties:
        until_next_occurrence:
          description: Allow late submission until the next occurrence starts.
          allOf:
          - $ref: '#/components/schemas/s12.scheduling.v1.UntilNextOccurrence'
        late_submission_duration:
          type: string
          description: 'Allow late submission for a specific duration after each occurrence ends.

            Currently only supports a period of 14 days ("P14D"). ISO 8601 duration format.'
      description: The conditions under which users can submit work late for each occurrence.
    s12.scheduling.v1.Sites:
      type: object

      default: ASSIGNMENT_TYPE_UNSPECIFIED
      description: "AssignmentType classifies how this membership was assigned: explicitly\nby a user, or computed by a dynamic-structure rule.\n\n - ASSIGNMENT_TYPE_UNSPECIFIED: Unspecified assignment type value.\n - ASSIGNMENT_TYPE_MANUAL: The membership was explicitly assigned by a user.\n - ASSIGNMENT_TYPE_RULE_BASED: The membership was computed by a dynamic-structure rule."

    s12.structures.v1.MoveStructureResponse:
      type: object
      title: Response message returned once a structure has been moved
    s12.common.SortDirection:
      type: string
      enum:
      - SORT_DIRECTION_UNSPECIFIED
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
      default: SORT_DIRECTION_UNSPECIFIED
      title: Common set of sorting directions as used by lists
    s12.search.v1.StructureSearchParams.Filters:
      type: object
      properties:
        is_dynamic:
          type: boolean
          description: 'Optional. Only return structures with this is_dynamic value.

            Unset returns both dynamic and non-dynamic.'
        structure_uuids:
          type: array
          items:
            type: string
          description: 'Optional. Restrict to these structure UUIDs (OR-combined).

            api-directory forwards a restricted caller''s entire visible-site scope in

            this field when scoping SearchStructures, so the cap must exceed the largest

            visible scope (tens of thousands) while staying under OpenSearch''s default

            65,536 terms-query limit.'
        parent_uuids:
          type: array
          items:
            type: string
          description: 'Optional. Restrict to structures whose direct parent is one of these

            structure UUIDs (OR-combined). Only the immediate parent is matched;

            structures nested deeper under a listed UUID are not returned.'
        field_values:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.search.v1.StructureSearchParams.Filters.FieldValueFilter'
          description: 'Optional. Restrict to structures whose field values match these

            filters. OR within a filter, AND across filters.'
      description: Filters narrow which structures are returned.
    s12.structures.v1.StructuresService.UpdateStructureBody:
      type: object
      properties:
        name:
          type: string
          description: The updated name of the structure
        description:
          type: string
          description: The updated description for the structure (optional)
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.v1.FieldValueInput'
          description: The updated fields for the structure
    s12.structures.v1.SearchStructuresResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.search.v1.StructureSearchResult'
          description: Matched structures, ordered by relevance.
        next_page_token:
          type: string
          description: Token for the next page. Empty on the last page.
        total_count:
          type: integer
          format: int32
          description: 'Total number of matching structures across all pages. Accurate up to

            10,000; beyond that it is a lower bound (treat a value of 10000 as

            "10,000+").'
      description: Response for SearchStructures.
    s12.structures.v1.CreateStructureRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the structure
        structure_type_id:
          type: string
          description: Structure type ID
        parent_structure_id:
          type: string
          description: Parent structure ID
        child_structure_id:
          type: string
          description: Child structure ID
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.v1.FieldValueInput'
          description: The fields for the structure
        description:
          type: string
          description: The updated description for the structure (optional)
        meta_label:
          type: string
          description: 'Optional. The meta label only used for top-level structures, used to identify the hierarchy level type

            (e.g. "location", "area", "region", "state", "country"). ignored if parent_structure_id is provided.

            use cases: create a solo structure without parent but still want to assign a meta label to it,'
      title: Request message to create a structure
      required:
      - name
      - structure_type_id
    s12.structures.membership.v1.StructureMembershipDetails:
      type: object
      properties:
        structure_membership:
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembership'
          description: The membership IDs
        user_data:
          description: Details for the user associated with the structure membership, used to display user details when available.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.UserDetails'
        role_data:
          description: Details for the role associated with the structure membership, used to display role details when available.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.RoleDetails'
      description: 'StructureMembershipDetails is a structure membership resolved with the user

        and role details needed to display it without a separate lookup.'
    s12.structures.membership.v1.ListUsersByRoleRequest.Filter:
      type: object
      properties:
        query:
          type: string
          description: Used for filtering users by their name, family name or email. This supports partial matches to allow flexible searching.
        user_status:
          description: Used for filtering users by their active status. This allows clients to include or exclude inactive users from the results.
          allOf:
          - $ref: '#/components/schemas/s12.common.UserActiveStatus'
      description: Filter criteria for listing users by role.
    s12.structures.v1.ListFieldsRequest.FieldsFilter:
      type: object
      properties:
        field_category:
          description: 'Optional. Restrict to fields of a single category: the system fields that

            exist in every organization, or the custom fields yours has defined.'
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.FieldCategory'
        field_value_types:
          type: array
          items:
            $ref: '#/components/schemas/s12.typefield.v1.FieldValueType'
          description: Optional. Restrict to fields whose value is one of these types.
        query:
          type: string
          description: Optional. Restrict to fields whose name matches this search text.
        created_by:
          type: array
          items:
            type: string
          description: 'Optional. Restrict to fields created by any of these users, identified by

            user ID.'
        applies_to:
          type: array
          items:
            type: string
          description: 'Optional. Restrict to fields mapped to any of these structure types,

            identified by structure type ID. Set this to find the fields that apply to

            the type of structure you are about to create.'
        status:
          description: Optional. Restrict to fields in this status.
          allOf:
          - $ref: '#/components/schemas/s12.structures.v1.FieldStatus'
        mapping_metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Optional. Restrict to fields that have at least one mapping whose

            metadata contains every supplied key/value pair. Typically combined

            with `applies_to` to scope to a specific structure type.

            Supported keys today: "display_on_profiles", "field_required".'
      description: 'Filters that narrow which fields are returned. Filters combine with AND —

        a field is returned only when it satisfies every filter supplied.'
    s12.structures.membership.v1.Avatar:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the avatar.
        type:
          type: string
          description: The type of the avatar.

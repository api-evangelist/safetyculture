openapi: 3.2.0
info:
  title: Mitti Structures API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Structures
paths:
  /structures/v1/fields/list:
    post:
      summary: List fields
      description: Returns the field definitions in your organization. Use it to resolve the `field_id` values you need before setting field values on a structure, filtering by the structure type a field applies to. Each field carries its type, whether it is required, and its per-structure-type settings.
      operationId: StructuresFieldsService_ListFields
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.ListFieldsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.v1.ListFieldsRequest'
        required: true
      tags:
      - Structures
  /structures/v1/roles/{role_id}/members:
    post:
      summary: Add users to a role
      description: 'Assigns up to 100 users to a role, each against its own set of structures. This endpoint supports partial success: the memberships that were created are returned in `structure_memberships`, and any assignment that failed is reported in `errors` with a status code and a reason. A response with a populated `errors` array is still a 200.'
      operationId: StructureMembershipService_AddUsersToRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.membership.v1.AddUsersToRoleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: role_id
        description: The unique identifier of the role to assign. Required.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembershipService.AddUsersToRoleBody'
        required: true
      tags:
      - Structures
  /structures/v1/roles/{role_id}/members/list:
    post:
      summary: List users by role
      description: Lists the users assigned to a role, deduplicated across structure instances, one entry per user. Each entry samples the user's assigned structures per structure type.
      operationId: StructureMembershipService_ListUsersByRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.membership.v1.ListUsersByRoleResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: role_id
        description: Required. The unique identifier of the role.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembershipService.ListUsersByRoleBody'
        required: true
      tags:
      - Structures
  /structures/v1/structures:
    post:
      summary: Create a structure
      description: Creates a structure, such as a site or a group, within your organization. Set `parent_structure_id` to place the new structure beneath an existing one, or leave it empty to create a top-level structure. Field values supplied in `fields` are applied to the new structure.
      operationId: StructuresService_CreateStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.CreateStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.v1.CreateStructureRequest'
        required: true
      tags:
      - Structures
  /structures/v1/structures/search:
    post:
      summary: Search structures
      description: Searches the structures of a single type in your organization, ordered by relevance. `structure_type` is required — pass a built-in type such as `SYSTEM_STRUCTURE_TYPE_SITE` or an org-defined structure type UUID. Results are paginated with `page_token`.
      operationId: StructuresService_SearchStructures
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.SearchStructuresResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.v1.SearchStructuresRequest'
        description: Request for SearchStructures. Organization is taken from the caller's auth.
        required: true
      tags:
      - Structures
  /structures/v1/structures/{structure_id}:
    get:
      summary: Get a structure
      description: Returns a structure with its ancestors and its field values. Only field values whose field is configured to display on profiles for the structure's type are returned. Use the structure metadata endpoint when you only need the core attributes.
      operationId: StructuresService_GetStructureProfile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.GetStructureProfileResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Structures
    put:
      summary: Replace a structure
      description: 'Replaces a structure''s name, description and field values. This is a full replacement, not a partial update: an omitted `description` is cleared, and any field value that is not present in `fields` is cleared. Send the structure''s complete field set on every request.'
      operationId: StructuresService_UpdateStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.UpdateStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        description: The identifier of the structure to update
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.v1.StructuresService.UpdateStructureBody'
        required: true
      tags:
      - Structures
  /structures/v1/structures/{structure_id}/members:
    post:
      summary: Add users to a structure
      description: 'Adds up to 100 users to a structure as direct members. This endpoint supports partial success: the memberships that were created are returned in `structure_memberships`, and any assignment that failed is reported in `errors` with a status code and a reason. A response with a populated `errors` array is still a 200.'
      operationId: StructureMembershipService_AddUsersToStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.membership.v1.AddUsersToStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        description: The unique identifier of the structure.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembershipService.AddUsersToStructureBody'
        required: true
      tags:
      - Structures
  /structures/v1/structures/{structure_id}/members/list:
    post:
      summary: List members of a structure
      description: Returns the users assigned directly to a structure, each with their role and user details. Users who inherit membership from an ancestor structure are not included. Filter by role, by a partial match on name or email, or by active status, and page through results with `page_size` and `offset`. Use `total_membership_count` to size the full result set.
      operationId: StructureMembershipService_ListDirectUsersInStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.membership.v1.ListDirectUsersInStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        description: The unique identifier of the structure to list users for.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembershipService.ListDirectUsersInStructureBody'
        required: true
      tags:
      - Structures
  /structures/v1/structures/{structure_id}/members/remove:
    post:
      summary: Remove users from a structure
      description: 'Removes up to 100 users from a structure. Only direct memberships are removed — a user who inherits membership from an ancestor structure keeps that inherited membership. This endpoint supports partial success: a user who could not be removed is reported in `errors` with a status code and a reason, and a response with a populated `errors` array is still a 200. A rule-based membership is reported this way rather than removed, because only a change to the rule can remove it.'
      operationId: StructureMembershipService_RemoveUsersFromStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.membership.v1.RemoveUsersFromStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        description: The unique identifier of the structure.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembershipService.RemoveUsersFromStructureBody'
        required: true
      tags:
      - Structures
  /structures/v1/structures/{structure_id}/metadata:
    get:
      summary: Get structure metadata
      description: 'Returns the core metadata for a structure: its name, type, status, creator and timestamps. Use this instead of the full structure endpoint when you do not need ancestors or field values. Pass `field_mask` to restrict which metadata fields are populated.'
      operationId: StructuresService_GetStructureMetadata
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.GetStructureMetadataResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        description: Required. The unique identifier of the structure.
        in: path
        required: true
        schema:
          type: string
      - name: field_mask
        description: Optional. Controls which fields of the StructureMetadata are populated in the response.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Structures
  /structures/v1/structures/{structure_id}/move:
    post:
      summary: Move a structure
      description: Moves a structure so that it sits beneath a different parent. The structure keeps its members and field values; only its position in the hierarchy changes. Only structures whose type supports hierarchy can be moved — check `can_move` on the structure first.
      operationId: StructuresService_MoveStructure
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.structures.v1.MoveStructureResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: structure_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.structures.v1.StructuresService.MoveStructureBody'
        required: true
      tags:
      - Structures
components:
  schemas:
    s12.search.v1.StructureSearchResult.Parent:
      type: object
      properties:
        uuid:
          type: string
          description: UUID of the parent structure.
        name:
          type: string
          description: Display name of the parent structure.
      description: The matched structure's parent.
    s12.structures.membership.v1.ListDirectUsersInStructureRequest.Filter:
      type: object
      properties:
        role_id:
          type: string
          description: Filter by role ID to list only users with a specific role.
        query:
          type: string
          description: Used for filtering users by their name, family name or email. This supports partial matches to allow flexible searching.
        user_status:
          description: Used for filtering users by their active status. This allows clients to include or exclude inactive users from the results.
          allOf:
          - $ref: '#/components/schemas/s12.common.UserActiveStatus'
      description: Filter criteria for listing direct users in a structure.
    s12.common.GeoPosition:
      type: object
      properties:
        longitude:
          type: number
          format: double
          description: The geographical longitude
        latitude:
          type: number
          format: double
          description: The geographical latitude
        accuracy:
          type: integer
          format: int32
          description: The accuracy in meters
      description: A position is the fundamental geographical geometry construct.
    s12.structures.membership.v1.RoleDetails:
      type: object
      properties:
        name:
          type: string
          description: The role title.
        id:
          type: string
          description: The unique identifier of the role.
      title: RoleDetails contains basic details about a role
    s12.structures.membership.v1.RemoveUsersFromStructureResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.membership.v1.RemoveUserAssignmentsError'
          description: 'The users that could not be removed, each with a reason. Empty when every

            removal succeeded.'
      description: 'Response message for removing users from a structure. Supports partial

        success: the users that could not be removed are returned with a reason.'
    s12.structures.v1.UpdateStructureResponse:
      type: object
    s12.structures.membership.v1.RoleUserAssignments:
      type: object
      properties:
        user_data:
          description: Details about the user.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.UserDetails'
        assigned_structure_details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.membership.v1.RoleStructureInfo'
          description: 'Sampled structures assigned to the user for this role. The sample is

            capped at max_structures_per_user PER structure_type_id, so each type a

            user belongs to is represented. Use total_structure_count_by_type_id to

            know the true per-type counts when a type is sampled out.'
          readOnly: true
        total_structure_count:
          type: integer
          format: int32
          description: Total number of structures this user holds the role on.
          readOnly: true
        total_structure_count_by_type_id:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: 'Total number of structures this user holds the role on, bucketed by

            structure_type_id. Counts are NOT capped by max_structures_per_user, so

            callers can render accurate per-type overflow ("+N more") even when the

            sampled `assigned_structure_details` list is truncated. A missing key

            means the user has zero structures of that type for this role.'
          readOnly: true
      description: Details and structure assignments for a user assigned to a role.
    s12.search.v1.StructureSearchResult.MatchedField:
      type: object
      properties:
        key:
          type: string
          description: Field name (e.g. "address", or a custom field id).
        value:
          type: string
          description: Field value containing the matched substring.
        field_id:
          type: string
          description: 'Field identifier for filter-derived matches. `key` may be empty for

            such matches (e.g. optional custom fields), so clients should resolve

            the display name from their own field definitions using this id.'
      description: 'A field whose value matched the query. Useful for highlighting on

        the client. The structure''s name is not included — it''s already at

        the top level.'
    s12.structures.membership.v1.StructureMembershipService.AddUsersToStructureBody:
      type: object
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: The unique identifiers of the users to add. Limited to 100 users per request.
      description: Request message to add one or more users to a structure.
      required:
      - user_ids
    s12.search.v1.StructureSearchResult.Ancestor:
      type: object
      properties:
        uuid:
          type: string
          description: UUID of the ancestor structure.
        name:
          type: string
          description: 'Display name of the ancestor structure. Empty when masked or

            unresolved for the caller.'
        label:
          type: string
          description: 'Hierarchical label of the ancestor structure (e.g. "region",

            "country", "state").'
        direct_member_count:
          type: integer
          format: int32
          description: 'Number of direct members of the ancestor structure. Matches the type

            of the outer StructureSearchResult.direct_member_count.'
      description: Ancestor of the matched structure, from root down to the direct parent.
    s12.structures.v1.Structure.Ancestor:
      type: object
      properties:
        id:
          type: string
          description: ID of the Ancestor belonging to the Structure.
          readOnly: true
        name:
          type: string
          description: name of the Ancestor.
          readOnly: true
        depth:
          type: integer
          format: int32
          description: Depth relative to the Structure. Structure self depth = 0. Direct parent depth = 1.
          readOnly: true
    s12.structures.membership.v1.RoleUserEntry:
      type: object
      properties:
        user_id:
          type: string
          description: The unique identifier of the user.
          readOnly: true
        assignments:
          description: Details and structure assignments for the user.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.RoleUserAssignments'
      description: A single user entry in a role user listing.
    s12.structures.membership.v1.AddUsersToRoleResponse:
      type: object
      properties:
        structure_memberships:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.membership.v1.StructureMembership'
          description: The structure memberships that were successfully created.
        errors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.membership.v1.AddUsersToRoleError'
          description: 'The (user, structure) assignments that failed, each with a reason. Empty

            when every assignment succeeded.'
      description: 'Response message for adding users to a role. Supports partial success: the

        memberships that were created are returned alongside per (user, structure)

        failures.'
    s12.structures.types.v1.SystemStructureType:
      type: string
      enum:
      - SYSTEM_STRUCTURE_TYPE_UNSPECIFIED
      - SYSTEM_STRUCTURE_TYPE_SITE
      - SYSTEM_STRUCTURE_TYPE_GROUP
      default: SYSTEM_STRUCTURE_TYPE_UNSPECIFIED
      description: 'Built-in structure types that exist across every organization without

        needing an org-defined UUID. Use SystemStructureType when referring to

        these well-known types by name.'
    s12.typefield.v1.ContactDetails:
      type: object
      properties:
        name:
          type: string
          description: The name of the contact.
        phone:
          type: string
          description: The phone number of the contact.
        email:
          type: string
          description: The email address of the contact.
      description: Contact details for a person or entity.
    s12.structures.v1.StatusType:
      type: string
      enum:
      - STATUS_TYPE_ACTIVE
      - STATUS_TYPE_PENDING
      - STATUS_TYPE_DELETED
      description: "- STATUS_TYPE_ACTIVE: The structure is active and can be used.\n - STATUS_TYPE_PENDING: The structure has been created but is not yet active.\n - STATUS_TYPE_DELETED: The structure has been deleted."
      title: Status types for structures
    s12.structures.v1.FieldValue:
      type: object
      description: 'FieldValue represents a single field and its value within a structure profile.

        Each field value is associated with a field type definition and contains the actual data.'
      properties:
        field_id:
          type: string
          description: The unique identifier of the field type definition.
        field_name:
          type: string
          description: The display name for the field.
          readOnly: true
        value_type:
          description: The type of value stored in this field.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.FieldValueType'
        created_at:
          type: string
          format: date-time
          description: The timestamp when this field value was created.
          readOnly: true
        created_by:
          type: string
          description: The user ID of the user who created this field value.
          readOnly: true
        is_default_value:
          type: boolean
          description: Indicates whether this field value is the default value for the field.
          readOnly: true
        is_field_required:
          type: boolean
          description: Indicates whether this field is required for the structure type.
          readOnly: true
      required:
      - field_id
      oneOf:
      - type: object
        title: String
        properties:
          string_value:
            type: string
            description: String value for FIELD_VALUE_TYPE_STRING and FIELD_VALUE_TYPE_TIMEZONE, FIELD_VALUE_TYPE_USER_ID, FIELD_VALUE_TYPE_TEMPLATE_ID and FIELD_VALUE_TYPE_SITE.
        required:
        - string_value
      - type: object
        title: Integer
        properties:
          integer_value:
            type: string
            format: int64
            description: Integer value for FIELD_VALUE_TYPE_INTEGER.
        required:
        - integer_value
      - type: object
        title: Timestamp
        properties:
          timestamp_value:
            type: string
            format: date-time
            description: Timestamp value for FIELD_VALUE_TYPE_TIMESTAMP.
        required:
        - timestamp_value
      - type: object
        title: Select
        properties:
          select_value:
            description: Single select value for FIELD_VALUE_TYPE_SELECT.
            allOf:
            - $ref: '#/components/schemas/s12.structures.v1.SingleSelectValue'
        required:
        - select_value
      - type: object
        title: Address
        properties:
          address_location_value:
            description: Address location value for FIELD_VALUE_TYPE_ADDRESS.
            allOf:
            - $ref: '#/components/schemas/s12.typefield.v1.AddressLocation'
        required:
        - address_location_value
      - type: object
        title: Contact Details
        properties:
          contact_details_value:
            description: Contact details value for FIELD_VALUE_TYPE_CONTACT_DETAILS.
            allOf:
            - $ref: '#/components/schemas/s12.typefield.v1.ContactDetails'
        required:
        - contact_details_value
    s12.search.v1.StructureSearchResult:
      type: object
      properties:
        structure_uuid:
          type: string
          description: UUID of the matched structure.
        name:
          type: string
          description: Display name of the structure.
        structure_type:
          type: string
          description: Structure type identifier (e.g. "folder", "site"). Empty if not categorized.
        direct_member_count:
          type: integer
          format: int32
          description: Number of direct members.
        created_at:
          type: string
          format: date-time
          description: When the structure was created.
        updated_at:
          type: string
          format: date-time
          description: When the structure was last modified.
        similarity_score:
          type: number
          format: float
          description: Relevance score, 0.0–1.0. Higher is more relevant.
        parent:
          description: Parent of the matched structure. Unset for root structures.
          allOf:
          - $ref: '#/components/schemas/s12.search.v1.StructureSearchResult.Parent'
        matches:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.search.v1.StructureSearchResult.MatchedField'
          description: 'Fields that matched the query. Only populated when the request set

            include_matches = true.'
        is_dynamic:
          type: boolean
          description: True if membership is governed by a rule rather than explicit assignment.
        description:
          type: string
          description: Free-text description of the structure. Empty if none is set.
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.types.v1.StructureFieldValue'
          description: 'Fully-populated field values for the structure. Only populated when the

            request set include_fields = true. Field display names (field_name) are

            resolved to their current values at query time, so they stay correct even

            if the field was renamed after the structure was last indexed.'
        ancestors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.search.v1.StructureSearchResult.Ancestor'
          description: 'Full ancestor chain from root to direct parent, in order. Empty for root

            structures and for non-hierarchical (Group) results. Additive to `parent`.'
      description: A single structure that matched the search query.
    s12.structures.membership.v1.UserDetails:
      type: object
      properties:
        first_name:
          type: string
          description: The user's first name.
        last_name:
          type: string
          description: The user's last name.
        email:
          type: string
          description: The user's email address.
        status:
          description: The user's active status.
          allOf:
          - $ref: '#/components/schemas/s12.common.UserActiveStatus'
        avatar:
          description: Optional. The user's avatar information, used to render the avatar when available.
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.Avatar'
        last_seen:
          type: string
          format: date-time
          readOnly: true
          description: last_seen timestamp of the user
        seat_type:
          description: The user's subscription seat type.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/s12.common.SubscriptionSeatTypes'
      title: UserDetails contains basic details about a user
    s12.structures.v1.SingleSelectValue:
      type: object
      properties:
        selected_option_id:
          type: string
          description: 'The ID of the selected option.

            This references a FieldOption defined in the associated field type.'
        options:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.typefield.v1.FieldOption'
          description: 'The list of available options for this field.

            This provides a snapshot of the options available at the time the value was set,

            which is useful for historical accuracy and API convenience.'
      description: 'SingleSelectValue represents a single-select field value.

        This is used for fields where exactly one option can be selected from a predefined list.'
    s12.search.v1.StructureSearchParams.Filters.FieldValueFilter:
      type: object
      properties:
        field_id:
          type: string
        values:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.structures.types.v1.FieldValueData'
          description: 'Each entry is an exact-value predicate. Prefer `matches`, which

            supersedes this field; `values` is retained for callers that have not

            migrated and will be marked deprecated once `matches` is no longer

            experimental.'
      description: 'A single field plus the values it may match. Values within one

        filter are OR-combined; multiple filters are AND-combined.'
    s12.structures.types.v1.FieldValueData:
      type: object
      description: 'FieldValueData contains the typed value stored for a field, without field metadata such as

        field ID, name, timestamps, or requirement/default information.


        Intended to become the canonical FieldValueData across the API. For now the

        wire-compatible original still lives at s12.structures.v1.FieldValueData to avoid

        breaking existing consumers; that copy should be removed once callers have migrated.'
      oneOf:
      - type: object
        title: String
        properties:
          string_value:
            type: string
            description: String value for FIELD_VALUE_TYPE_STRING, FIELD_VALUE_TYPE_TIMEZONE, FIELD_VALUE_TYPE_USER_ID, FIELD_VALUE_TYPE_TEMPLATE_ID and FIELD_VALUE_TYPE_SITE.
        required:
        - string_value
      - type: object
        title: Integer
        properties:
          integer_value:
            type: string
            format: int64
            description: Integer value for FIELD_VALUE_TYPE_INTEGER.
        required:
        - integer_value
      - type: object
        title: Timestamp
        properties:
          timestamp_value:
            type: string
            format: date-time
            description: Timestamp value for FIELD_VALUE_TYPE_TIMESTAMP.
        required:
        - timestamp_value
      - type: object
        title: Select
        properties:
          select_value:
            description: Single select value for FIELD_VALUE_TYPE_SELECT.
            allOf:
            - $ref: '#/components/schemas/s12.structures.types.v1.SingleSelectValue'
        required:
        - select_value
      - type: object
        title: Address
        properties:
          address_location_value:
            description: Address location value for FIELD_VALUE_TYPE_ADDRESS.
            allOf:
            - $ref: '#/components/schemas/s12.typefield.v1.AddressLocation'
        required:
        - address_location_value
      - type: object
        title: Contact Details
        properties:
          contact_details_value:
            description: Contact details value for FIELD_VALUE_TYPE_CONTACT_DETAILS.
            allOf:
            - $ref: '#/components/schemas/s12.typefield.v1.ContactDetails'
        required:
        - contact_details_value
      - type: object
        title: Reference
        properties:
          reference_value:
            description: 'Reference value carrying both the raw id (the filter key) and an optional

              resolved display label, for the reference field types FIELD_VALUE_TYPE_USER_ID,

              FIELD_VALUE_TYPE_SITE and FIELD_VALUE_TYPE_TEMPLATE_ID. Used where a service

              can resolve a human-readable label (e.g. ListUniqueFieldValues); the bare

              string_value above is still used where no label is available.'
            allOf:
            - $ref: '#/components/schemas/s12.structures.types.v1.ReferenceValue'
        required:
        - reference_value
    s12.structures.membership.v1.StructureMembershipService.ListUsersByRoleBody:
      type: object
      properties:
        page_size:
          type: integer
          format: int32
          description: 'Optional. The maximum number of users to return. Default of 1000.

            You can specify a value between 1 to 1000.'
        offset:
          type: integer
          format: int32
          description: Optional. The number of results to offset by.
        sort_direction:
          description: Optional. The sort direction for query results (ascending or descending).
          allOf:
          - $ref: '#/components/schemas/s12.common.SortDirection'
        filter:
          description: Filters to apply against the list of users.
          allOf:
          - $ref: '#/components/schemas/s12.structures.membership.v1.ListUsersByRoleRequest.Filter'
        max_structures_per_user:
          type: integer
          format: int32
          description: 'Optional. Maximum structures sampled per user (1-50), applied PER

            structure_type_id, not globally. Omit it to sample none.


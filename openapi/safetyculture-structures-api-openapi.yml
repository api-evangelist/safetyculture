          type: string
          description: The token used to access the avatar resource.
      title: Avatar contains the information needed to render a user's avatar
    s12.structures.v1.FieldStructureTypeSettings:
      type: object
      description: The mapping between a field and one structure type it applies to. The mapping controls whether the field is required for structures of that type, whether it displays on their profile, and what value it takes when none is supplied.
      properties:
        structure_type_id:
          type: string
          description: The unique identifier of the structure type this mapping applies to.
        field_required:
          type: boolean
          description: Whether a structure of this type must carry a value for the field.
        display_on_profiles:
          type: boolean
          description: Whether the field displays on the profile of a structure of this type. Reading a structure returns only the field values whose field has this set.
      required:
      - structure_type_id
      oneOf:
      - type: object
        title: String
        properties:
          string_value:
            type: string
            description: Default string value for FIELD_VALUE_TYPE_STRING, FIELD_VALUE_TYPE_TIMEZONE, FIELD_VALUE_TYPE_USER_ID, FIELD_VALUE_TYPE_TEMPLATE_ID and FIELD_VALUE_TYPE_SITE.
        required:
        - string_value
      - type: object
        title: Timestamp
        properties:
          timestamp_value:
            type: string
            format: date-time
            description: Default timestamp value for FIELD_VALUE_TYPE_TIMESTAMP.
        required:
        - timestamp_value
      - type: object
        title: Integer
        properties:
          integer_value:
            type: string
            format: int64
            description: Default integer value for FIELD_VALUE_TYPE_INTEGER.
        required:
        - integer_value
      - type: object
        title: Select
        properties:
          select_options:
            description: Default option for FIELD_VALUE_TYPE_SELECT and FIELD_VALUE_TYPE_MULTI_SELECT.
            allOf:
            - $ref: '#/components/schemas/s12.typefield.v1.FieldOption'

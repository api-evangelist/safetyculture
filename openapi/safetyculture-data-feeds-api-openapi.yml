    s12.scheduling.feed.v1.FeedScheduleOccurrence:
      type: object
      properties:
        id:
          type: string
          description: 'Unique identifier for this schedule occurrence.

            Format: `{schedule_id}_{occurrence_id}_{assignee_id}`

            Example: `schedule_123_occ_456_assignee_789`.'
        schedule_id:
          type: string
          description: 'ID of the schedule that generated this occurrence.

            References a schedule from the FeedSchedules endpoint.'
        occurrence_id:
          type: string
          description: 'ID of the specific occurrence within the schedule''s recurrence pattern.

            Each occurrence represents one instance of the scheduled inspection.'
        template_id:
          type: string
          description: 'ID of the template used for inspections created from this occurrence.

            References the inspection template that will be used.'
        start_time:
          type: string
          description: When the occurrence becomes available for inspection (ISO 8601 timestamp format; for example, `2024-01-15T09:00:00Z`).
        due_time:
          type: string
          description: Final deadline (ISO 8601 timestamp format; for example, `2024-01-15T17:00:00Z`). After this time, the occurrence is missed and cannot be completed. For schedules with an overdue period, this comes after `miss_time`.
        miss_time:
          type: string
          description: 'When this occurrence becomes overdue (ISO 8601 timestamp format).

            • Present only if an overdue period configured; otherwise omitted.

            • Between `miss_time` and `due_time`, unfinished occurrences are `OVERDUE`.

            • It is `null` if an overdue period is not configured.'
        occurrence_status:
          type: string
          description: 'Current status of this scheduled occurrence.

            • `TODO`: Not started.

            • `IN_PROGRESS`: Inspection has been started but not completed.

            • `COMPLETED`: Inspection has been finished on time.

            • `LATE`: Inspection has been finished after the `miss_time` but before `due_time`.

            • `OVERDUE`: Past `miss_time` but before `due_time`; not started.

            • `MISSED`: Past `due_time` and has not been completed.

            • `WONT_DO`: Intentionally skipped; `wont_do_note` is mandatory for this status.'
        audit_id:
          type: string
          description: 'ID of the inspection created from this occurrence.

            • Present when the `occurrence_status` is `IN_PROGRESS` or `COMPLETED`.

            • It is `null` for occurrences that haven''t been started yet.

            • Use this ID to fetch full inspection details from inspection APIs.'
        completed_at:
          type: string
          description: 'When this occurrence was marked as completed (ISO 8601 timestamp format).

            • Present only when `occurrence_status` is `COMPLETED`.

            • It is `null` for incomplete occurrences.'
        completion_rule:
          type: string
          description: 'Completion requirement for the occurrence. One of: `any` (at least one assignee must complete) or `all` (every assignee must complete).'
        organisation_id:
          type: string
          description: ID of the organization that owns the occurrence.
        wont_do_note:
          type: string
          description: 'Reason provided when marking occurrence as `won''t do`.

            • Only populated when `occurrence_status` is `WONT_DO`.

            • Contains the explanation for why the occurrence was skipped.'
        assignee_id:
          type: string
          description: 'ID of the specific entity assigned to complete this occurrence.

            • It could be a user ID, role ID, or location ID, depending on assignment type.

            • Use with FeedScheduleAssignees to get assignee details.'
        assignee_from:
          type: string
          description: 'Original assignment source that generated this individual occurrence.

            • Format: `{type}_{id}` where type is user, group, role, or location.

            • Examples: `user_xxx`, `role_yyy`, `location_zzz`

            • Shows how this specific assignee was determined from the schedule''s assignment rules.'
      description: A schedule occurrence record returned from `FeedScheduleOccurrences` V2
      title: FeedScheduleOccurrence

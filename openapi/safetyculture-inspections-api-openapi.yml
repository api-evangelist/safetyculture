openapi: 3.2.0
info:
  title: Mitti Inspections API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Inspections
paths:
  /audits:
    post:
      summary: Start an inspection
      operationId: ThePubService_StartInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.Inspection'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.StartInspectionRequest'
        description: The parameters for `StartInspection`
        required: true
      tags:
      - Inspections
  /audits/search:
    get:
      summary: Search modified inspections
      operationId: ThePubService_SearchInspections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.SearchInspectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: field
        description: "The fields to return. Defaults to just `audit_id`.\n\n - audit_id: Include `audit_id` in the response.\n - modified_at: Include `modified_at` in the response.\n - template_id: Include `template_id` in the response."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - audit_id
            - modified_at
            - template_id
      - name: order
        description: "The order to return results in.\n\n - asc: Ascending order.\n - desc: Descending order."
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: modified_after
        description: Filter inspections modified after this date time.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: modified_before
        description: Filter inspections modified before this date time.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: template
        description: Filter to inspections conducted from these templates.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: archived
        description: "Filter results by archived status. Default is `false`.\n\n - false: Only unarchived inspections.\n - true: Only archived inspections.\n - both: Both unarchived and archived inspections."
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - both
          default: 'false'
      - name: completed
        description: "Filter results by completed status. Default is `both`.\n\n - both: Both complete and incomplete inspections.\n - false: Only incomplete inspections.\n - true: Only complete inspections."
        in: query
        required: false
        schema:
          type: string
          enum:
          - both
          - 'false'
          - 'true'
          default: both
      - name: owner
        description: "Filter results by owner. Default is `all`.\n\n - all: Owned by anyone.\n - me: Only owned by the requesting user\n - other: Only owned by other users."
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - me
          - other
          default: all
      - name: limit
        description: Limit the number of results returned. Default is `100`.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Inspections
  /audits/{audit_id}:
    get:
      summary: Get an inspection (legacy)
      operationId: ThePubService_GetInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.Inspection'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The ID of the inspection to retrieve.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
      deprecated: true
    put:
      summary: Update an inspection
      operationId: ThePubService_UpdateInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.Inspection'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The ID of the inspection to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.ThePubService.UpdateInspectionBody'
        required: true
      tags:
      - Inspections
  /audits/{audit_id}/deep_link:
    post:
      summary: Generate an inspection deep link
      description: Generate a URL to the specified inspection. The link opens in the SafetyCulture mobile app if clicked on a mobile device with the app installed. Otherwise it opens in the SafetyCulture web app.
      operationId: ThePubService_GetInspectionDeepLink
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.GetInspectionDeepLinkResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The id of the inspection to retrieve a deep link for.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
  /audits/{audit_id}/media/{media_id}:
    get:
      summary: Retrieve the selected media for a given inspection
      operationId: ThePubService_GetInspectionMedia
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.GetInspectionMediaResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The id of the inspection to retrieve media from.
        in: path
        required: true
        schema:
          type: string
      - name: media_id
        description: The id of the media to retrieve.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
  /audits/{audit_id}/share:
    post:
      summary: Share an inspection
      operationId: ThePubService_ShareInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.Inspection'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The id of the inspection to share.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.ThePubService.ShareInspectionBody'
        required: true
      tags:
      - Inspections
  /audits/{audit_id}/web_report_link:
    get:
      summary: Get inspection web report link
      description: 'Retrieve the web report link for the specified inspection. This will return the existing link if one has been generated before, or generate a new one if one does not exist already.


        This link does not expire, it is valid until deleted.'
      operationId: ThePubService_GetInspectionWebReportLink
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.GetInspectionWebReportLinkResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The id of the inspection to retrieve a web report link for.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
      externalDocs:
        url: https://help.safetyculture.com/en-US/000687/
    delete:
      summary: Delete inspection web report link
      operationId: ThePubService_DeleteInspectionWebReportLink
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.DeleteInspectionWebReportLinkResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: audit_id
        description: The id of the inspection to delete a web report link for.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
      externalDocs:
        url: https://help.safetyculture.com/en-US/000687/
  /inspection/v1/export:
    post:
      summary: Export inspection to PDF or Word
      operationId: ReportsService_StartInspectionExport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.reports.v1.StartInspectionExportResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.reports.v1.StartInspectionExportRequest'
        required: true
      tags:
      - Inspections
  /inspections/integration/v1/inspections:
    post:
      summary: Create inspection
      description: Create a new inspection from a template and optionally pre-fill item values. Items are matched to the template by item_id. See InspectionItem.ItemType for the list of supported item types. For tables, include pre-filled lines with cell values keyed by column field_id, which you can obtain via GetTemplateDefinition. Items not listed in the request are left empty.
      operationId: InspectionService_CreateInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.CreateInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.pub.integration.v1.CreateInspectionRequest'
        description: Request message for CreateInspection.
        required: true
      tags:
      - Inspections
  /inspections/integration/v1/inspections/{inspection_id}:
    put:
      summary: Update inspection
      description: Update item values on an existing inspection. Only items listed in the request are changed; omitted items are left untouched. See InspectionItem.ItemType for the list of supported item types.
      operationId: InspectionService_UpdateInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.UpdateInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier of the inspection to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.pub.integration.v1.InspectionService.UpdateInspectionBody'
        required: true
      tags:
      - Inspections
  /inspections/integration/v1/inspections/{inspection_id}/access:
    get:
      summary: Get inspection access
      description: Retrieve the complete access configuration for an inspection, including owner, permissions, and site access levels.
      operationId: InspectionService_GetInspectionAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.GetInspectionAccessResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
    put:
      summary: Set inspection access
      description: Replace the access configuration for an inspection.
      operationId: InspectionService_SetInspectionAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.SetInspectionAccessResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/s12.inspections.pub.integration.v1.InspectionService.SetInspectionAccessBody'
      tags:
      - Inspections
  /inspections/integration/v1/inspections/{inspection_id}/complete:
    post:
      summary: Complete inspection
      description: Mark an inspection as complete.
      operationId: InspectionService_CompleteInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.CompleteInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier for the inspection to complete.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.pub.integration.v1.InspectionService.CompleteInspectionBody'
        required: true
      tags:
      - Inspections
  /inspections/integration/v1/inspections/{inspection_id}/tables/{item_id}/lines:
    post:
      summary: Add table line
      description: Add a new line to a table in an inspection. Returns a server-generated line_id for the newly created line. Each cell is identified by a field_id corresponding to a table column; use GetTemplateDefinition to obtain column field_ids. Cells not listed are left empty. Returns FAILED_PRECONDITION if the table has reached its maximum line limit.
      operationId: InspectionService_AddTableLine
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.AddTableLineResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: inspection_id is the unique identifier of the inspection containing the table.
        in: path
        required: true
        schema:
          type: string
      - name: item_id
        description: item_id is the item ID of the table within the inspection.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.pub.integration.v1.InspectionService.AddTableLineBody'
        required: true
      tags:
      - Inspections
  /inspections/integration/v1/inspections/{inspection_id}/tables/{item_id}/lines/{line_id}:
    delete:
      summary: Delete table line
      description: Remove an existing line and all its cell values from an inspection table. The line_id must belong to the table identified by item_id.
      operationId: InspectionService_DeleteTableLine
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.DeleteTableLineResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: inspection_id is the unique identifier of the inspection containing the table.
        in: path
        required: true
        schema:
          type: string
      - name: item_id
        description: item_id is the item ID of the table within the inspection.
        in: path
        required: true
        schema:
          type: string
      - name: line_id
        description: The id of the line to delete.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
    put:
      summary: Update table line
      description: Update cell values on an existing line in an inspection table. Only cells listed in the request are changed; omitted cells are left untouched. Each cell is identified by a field_id corresponding to a table column; use GetTemplateDefinition to obtain column field_ids.
      operationId: InspectionService_UpdateTableLine
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.pub.integration.v1.UpdateTableLineResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: inspection_id is the unique identifier of the inspection containing the table.
        in: path
        required: true
        schema:
          type: string
      - name: item_id
        description: item_id is the item ID of the table within the inspection.
        in: path
        required: true
        schema:
          type: string
      - name: line_id
        description: The id of the line to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.pub.integration.v1.InspectionService.UpdateTableLineBody'
        required: true
      tags:
      - Inspections
  /inspections/v1/answers/{id}:
    get:
      summary: Get answers from an inspection
      description: 'This endpoint is a streaming API that returns answers/responses from an inspection in real-time.


        A stream API pushes data to the client when it becomes available and there is no need for the client to poll the requests to the server for new data.


        Please note that if you''re using a classic REST client, you may find that the data returned in the stream API are individual JSON structures that are not separated by `,` (comma) or encapsulated in a collection `[...]`.'
      operationId: AnswerService_GetAnswersForInspection
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/s12.inspections.v1.Answer'
                  error:
                    $ref: '#/components/schemas/google.rpc.Status'
                title: Stream result of s12.inspections.v1.Answer
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
  /inspections/v1/inspections/{id}:
    get:
      summary: Get an inspection
      operationId: InspectionService_GetInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.GetInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The ID for the inspection.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
    delete:
      summary: Delete an inspection
      operationId: InspectionService_DeleteInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.DeleteInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
  /inspections/v1/inspections/{id}/details:
    get:
      summary: Get details of an inspection
      operationId: ExternalInspectionService_GetInspectionDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.GetInspectionDetailsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The ID for the inspection.
        in: path
        required: true
        schema:
          type: string
      - name: include_media_url
        description: 'Whether to include media URLs (and metadata) in the response payload.

          Optional. Defaults to false.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Inspections
  /inspections/v1/inspections/{inspection_id}/archive:
    delete:
      summary: Restore an archived inspection
      description: Restores an archived inspection by removing its archived status.
      operationId: InspectionService_RestoreArchivedInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.RestoreArchivedInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      tags:
      - Inspections
    post:
      summary: Archive an inspection
      operationId: InspectionService_ArchiveInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.ArchiveInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The unique identifier for the inspection
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.v1.InspectionService.ArchiveInspectionBody'
        required: true
      tags:
      - Inspections
  /inspections/v1/inspections/{inspection_id}/clone:
    post:
      summary: Clone an inspection
      operationId: InspectionService_CloneInspection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.CloneInspectionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: Required. Inspection ID to copy from
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.inspections.v1.InspectionService.CloneInspectionBody'
        required: true
      tags:
      - Inspections
  /inspections/v1/inspections/{inspection_id}/location:
    put:
      summary: Set an inspections start or finish location
      operationId: InspectionService_SetInspectionLocation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.inspections.v1.SetInspectionLocationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: Required. The unique identifier for the inspection

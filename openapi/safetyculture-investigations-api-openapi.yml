  /incidents/v1/field-library:
    get:
      summary: List Detail Field Library
      operationId: InvestigationsService_ListDetailFieldLibrary
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.incidents.v1.ListDetailFieldLibraryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: criteria.filter.search
        description: Search on a field's name
        in: query
        required: false
        schema:
          type: string
      - name: criteria.filter.category
        description: "Search on a field's category\n\n - FIELD_CATEGORY_UNSPECIFIED: Field category Unspecified.\n - FIELD_CATEGORY_SYSTEM_FIELD: Field category pre-defined.\n - FIELD_CATEGORY_CUSTOM_FIELD: Field category custom."
        in: query
        required: false
        schema:
          type: string
          enum:
          - FIELD_CATEGORY_UNSPECIFIED
          - FIELD_CATEGORY_SYSTEM_FIELD
          - FIELD_CATEGORY_CUSTOM_FIELD
          default: FIELD_CATEGORY_UNSPECIFIED
      - name: criteria.filter.field_ids
        description: Search on a field's ids
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: criteria.filter.created_by
        description: Filter by creator user IDs
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: criteria.filter.field_types
        description: "Filter by field value types\n\n - FIELD_VALUE_TYPE_UNSPECIFIED: Field value type unspecified.\n - FIELD_VALUE_TYPE_STRING: Field value type string.\n - FIELD_VALUE_TYPE_MONEY: Field value type money.\n - FIELD_VALUE_TYPE_TIMESTAMP: Field value type timestamp.\n - FIELD_VALUE_TYPE_USER_ID: Field value type user ID.\n - FIELD_VALUE_TYPE_SELECT: Field value type select\n - FIELD_VALUE_TYPE_TEMPLATE_ID: Field value type template ID.\n - FIELD_VALUE_TYPE_MULTI_SELECT: Field value type multi-select\n - FIELD_VALUE_TYPE_SITE: Field value type site\n - FIELD_VALUE_TYPE_MULTI_SITE: Field value type multi-site\n - FIELD_VALUE_TYPE_INTEGER: Field value type integer\n - FIELD_VALUE_TYPE_ADDRESS: Field value type address.\n - FIELD_VALUE_TYPE_TIMEZONE: Field value type timezone\n - FIELD_VALUE_TYPE_CONTACT_DETAILS: Field value type contact details"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - FIELD_VALUE_TYPE_UNSPECIFIED
            - FIELD_VALUE_TYPE_STRING
            - FIELD_VALUE_TYPE_MONEY
            - FIELD_VALUE_TYPE_TIMESTAMP
            - FIELD_VALUE_TYPE_USER_ID
            - FIELD_VALUE_TYPE_SELECT
            - FIELD_VALUE_TYPE_TEMPLATE_ID
            - FIELD_VALUE_TYPE_MULTI_SELECT
            - FIELD_VALUE_TYPE_SITE
            - FIELD_VALUE_TYPE_MULTI_SITE
            - FIELD_VALUE_TYPE_INTEGER
            - FIELD_VALUE_TYPE_ADDRESS
            - FIELD_VALUE_TYPE_TIMEZONE
            - FIELD_VALUE_TYPE_CONTACT_DETAILS
      - name: criteria.filter.applies_to
        description: Filter by targets that the field applies to
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: criteria.filter.state
        description: "Optional. Filter by field state. When not set, defaults to FIELD_STATE_UNSPECIFIED.\n\n - FIELD_STATE_UNSPECIFIED: Field state unspecified.\n - FIELD_STATE_ACTIVE: Field is active.\n - FIELD_STATE_DELETED: Field is deleted.\n - FIELD_STATE_ARCHIVED: Field is archived and no longer active, but not deleted. Cannot be applied to system fields."
        in: query
        required: false
        schema:
          type: string
          enum:
          - FIELD_STATE_UNSPECIFIED
          - FIELD_STATE_ACTIVE
          - FIELD_STATE_DELETED
          - FIELD_STATE_ARCHIVED
          default: FIELD_STATE_UNSPECIFIED
      - name: criteria.filter.mapping_metadata[string]
        description: This is a request variable of the map type. The query format is "map_name[key]=value", e.g. If the map name is Age, the key type is string, and the value type is integer, the query parameter is expressed as Age["bob"]=18
        in: query
        required: false
        schema:
          type: string
      - name: criteria.option_sort
        description: "Optional. Defines sorting for field option labels on returned field objects.\n\n - FIELD_OPTION_SORT_UNSPECIFIED: Unspecified sort order.\n - FIELD_OPTION_SORT_ALPHABETICAL: Alphabetical sort order (default).\n - FIELD_OPTION_SORT_CUSTOM: Custom sort order (as defined by the user)."
        in: query
        required: false
        schema:
          type: string
          enum:
          - FIELD_OPTION_SORT_UNSPECIFIED
          - FIELD_OPTION_SORT_ALPHABETICAL
          - FIELD_OPTION_SORT_CUSTOM
          default: FIELD_OPTION_SORT_UNSPECIFIED
      - name: criteria.sort_field
        description: "Optional. The field to use for sorting.\n\n - SORT_FIELD_UNSPECIFIED: `SORT_FIELD_UNSPECIFIED` returns the default sort order.\n - SORT_FIELD_NAME: `SORT_FIELD_NAME` sorts fields by name.\n - SORT_FIELD_CREATED_AT: `SORT_FIELD_CREATED_AT` sorts fields by creation time."
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_FIELD_UNSPECIFIED
          - SORT_FIELD_NAME
          - SORT_FIELD_CREATED_AT
          default: SORT_FIELD_UNSPECIFIED
      - name: criteria.sort_direction
        description: Optional. The direction to sort fields in.
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_DIRECTION_UNSPECIFIED
          - SORT_DIRECTION_ASC
          - SORT_DIRECTION_DESC
          default: SORT_DIRECTION_UNSPECIFIED
      tags:
      - Investigations

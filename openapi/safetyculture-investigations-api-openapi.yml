          type: array
          items:
            type: string
      - name: filters.site_ids.values
        description: list of values that should match
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filters.title.term
        description: The term to search for
        in: query
        required: false
        schema:
          type: string
      - name: filters.title.match_behaviour
        description: "Optional. The matching behaviour of this term\n\n - MatchBehaviourPartial: Partially match the term\n - MatchBehaviourExact: Exactly match the term"
        in: query
        required: false
        schema:
          type: string
          enum:
          - MatchBehaviourPartial
          - MatchBehaviourExact
          default: MatchBehaviourUnknown
      - name: filters.description.term
        description: The term to search for
        in: query
        required: false
        schema:
          type: string
      - name: filters.description.match_behaviour
        description: "Optional. The matching behaviour of this term\n\n - MatchBehaviourPartial: Partially match the term\n - MatchBehaviourExact: Exactly match the term"
        in: query
        required: false
        schema:
          type: string
          enum:
          - MatchBehaviourPartial
          - MatchBehaviourExact
          default: MatchBehaviourUnknown
      - name: filters.created_at.from
        description: 'Optional. The start point for the filter.

          if not specified, the from component of the range will not apply'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: filters.created_at.to
        description: 'Optional. The end point for the filter.

          if not specified, the to component of the range will not apply'
        in: query

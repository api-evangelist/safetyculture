openapi: 3.2.0
info:
  title: Mitti Users API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Users
paths:
  /permissions/v1/permission_set/assign:
    post:
      summary: Assign user to a permission set
      operationId: PermissionsService_AssignPermissionSet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.permissions.v1.AssignPermissionSetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.permissions.v1.AssignPermissionSetRequest'
        description: The request for AssignPermissionSet.
        required: true
      tags:
      - Users
  /permissions/v1/permission_set/{id}:
    get:
      summary: Get a permission set
      operationId: PermissionsService_GetPermissionSet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.permissions.v1.GetPermissionSetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The ID of the permission set.
        in: path
        required: true
        schema:
          type: string
      - name: include_users
        description: 'Whether to include users in the response.


          Only includes a preview of 10 users, not the entire list'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Users
  /permissions/v1/permission_sets:
    post:
      summary: List permission sets
      operationId: PermissionsService_ListPermissionSets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.permissions.v1.ListPermissionSetsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.permissions.v1.ListPermissionSetsRequest'
        description: The request for ListPermissionSets.
        required: true
      tags:
      - Users
  /users:
    post:
      summary: Create a user (legacy)
      operationId: ThePubService_AddUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.AddUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.AddUserRequest'
        description: The parameters for `AddUser`
        required: true
      tags:
      - Users
      deprecated: true
  /users/search:
    post:
      summary: List users by email (legacy)
      operationId: ThePubService_SearchUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.SearchUsersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.SearchUsersRequest'
        description: The parameters for `SearchUsers`
        required: true
      tags:
      - Users
      deprecated: true
  /users/v1/fields:
    post:
      summary: Create a user field
      operationId: UserFieldService_CreateField
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.CreateFieldResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.CreateFieldRequest'
        required: true
      tags:
      - Users
  /users/v1/fields/list:
    post:
      summary: List user fields
      operationId: UserFieldService_ListFields
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.ListFieldsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.ListFieldsRequest'
        required: true
      tags:
      - Users
  /users/v1/fields/{id}:
    delete:
      summary: Delete a user field
      operationId: UserFieldService_DeleteField
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.DeleteFieldResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The field UUID
        in: path
        required: true
        schema:
          type: string
      tags:
      - Users
    patch:
      summary: Update a user field
      operationId: UserFieldService_UpdateField
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.UpdateFieldResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The field UUID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.UserFieldService.UpdateFieldBody'
        required: true
      tags:
      - Users
  /users/v1/fields/{id}/disable:
    post:
      summary: Archive a field
      operationId: UserFieldService_DisableField
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.DisableFieldResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The field UUID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.UserFieldService.DisableFieldBody'
        required: true
      tags:
      - Users
  /users/v1/fields/{id}/restore:
    post:
      summary: Restore an archived field
      operationId: UserFieldService_RestoreField
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.RestoreFieldResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The field UUID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.UserFieldService.RestoreFieldBody'
        required: true
      tags:
      - Users
  /users/v1/fields/{id}/settings:
    post:
      summary: Update field settings
      operationId: UserFieldService_SetFieldSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userfield.v1.SetFieldSettingsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The field UUID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userfield.v1.UserFieldService.SetFieldSettingsBody'
        required: true
      tags:
      - Users
  /users/v1/users/list:
    post:
      summary: List users
      description: Returns org members matching the supplied filters. Filters are combined with AND across fields and ANY within each field's values. At least one filter must be set, or list_all must be true.
      operationId: UsersService_ListUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.ListUsersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.v1.ListUsersRequest'
        description: 'ListUsersRequest contains the parameters for listing users within the caller''s org.

          The organization is derived from the caller''s JWT token.

          Results are sorted by user_id ascending. No other sort order is supported in v1.'
        required: true
      tags:
      - Users
  /users/v1/users/{user_id}/attributes:
    get:
      summary: Get user attributes
      operationId: UserAttributeService_GetUserAttributes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userattribute.v1.GetUserAttributesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: user_id
        description: Required. The user UUID
        in: path
        required: true
        schema:
          type: string
      - name: filter.visibility_setting
        description: "Filter by visibility settings of the fields\n\n - VISIBILITY_SETTING_USER_PROFILE: VISIBILITY_SETTING_USER_PROFILE corresponds to any attributes where the field setting show_on_profile is true\n - VISIBILITY_SETTING_REGISTRATION: VISIBILITY_SETTING_REGISTRATION corresponds to any attributes where the field setting show_on_registration is true"
        in: query
        required: false
        schema:
          type: string
          enum:
          - VISIBILITY_SETTING_UNSPECIFIED
          - VISIBILITY_SETTING_USER_PROFILE
          - VISIBILITY_SETTING_REGISTRATION
          default: VISIBILITY_SETTING_UNSPECIFIED
      - name: filter.field_ids
        description: Filter by field IDs
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Users
    post:
      summary: Set user attributes
      operationId: UserAttributeService_SetUserAttributes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.userattribute.v1.SetUserAttributesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: user_id
        description: Required. The user UUID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.userattribute.v1.UserAttributeService.SetUserAttributesBody'
        required: true
      tags:
      - Users
  /users/{user_id}:
    get:
      summary: Get a user (legacy)
      operationId: ThePubService_GetUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.GetUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: user_id
        description: The id of the user to be retrieved.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Users
      deprecated: true
    put:
      summary: Update a user (legacy)
      operationId: ThePubService_UpdateUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.UpdateUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: user_id
        description: The id of the user to be updated.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.thepub.v1.ThePubService.UpdateUserBody'
        required: true
      tags:
      - Users
      deprecated: true
components:
  schemas:
    s12.typefield.v1.FieldValueType:
      type: string
      enum:
      - FIELD_VALUE_TYPE_UNSPECIFIED
      - FIELD_VALUE_TYPE_STRING
      - FIELD_VALUE_TYPE_MONEY
      - FIELD_VALUE_TYPE_TIMESTAMP
      - FIELD_VALUE_TYPE_USER_ID
      - FIELD_VALUE_TYPE_SELECT
      - FIELD_VALUE_TYPE_TEMPLATE_ID
      - FIELD_VALUE_TYPE_MULTI_SELECT
      - FIELD_VALUE_TYPE_SITE
      - FIELD_VALUE_TYPE_MULTI_SITE
      - FIELD_VALUE_TYPE_INTEGER
      - FIELD_VALUE_TYPE_ADDRESS
      - FIELD_VALUE_TYPE_TIMEZONE
      - FIELD_VALUE_TYPE_CONTACT_DETAILS
      default: FIELD_VALUE_TYPE_UNSPECIFIED
      description: "Type of FieldValue.\nDefaults to type String.\n\n - FIELD_VALUE_TYPE_UNSPECIFIED: Field value type unspecified.\n - FIELD_VALUE_TYPE_STRING: Field value type string.\n - FIELD_VALUE_TYPE_MONEY: Field value type money.\n - FIELD_VALUE_TYPE_TIMESTAMP: Field value type timestamp.\n - FIELD_VALUE_TYPE_USER_ID: Field value type user ID.\n - FIELD_VALUE_TYPE_SELECT: Field value type select\n - FIELD_VALUE_TYPE_TEMPLATE_ID: Field value type template ID.\n - FIELD_VALUE_TYPE_MULTI_SELECT: Field value type multi-select\n - FIELD_VALUE_TYPE_SITE: Field value type site\n - FIELD_VALUE_TYPE_MULTI_SITE: Field value type multi-site\n - FIELD_VALUE_TYPE_INTEGER: Field value type integer\n - FIELD_VALUE_TYPE_ADDRESS: Field value type address.\n - FIELD_VALUE_TYPE_TIMEZONE: Field value type timezone\n - FIELD_VALUE_TYPE_CONTACT_DETAILS: Field value type contact details"
    s12.users.userfield.v1.UserFieldService.RestoreFieldBody:
      type: object
    s12.common.UserActiveStatus:
      type: string
      enum:
      - USER_ACTIVE_STATUS_UNSPECIFIED
      - USER_ACTIVE_STATUS_ACTIVE
      - USER_ACTIVE_STATUS_DEACTIVATED
      default: USER_ACTIVE_STATUS_UNSPECIFIED
      description: "- USER_ACTIVE_STATUS_UNSPECIFIED: Status is unknown or not specified\n - USER_ACTIVE_STATUS_ACTIVE: User is active\n - USER_ACTIVE_STATUS_DEACTIVATED: User has been deactivated"
      title: UserActiveStatus enumerates possible states of 'status' a user may be in
    s12.permissions.v1.Permissions:
      type: object
      properties:
        manage_role:
          type: boolean
          description: Permission representing "Admin"
        billing:
          type: boolean
          description: Permission representing "Billing management"
        manage_folders:
          type: boolean
          description: Permission representing "Site management"
        create_children:
          type: boolean
          description: Permission representing "Group management"
        manage_users:
          type: boolean
          description: Permission representing "User management"
        allow_modify_manage_data:
          type: boolean
          description: Permission representing "Data management"
        manage_data:
          type: boolean
          description: Permission representing "Data access"
        allow_mobile_data_access_sync:
          type: boolean
          description: Permission representing "Mobile data access"
        create_template:
          type: boolean
          description: Permission representing "Template creation"
        manage_response_sets:
          type: boolean
          description: Permission representing "Manage response sets"
        share_public_library:
          type: boolean
          description: Permission representing "Upload to Public Library"
        manage_report_preferences:
          type: boolean
          description: Permission representing "Manage global report layouts"
        create_schedules:
          type: boolean
          description: Permission representing "Schedule creation"
        manage_schedules:
          type: boolean
          description: Permission representing "Schedule management"
        manage_incidents:
          type: boolean
          description: Permission representing "Issues management"
        incident_access:
          type: boolean
          description: Permission representing "Issues access"
        manage_sensors:
          type: boolean
          description: Permission representing "Sensor management"
        view_sensors:
          type: boolean
          description: Permission representing "Sensors access"
        create_heads_up:
          type: boolean
          description: Permission representing "Create Heads up"
        manage_assets:
          type: boolean
          description: Permission representing "Assets management"
        view_assets:
          type: boolean
          description: Permission representing "Assets access"
        view_training:
          type: boolean
          description: Permission representing "Training access"
        manage_tasks:
          type: boolean
          description: Permission representing "Manage tasks"
        new_report_experience:
          type: boolean
          description: 'Permission representing "New report experience"

            Should not be used in new cases. Returned only for backwards compat.'
        manage_training:
          type: boolean
          description: Permission representing "Training management"
        create_training:
          type: boolean
          description: Permission representing "Training creation"
        manage_permissions:
          type: boolean
          description: Permission representing "Permission management"
        view_analytics:
          type: boolean
          description: Permission representing "Analytics access"
        create_analytics:
          type: boolean
          description: Permission representing "Analytics report creation (creator-based)"
        create_site_analytics:
          type: boolean
          description: Permission representing "Analytics report creation (site-based)"
        manage_analytics:
          type: boolean
          description: Permission representing "Analytics management"
        settings_assets:
          type: boolean
          description: Permission representing "Assets settings"
        manage_credentials:
          type: boolean
          description: Permission representing "Credentials"
        create_course:
          type: boolean
          description: Permission representing "Course creation"
        admin_resources:
          type: boolean
          description: Permission representing "Resources Administration"
        manage_training_teams:
          type: boolean
          description: Permission representing "Manage Teams"
        manage_companies:
          type: boolean
          description: Permission representing "Manage Companies"
        manage_assets_media:
          type: boolean
          description: Permission representing "Manage Assets media"
        manage_assets_maintenance:
          type: boolean
          description: Permission representing "Manage Assets maintenance"
        settings_lone_worker:
          type: boolean
          description: Permission representing "Lone worker settings"
        manage_lone_worker:
          type: boolean
          description: Permission representing "Manage Lone Workers"
        access_lone_worker:
          type: boolean
          description: Permission representing "Access Lone Workers"
        access_investigations:
          type: boolean
          description: Permission representing "Create Investigations"
        manage_investigations:
          type: boolean
          description: Permission representing "Manage Investigations"
        manage_heads_up:
          type: boolean
          description: Permission representing "Manage Heads Up"
        configuration_investigations:
          type: boolean
          description: Permission representing "Configuration Investigations"
        view_investigations:
          type: boolean
          description: Permission representing "Read Investigations"
        access_osha:
          type: boolean
          description: Permission representing "Access OSHA"
        view_inductions:
          type: boolean
          description: Permission representing "Access Onboarding"
        access_ai_assistant:
          type: boolean
          description: Permission representing "Access AI Assistant"
        manage_fields:
          type: boolean
          description: Permission representing "Manage Fields"
        manage_content_library_publish:
          type: boolean
          description: Permission representing "Content Library Publish"
        admin_manufacturing:
          type: boolean
          description: Permission representing "Manufacturing Admin"
        operator_manufacturing:
          type: boolean
          description: Permission representing "Manufacturing Operator"
        read_mcp:
          type: boolean
          description: Permission representing "MCP Read"
        write_mcp:
          type: boolean
          description: Permission representing "MCP Write"
        create_inspection:
          type: boolean
          description: Permission representing "Conduct inspections"
        create_action:
          type: boolean
          description: Permission representing "Create actions"
      description: Permissions represents a set of permissions. Individual permissions can be omitted to leave them unchanged.
    s12.permissions.v1.AssignPermissionSetResponse:
      type: object
      description: The response for AssignPermissionSet.
    s12.permissions.v1.ListPermissionSetsFilter:
      type: object
      properties:
        type:
          description: Filter by permission set type.
          allOf:
          - $ref: '#/components/schemas/s12.permissions.v1.PermissionSetType'
        seat_type:
          description: Filter by required seat type.
          allOf:
          - $ref: '#/components/schemas/s12.common.SubscriptionSeatTypes'
    s12.users.v1.ListUsersRequest:
      type: object
      properties:
        filters:
          description: 'Filter criteria. AND semantics across all populated filter fields.

            At least one filter must be set, or list_all must be true.'
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.ListUsersFilters'
        list_all:
          type: boolean
          description: 'Set to true to return all active users in the org with no filter applied.

            Required when filters is empty or absent. Prevents accidental full org scans.'
        page_size:
          type: integer
          format: int32
          description: 'Maximum number of users to return per page. Range: 1–200. Defaults to 50.'
        page_token:
          type: string
          description: 'Opaque pagination cursor returned by a previous ListUsers response.

            Omit to start from the beginning.'
      description: 'ListUsersRequest contains the parameters for listing users within the caller''s org.

        The organization is derived from the caller''s JWT token.

        Results are sorted by user_id ascending. No other sort order is supported in v1.'
    s12.permissions.v1.PermissionSetIdentifier:
      type: object
      properties:
        id:
          type: string
          description: The ID of the permission set.
        type:
          allOf:
          - $ref: '#/components/schemas/s12.permissions.v1.PermissionSetType'
          description: The type of the permission set (e.g. default or custom)
        name:
          type: string
          description: 'The name of the permission set. Free text set by a customer admin on

            CreatePermissionSet/UpdatePermissionSet — tagged pii since nothing

            prevents a personal name being entered.'
        description:
          type: string
          description: The description of the permission set. Same free-text risk as `name`.
        allowed_seat_types:
          type: array
          items:
            $ref: '#/components/schemas/s12.common.SubscriptionSeatTypes'
          description: The seat types allowed for the permission set. The first element is the "minimum" allowed seat type.
        supports_email_less:
          type: boolean
          description: 'Whether the permission set is applicable to users without an email-based

            username. False when the set grants any permission that is denylisted for

            non-email usernames (e.g. billing). Server-computed; ignored on writes.'
      description: Identifier for a permission set.
    s12.permissions.v1.ListPermissionSetsResponse:
      type: object
      properties:
        permission_sets:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.permissions.v1.PermissionSetWithUsers'
          description: The permission sets.
        total_results:
          type: integer
          format: int32
          description: The total number of results for the provided input.
      description: The response for ListPermissionSets.
    s12.common.SubscriptionSeatTypes:
      type: string
      enum:
      - SUBSCRIPTION_SEAT_TYPE_UNSPECIFIED
      - SUBSCRIPTION_SEAT_TYPE_PREMIUM
      - SUBSCRIPTION_SEAT_TYPE_COLLABORATOR
      - SUBSCRIPTION_SEAT_TYPE_LITE
      - SUBSCRIPTION_SEAT_TYPE_SERVICE_USER
      - SUBSCRIPTION_SEAT_TYPE_SUPPORT
      default: SUBSCRIPTION_SEAT_TYPE_UNSPECIFIED
      title: SubscriptionSeatTypes is a list of potential subscription seat types
    s12.users.userattribute.v1.UserAttributeService.SetUserAttributesBody:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.users.userattribute.v1.Attribute'
          description: Required. The list of attributes to set
    s12.thepub.v1.SearchUsersRequest:
      type: object
      properties:
        email:
          type: array
          items:
            type: string

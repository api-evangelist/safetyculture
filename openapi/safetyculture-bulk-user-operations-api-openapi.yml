openapi: 3.2.0
info:
  title: Mitti Bulk user operations API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Bulk user operations
paths:
  /users/v1/users/upsert:
    post:
      summary: Create or update users synchronously
      description: Performs bulk user creation or updates synchronously and returns the results in real time.
      operationId: UsersService_CreateOrUpdateUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUsersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUsersRequest'
        required: true
      tags:
      - Bulk user operations
  /users/v1/users/upsert/jobs:
    post:
      summary: Initialize a create-or-update users job
      description: Creates a new job to create or update users and returns a job ID for later execution.
      operationId: UsersService_InitCreateOrUpdateUsersJob
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.InitCreateOrUpdateUsersJobResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.v1.InitCreateOrUpdateUsersJobRequest'
        required: true
      tags:
      - Bulk user operations
  /users/v1/users/upsert/jobs/list:
    post:
      summary: List create-or-update users jobs
      description: Retrieves a list of all the create-or-update users jobs.
      operationId: UsersService_ListCreateOrUpdateUsersJobs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.ListCreateOrUpdateUsersJobsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.v1.ListCreateOrUpdateUsersJobsRequest'
        required: true
      tags:
      - Bulk user operations
  /users/v1/users/upsert/jobs/{job_id}:
    post:
      summary: Start a create-or-update users job
      description: Starts an initialized job to create or update users.
      operationId: UsersService_StartCreateOrUpdateUsersJob
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.StartCreateOrUpdateUsersJobResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: job_id
        description: The id of the job to start
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.users.v1.UsersService.StartCreateOrUpdateUsersJobBody'
        required: true
      tags:
      - Bulk user operations
    get:
      summary: Get a create-or-update users job
      description: Retrieves details of a create-or-update users job, including the submitted users and any validation results if the job has started.
      operationId: UsersService_GetCreateOrUpdateUsersJob
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.GetCreateOrUpdateUsersJobResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: job_id
        description: ID of the job to get status for.
        in: path
        required: true
        schema:
          type: string
      - name: limit
        description: Limit of users to return in the response.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: next_page_token
        description: Optional. The next page token to continue the lookup
        in: query
        required: false
        schema:
          type: string
      tags:
      - Bulk user operations
    delete:
      summary: Cancel a create-or-update users job
      description: Cancels a previously created job to create or update users.
      operationId: UsersService_CancelCreateOrUpdateUsersJob
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.users.v1.CancelCreateOrUpdateUsersJobResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: job_id
        description: The id of the job to start
        in: path
        required: true
        schema:
          type: string
      tags:
      - Bulk user operations
components:
  schemas:
    s12.users.v1.CreateOrUpdateUsersJob.Status:
      type: string
      enum:
      - STATUS_UNSPECIFIED
      - STATUS_PENDING
      - STATUS_ERRORED
      - STATUS_VALIDATING
      - STATUS_VALIDATED
      - STATUS_VALIDATED_WITH_ERRORS
      - STATUS_EXECUTING
      - STATUS_COMPLETED
      - STATUS_COMPLETED_WITH_ERRORS
      - STATUS_CANCELLED
      default: STATUS_UNSPECIFIED
      description: "PENDING --> ERRORED : Blocking errors (e.g. putting the job on the queue errored)\nPENDING --> VALIDATING\nPENDING --> CANCELLED\n\nVALIDATING --> VALIDATED : No errors\nVALIDATING --> VALIDATED_WITH_ERRORS : Non blocking errors\nVALIDATING --> ERRORED : Blocking errors (e.g. putting the job on the queue errored)\nVALIDATING --> EXECUTING\nVALIDATING --> CANCELLED\n\nEXECUTING --> COMPLETED : No errors\nEXECUTING --> COMPLETED_WITH_ERRORS : Non blocking errors\nEXECUTING --> ERRORED : Blocking errors\nEXECUTING --> CANCELLED\n```\n\n - STATUS_PENDING: Job pending validation.\n - STATUS_ERRORED: Job has critical blocking error.\n - STATUS_VALIDATING: Job is currently validating.\n - STATUS_VALIDATED: Job was successfully validated with no errors. Now pending create or update.\n - STATUS_VALIDATED_WITH_ERRORS: Job was validated, but there was non-blocking errors. Now pending create or update.\n - STATUS_EXECUTING: Job is currently creating or updating.\n - STATUS_COMPLETED: Job created or updated with no errors.\n - STATUS_COMPLETED_WITH_ERRORS: Job created or updated with non blocking errors.\n - STATUS_CANCELLED: Job was cancelled."
      title: '```mermaid

        stateDiagram-v2

        PENDING

        ERRORED

        VALIDATING

        VALIDATED

        VALIDATED_WITH_ERRORS

        EXECUTING

        COMPLETED

        COMPLETED_WITH_ERRORS

        CANCELLED'
    s12.users.v1.CreateOrUpdateUser.Attribute.Value:
      type: object
      properties:
        valid:
          type: boolean
          description: Indicates whether the value is valid and will be applied to the user.
        string_value:
          type: string
          description: The string value of a field.
        timestamp_value:
          type: string
          format: date-time
          description: The timestamp value of a field.
        uuid_value:
          description: The UUID value of a field.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Reference'
    s12.users.v1.UserFieldMap:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Field'
        value:
          type: integer
          format: int32
          description: The number of users with this field changed.
      description: UserFieldMap is a map of counts of user field changes for a given job.
    s12.users.v1.CreateOrUpdateUser.Memberships:
      type: object
      properties:
        remove:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Reference'
          description: References from which the user will be removed. ONLY supports "*" to remove from all existing references.
        add:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Reference'
          description: References to assign the user to. Each must be a valid, case-sensitive name or ID for the resource.
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/google.protobuf.Any'
    s12.users.v1.UserActionMap:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Action'
        value:
          type: integer
          format: int32
          description: The number of users with this action.
      description: UserActionMap is a map of counts of user actions for a given job.
    s12.users.v1.CreateOrUpdateResponseUser:
      type: object
      properties:
        operation:
          description: The operation that occurred or will occur.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Operation'
        user:
          description: The user being updated, references such as Group name will qualified to IDs.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser'
        errors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.ErrorDetails'
          description: Errors or warnings that occurred while attempting to add or update this user.
    s12.users.v1.CreateOrUpdateResponseUser.ErrorDetails.Reason:
      type: string
      enum:
      - REASON_UNSPECIFIED
      - REASON_INTERNAL
      - REASON_USER_EXISTS
      - REASON_USER_NOT_FOUND
      - REASON_DUPLICATE_ROW
      - REASON_DUPLICATE_USERNAME
      - REASON_MUST_HAVE_ID_OR_USERNAME
      - REASON_INVALID_ID_FORMAT
      - REASON_INVALID_USERNAME_FORMAT
      - REASON_ID_USERNAME_MISMATCH
      - REASON_FIELD_MANDATORY_FOR_CREATION
      - REASON_CANNOT_CREATE_DEACTIVATED_USERS
      - REASON_FIELD_CHANGE_NOT_ALLOWED_FOR_CALLER
      - REASON_INVALID_VALUE_GENERIC
      - REASON_INVALID_SEAT_PERMISSION_SET_COMBINATION
      - REASON_INVALID_VALUE_PASSWORD_TOO_WEAK
      - REASON_INVALID_VALUE_PASSWORD_CANNOT_UPDATE_USERS_PASSWORD
      - REASON_INVALID_VALUE_REFERENCE_NAME_DOES_NOT_FOUND
      - REASON_INVALID_VALUE_REFERENCE_ID_DOES_NOT_FOUND
      - REASON_PERMISSION_SET_PERMISSION_DENIED
      - REASON_PERMISSION_SET_USER_NOT_ACTIVE
      - REASON_PERMISSION_SET_NOT_FOUND
      - REASON_INVALID_PERMISSION_SET_FOR_ORGANISATION_TIER
      - REASON_USER_ATTRIBUTE_DUPLICATE_ATTRIBUTE
      - REASON_USER_ATTRIBUTE_NOT_FOUND
      - REASON_USER_ATTRIBUTE_INVALID_ATTRIBUTE_TYPE
      - REASON_USER_ATTRIBUTE_INVALID_SELECT_VALUE
      - REASON_USER_ATTRIBUTE_INVALID_USER_ID_VALUE
      - REASON_USER_ATTRIBUTE_INVALID_TIMESTAMP_VALUE
      - REASON_USER_ATTRIBUTE_INVALID_STRING_VALUE
      - REASON_INVALID_SEAT_TYPE_FOR_ORGANISATION_TIER
      - REASON_SEAT_LIMIT_REACHED
      - REASON_GROUP_NOT_FOUND
      - REASON_GROUP_DUPLICATE_ENTRY
      - REASON_GROUP_CANNOT_ASSIGN_TO_DEACTIVATED_USER
      - REASON_GROUP_INVALID_REMOVE_REFERENCE
      - REASON_GROUP_ASSOCIATION_LIMIT_REACHED
      - REASON_GROUP_REFERENCE_AMBIGUOUS
      - REASON_SITE_NOT_FOUND
      - REASON_SITE_DUPLICATE_ENTRY
      - REASON_SITE_CANNOT_ASSIGN_TO_DEACTIVATED_USER
      - REASON_USER_ALREADY_ASSIGNED_TO_ANCESTOR_SITE
      - REASON_SITE_INVALID_REMOVE_REFERENCE
      - REASON_SITE_ASSOCIATION_LIMIT_REACHED
      - REASON_SITE_REFERENCE_AMBIGUOUS
      - REASON_USER_ATTRIBUTE_DISABLED
      - REASON_LAST_ADMINISTRATOR
      - REASON_FIELD_VALUE_INVALID_MIN_LENGTH
      - REASON_FIELD_VALUE_INVALID_MAX_LENGTH
      - REASON_COMPANY_NOT_FOUND
      - REASON_COMPANY_DUPLICATE_ENTRY
      - REASON_COMPANY_CANNOT_ASSIGN_TO_DEACTIVATED_USER
      - REASON_COMPANY_INVALID_REMOVE_REFERENCE
      - REASON_COMPANY_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_CALLER
      - REASON_GROUP_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_DYNAMIC_GROUP
      - REASON_SITE_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_DYNAMIC_SITE
      - REASON_PERMISSION_SET_DOES_NOT_SUPPORT_EMAIL_LESS
      default: REASON_UNSPECIFIED
      description: " - REASON_UNSPECIFIED: Default failure value.\nAvoid using in favor of defining a specific failure case.\n - REASON_INTERNAL: Something went wrong but, we're not quite sure.\nAvoid using in favor of defining a specific failure case.\n - REASON_USER_EXISTS: User already exists with this username.\n - REASON_USER_NOT_FOUND: User ID was unable to be found.\n - REASON_DUPLICATE_ROW: Duplicate rows detected.\n - REASON_DUPLICATE_USERNAME: Duplicate username detected - Different to REASON_DUPLICATE_ROW, this is thrown if the user manages to get a username past our validation, but our internal system detects a duplicate.\n - REASON_MUST_HAVE_ID_OR_USERNAME: A record must have an ID or a username to support with updating.\n - REASON_INVALID_ID_FORMAT: ID is in an invalid format\n - REASON_INVALID_USERNAME_FORMAT: Username is in an invalid format\n - REASON_ID_USERNAME_MISMATCH: Username does not match existing username, username updates are currently not supported.\n - REASON_FIELD_MANDATORY_FOR_CREATION: The field referenced is mandatory for creation.\n - REASON_CANNOT_CREATE_DEACTIVATED_USERS: Cannot create deactivated users\n - REASON_FIELD_CHANGE_NOT_ALLOWED_FOR_CALLER: Caller does not have permission to change this field for this action type.\n - REASON_INVALID_VALUE_GENERIC: Generic invalid field value error.\nAvoid using in favor of defining a specific failure case.\n - REASON_INVALID_SEAT_PERMISSION_SET_COMBINATION: Invalid permission set/seat assignment.\n - REASON_INVALID_VALUE_PASSWORD_TOO_WEAK: Password does not match password requirements\n - REASON_INVALID_VALUE_PASSWORD_CANNOT_UPDATE_USERS_PASSWORD: Updating an existing users password is not supported\n - REASON_INVALID_VALUE_REFERENCE_NAME_DOES_NOT_FOUND: Invalid site, group, or attribute Name reference.\n - REASON_INVALID_VALUE_REFERENCE_ID_DOES_NOT_FOUND: Invalid site, group, or attribute ID reference.\n - REASON_PERMISSION_SET_PERMISSION_DENIED: Requester does not have the permission(s) needed to interact with Permission Sets for other users\n - REASON_PERMISSION_SET_USER_NOT_ACTIVE: The requested user is not active and therefore cannot have Permission Set interactions\n - REASON_PERMISSION_SET_NOT_FOUND: The requested Permission Set cannot be found in the organisation\n - REASON_INVALID_PERMISSION_SET_FOR_ORGANISATION_TIER: The Permission Set is not allowed to be associated with this type of organisation.\nEx: Trying to use a custom Permission Set in a Free organisation (which is only allowed in Paid orgs)\n - REASON_USER_ATTRIBUTE_DUPLICATE_ATTRIBUTE: User attribute has already been declared in the input for this user\n - REASON_USER_ATTRIBUTE_NOT_FOUND: User attribute could not be found in the user's organisation\n - REASON_USER_ATTRIBUTE_INVALID_ATTRIBUTE_TYPE: User attribute type is not supported.\nThis may indicate a new field type has been added, but the service has not been updated to work out how to sanitise it\n - REASON_USER_ATTRIBUTE_INVALID_SELECT_VALUE: Provided value is not one of the values allowed by this Select field\n - REASON_USER_ATTRIBUTE_INVALID_USER_ID_VALUE: Provided value cannot be coerced to a User ID format\n - REASON_USER_ATTRIBUTE_INVALID_TIMESTAMP_VALUE: Provided value cannot be coerced to a Timestamp format\n - REASON_USER_ATTRIBUTE_INVALID_STRING_VALUE: Provided String value is not allowed.\nEx: a non-nil, empty string\n - REASON_INVALID_SEAT_TYPE_FOR_ORGANISATION_TIER: Invalid seat type for the organisation tier, i.e. using lite seats on a free team.\n - REASON_SEAT_LIMIT_REACHED: The request exceeds the seat limit\n - REASON_GROUP_NOT_FOUND: Group is not found, or does not exist in the current organisation\n - REASON_GROUP_DUPLICATE_ENTRY: Group has already been declared in the input for this user\n - REASON_GROUP_CANNOT_ASSIGN_TO_DEACTIVATED_USER: Group is not allowed to be assigned to a user that is - or will be - deactivated\n - REASON_GROUP_INVALID_REMOVE_REFERENCE: Group remove reference is invalid\n - REASON_GROUP_ASSOCIATION_LIMIT_REACHED: User cannot be assigned to more then 100 groups\n - REASON_GROUP_REFERENCE_AMBIGUOUS: Group reference is ambiguous, i.e. multiple groups with the same name\n - REASON_SITE_NOT_FOUND: Site is not found, or does not exist in the current organisation\n - REASON_SITE_DUPLICATE_ENTRY: Site has already been declared in the input for this user\n - REASON_SITE_CANNOT_ASSIGN_TO_DEACTIVATED_USER: Site is not allowed to be assigned to a user that is - or will be - deactivated\n - REASON_USER_ALREADY_ASSIGNED_TO_ANCESTOR_SITE: User is already assigned to a site further up the hierarchy (ex: requesting Site, but user is already in ancestor Country)\n - REASON_SITE_INVALID_REMOVE_REFERENCE: Site remove reference is invalid\n - REASON_SITE_ASSOCIATION_LIMIT_REACHED: User is already associated with the maximum number of sites\n - REASON_SITE_REFERENCE_AMBIGUOUS: Site reference is ambiguous, i.e. multiple sites with the same name\n - REASON_USER_ATTRIBUTE_DISABLED: User attribute is disabled\n - REASON_LAST_ADMINISTRATOR: Changing this permission set, or status will remove the last admin for the org\n - REASON_FIELD_VALUE_INVALID_MIN_LENGTH: Field value does not meet the minimum length\n - REASON_FIELD_VALUE_INVALID_MAX_LENGTH: Field value does exceeds the maximum length\n - REASON_COMPANY_NOT_FOUND: Company is not found, or does not exist in the current organisation\n - REASON_COMPANY_DUPLICATE_ENTRY: Company has already been declared in the input for this user\n - REASON_COMPANY_CANNOT_ASSIGN_TO_DEACTIVATED_USER: Company is not allowed to be assigned to a user that is - or will be - deactivated\n - REASON_COMPANY_INVALID_REMOVE_REFERENCE: Company remove reference is invalid\n - REASON_COMPANY_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_CALLER: Caller does not have permissions to modify user membership for this company\n - REASON_GROUP_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_DYNAMIC_GROUP: Group membership cannot be manually assigned to dynamic groups with automated membership rules\n - REASON_SITE_MEMBERSHIP_CHANGE_NOT_ALLOWED_FOR_DYNAMIC_SITE: Site membership cannot be manually assigned to dynamic sites with automated membership rules\n - REASON_PERMISSION_SET_DOES_NOT_SUPPORT_EMAIL_LESS: The specified permission set cannot be applied to an email-less user."
    s12.users.v1.UsersService.StartCreateOrUpdateUsersJobBody:
      type: object
      properties:
        validate_only:
          type: boolean
          description: If this job should be validate only.
        email_settings:
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.EmailSettings'
          description: 'Optional. Email settings for new users that are created - defaults to sending an email if not provided.

            Overwritten by more specific EmailSettings on the individual user (as specified on InitCreateOrUpdateUsersJobRequest)'
        password_settings:
          description: Optional. Password settings for users in this job.
          allOf:
          - $ref: '#/components/schemas/s12.common.PasswordSettings'
    s12.users.v1.CancelCreateOrUpdateUsersJobResponse:
      type: object
      properties:
        job_id:
          type: string
    s12.common.Language:
      type: string
      enum:
      - LANGUAGE_UNSPECIFIED
      - LANGUAGE_EN_US
      - LANGUAGE_EN_GB
      - LANGUAGE_DE_DE
      - LANGUAGE_ES_ES
      - LANGUAGE_FR_FR
      - LANGUAGE_PT_BR
      - LANGUAGE_NL_NL
      default: LANGUAGE_UNSPECIFIED
      description: "- LANGUAGE_UNSPECIFIED: Language unspecified\n - LANGUAGE_EN_US: Language en-US\n - LANGUAGE_EN_GB: Language en-GB\n - LANGUAGE_DE_DE: Language de-DE\n - LANGUAGE_ES_ES: Language es-ES\n - LANGUAGE_FR_FR: Language fr-FR\n - LANGUAGE_PT_BR: Language pt-BR\n - LANGUAGE_NL_NL: Language nl-NL"
      title: Language represents the languages offered in SafetyCulture
    s12.users.v1.CreateOrUpdateResponseUser.Operation:
      type: object
      properties:
        action:
          description: The action that will/did take place.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Action'
        status:
          description: The status of the action.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Status'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Field'
          description: The fields to be updated.
    s12.users.v1.UserStatusMap:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateResponseUser.Status'
        value:
          type: integer
          format: int32
          description: The number of users with this status.
      description: UserStatusMap is a map of counts of user statuses for a given job.
    s12.users.v1.CreateOrUpdateResponseUser.Status:
      type: string
      enum:
      - STATUS_UNSPECIFIED
      - STATUS_PENDING
      - STATUS_ERRORED
      - STATUS_VALIDATED
      - STATUS_VALIDATED_WITH_ERRORS
      - STATUS_COMPLETED
      - STATUS_COMPLETED_WITH_ERRORS
      default: STATUS_UNSPECIFIED
      description: "PENDING --> ERRORED : Blocking errors (e.g. invalid username)\nPENDING --> VALIDATED : No errors\nPENDING --> VALIDATED_WITH_ERRORS : Non blocking errors\n\nVALIDATED --> ERRORED : Blocking errors (e.g. create failed)\nVALIDATED --> COMPLETED : No errors\nVALIDATED --> COMPLETED_WITH_ERRORS : Non blocking errors\n\nVALIDATED_WITH_ERRORS --> ERRORED : Blocking errors\nVALIDATED_WITH_ERRORS --> COMPLETED_WITH_ERRORS : Non blocking errors\n```\n\n - STATUS_PENDING: User pending validation.\n - STATUS_ERRORED: Critical blocking error.\n - STATUS_VALIDATED: User was successfully validated with no errors. Now pending create or update.\n - STATUS_VALIDATED_WITH_ERRORS: User was validated, but there was non-blocking errors. Now pending create or update.\n - STATUS_COMPLETED: User was created or updated with no errors.\n - STATUS_COMPLETED_WITH_ERRORS: User was created or updated with non blocking errors."
      title: '```mermaid

        stateDiagram-v2

        PENDING

        ERRORED

        VALIDATED

        VALIDATED_WITH_ERRORS

        COMPLETED

        COMPLETED_WITH_ERRORS'
    s12.users.v1.CreateOrUpdateUser:
      type: object
      properties:
        id:
          type: string
          description: Optional. At least one of `user_id` or `username` is REQUIRED. ID of the user for updates.
        username:
          type: string
          description: Either `user_id` or `username` is required. Represents the user's email address or username.
        first_name:
          type: string
          description: User's first name.
        last_name:
          type: string
          description: User's last name.
        password:
          type: string
          description: Password for the user. This field is used only during user creation.
        seat_type:
          description: 'User''s seat type: full, lite, or guest.'
          allOf:
          - $ref: '#/components/schemas/s12.common.SubscriptionSeatTypes'
        timezone:
          type: string
          description: Timezone, must be a valid timezone in the IANA time zone database.
        status:
          description: User's activation status.
          allOf:
          - $ref: '#/components/schemas/s12.common.UserActiveStatus'
        language:
          description: Language preference for the user. Follows the ISO-639 code. For example, `en-US`.
          allOf:
          - $ref: '#/components/schemas/s12.common.Language'
        permission_set:
          description: The permission set assigned to the user. Must be a valid name or ID.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Reference'
        groups:
          description: Groups the user is assigned to.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Memberships'
        sites:
          description: Sites the user is assigned to.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Memberships'
        companies:
          description: Contractor companies the user is assigned to.
          allOf:
          - $ref: '#/components/schemas/s12.users.v1.CreateOrUpdateUser.Memberships'
        attributes:
          type: array
          items:
            type: object

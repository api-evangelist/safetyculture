      description: "- TRIGGER_EVENT_INSPECTION_STARTED: @deprecated use TRIGGER_EVENT_INSPECTION_HAS_STARTED instead\n - TRIGGER_EVENT_INSPECTION_UPDATED: @deprecated use TRIGGER_EVENT_INSPECTION_METADATA or\nTRIGGER_EVENT_INSPECTION_ITEM_UPDATED instead\n - TRIGGER_EVENT_INSPECTION_COMPLETED: @deprecated use TRIGGER_EVENT_INSPECTION_COMPLETED_STATUS instead\n - TRIGGER_EVENT_INSPECTION_ARCHIVED: @deprecated use TRIGGER_EVENT_INSPECTION_ARCHIVED_STATUS instead\n - TRIGGER_EVENT_INSPECTION_UNARCHIVED: @deprecated use TRIGGER_EVENT_INSPECTION_ARCHIVED_STATUS instead\n - TRIGGER_EVENT_INSPECTION: TRIGGER_EVENT_INSPECTION is a bundle trigger event\nequivalent to subscribing to all inspection events\n - TRIGGER_EVENT_INSPECTION_METADATA: TRIGGER_EVENT_INSPECTION_METADATA is a bundle trigger event\nequivalent to subscribing to 8-17 individually\n - TRIGGER_EVENT_INSPECTION_ITEM_UPDATED: TRIGGER_EVENT_INSPECTION_ITEM_UPDATED is a bundle trigger event\nequivalent to subscribing to 19-33 individually\n - TRIGGER_EVENT_ACTION_CREATED: Action Created\n - TRIGGER_EVENT_ACTION_TITLE_UPDATED: Action title updated\n - TRIGGER_EVENT_ACTION_DESCRIPTION_UPDATED: Action description updated\n - TRIGGER_EVENT_ACTION_DATE_DUE_UPDATED: Action Due Date Updated\n - TRIGGER_EVENT_ACTION_STATUS_UPDATED: Action Status Updated\n - TRIGGER_EVENT_ACTION_PRIORITY_UPDATED: Action Priority Updated\n - TRIGGER_EVENT_ACTION_COLLABORATORS_REMOVED: Action Collaborators Removed\n - TRIGGER_EVENT_ACTION_COLLABORATORS_ADDED: Action Collaborators Added\n - TRIGGER_EVENT_ACTION_CATEGORY_UPDATED: Action Category Updated\n - TRIGGER_EVENT_ACTION_SITE_UPDATED: Action Site Updated\n - TRIGGER_EVENT_ACTION_DELETED: Action Deleted\n - TRIGGER_EVENT_ACTION_ORG_UPDATED: Action Organisation Updated\n - TRIGGER_EVENT_ACTION_COLLABORATORS_UPDATED: Action Collaborators Updated\n - TRIGGER_EVENT_ACTION_ASSET_UPDATED: Action Asset Updated\n - TRIGGER_EVENT_ACTION_LABELS_UPDATED: Action Labels Updated\n - TRIGGER_EVENT_ACTION_UPDATED: Any action field updated\n - TRIGGER_EVENT_INCIDENT_CREATED: Incident (a.k.a. Issue) created\n - TRIGGER_EVENT_INCIDENT_TITLE_UPDATED: Incident title updated\n - TRIGGER_EVENT_INCIDENT_DESCRIPTION_UPDATED: Incident description updated\n - TRIGGER_EVENT_INCIDENT_DATE_DUE_UPDATED: Incident Due Date Updated\n - TRIGGER_EVENT_INCIDENT_STATUS_UPDATED: Incident Status Updated\n - TRIGGER_EVENT_INCIDENT_PRIORITY_UPDATED: Incident Priority Updated\n - TRIGGER_EVENT_INCIDENT_COLLABORATORS_REMOVED: Incident Collaborators Removed\n - TRIGGER_EVENT_INCIDENT_COLLABORATORS_ADDED: Incident Collaborators Added\n - TRIGGER_EVENT_INCIDENT_CATEGORY_UPDATED: Incident Category Updated\n - TRIGGER_EVENT_INCIDENT_SITE_UPDATED: Incident Site Updated\n - TRIGGER_EVENT_INCIDENT_DELETED: Incident Deleted\n - TRIGGER_EVENT_INCIDENT_ORG_UPDATED: Incident Organisation Updated\n - TRIGGER_EVENT_INCIDENT_COLLABORATORS_UPDATED: Incident Collaborators Updated\n - TRIGGER_EVENT_INCIDENT_UPDATED: Any incident field updated\n - TRIGGER_EVENT_MEDIA_UPLOADED: Media uploaded\n - TRIGGER_EVENT_TRAINING_COURSE_OPENED: A user has opened a course\n - TRIGGER_EVENT_TRAINING_COURSE_COMPLETED: A user has completed a course\n - TRIGGER_EVENT_TRAINING_COURSE_EXPIRED: A user's course completion has expired\n - TRIGGER_EVENT_TRAINING_COURSE_RESET: A user's course progress has been reset\n - TRIGGER_EVENT_TRAINING_LESSON_OPENED: A user has opened a lesson\n - TRIGGER_EVENT_TRAINING_LESSON_COMPLETED: A user has completed a lesson\n - TRIGGER_EVENT_TRAINING_COURSE_CREATED: A course was created\n - TRIGGER_EVENT_TRAINING_COURSE_UPDATED: A course was updated\n - TRIGGER_EVENT_TRAINING_COURSE_PUBLISHED: A course was published\n - TRIGGER_EVENT_TRAINING_COURSE_REPUBLISHED: A course was re-published\n - TRIGGER_EVENT_TRAINING_COURSE_UNPUBLISHED: A course was unpublished\n - TRIGGER_EVENT_TRAINING_COURSE_DELETED: A course was deleted\n - TRIGGER_EVENT_TRAINING_COURSE_ENROLLED: A user was enrolled in a course\n - TRIGGER_EVENT_TRAINING_QUIZ_SESSION_STARTED: A user has started a quiz session\n - TRIGGER_EVENT_TRAINING_QUIZ_SESSION_RETRIED: A user has retried a quiz session\n - TRIGGER_EVENT_TRAINING_LESSON_CREATED: A lesson was created\n - TRIGGER_EVENT_TRAINING_LESSON_UPDATED: A lesson was updated\n - TRIGGER_EVENT_TRAINING_LESSON_PUBLISHED: A lesson was published\n - TRIGGER_EVENT_TRAINING_LESSON_UNPUBLISHED: A lesson was unpublished\n - TRIGGER_EVENT_TRAINING_LESSON_DELETED: A lesson was deleted\n - TRIGGER_EVENT_ATTENDANCE_SIGNED_ON: A worker signed on to a site: their stay opened.\n - TRIGGER_EVENT_ATTENDANCE_SIGNED_OFF: A worker signed off a site, moved to another site, or the register closed\ntheir stay. The payload distinguishes an observed sign-off from an inferred\none."
      title: Webhook trigger event types

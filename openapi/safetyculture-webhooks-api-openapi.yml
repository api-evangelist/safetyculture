openapi: 3.2.0
info:
  title: Mitti Webhooks API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Webhooks
paths:
  /webhooks/v1/token:
    get:
      summary: Get signature secret
      operationId: WebhooksService_GetToken
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.GetTokenResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      tags:
      - Webhooks
    post:
      summary: Regenerate signature secret
      operationId: WebhooksService_GenerateToken
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.GenerateTokenResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.webhooks.v1.GenerateTokenRequest'
        description: The parameters for `GenerateToken`
        required: true
      tags:
      - Webhooks
  /webhooks/v1/webhooks:
    get:
      summary: List webhooks
      operationId: WebhooksService_ListWebhooks
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.ListWebhooksResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      tags:
      - Webhooks
    post:
      summary: Create a webhook
      operationId: WebhooksService_CreateWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.CreateWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.webhooks.v1.CreateWebhookRequest'
        description: The parameters for `CreateWebhook`
        required: true
      tags:
      - Webhooks
  /webhooks/v1/webhooks/{webhook_id}:
    get:
      summary: Get a webhook
      operationId: WebhooksService_GetWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.GetWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: webhook_id
        description: The unique identifier for the webhook.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Webhooks
    delete:
      summary: Delete a webhook
      operationId: WebhooksService_DeleteWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.DeleteWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: webhook_id
        description: The webhook unique identifier.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Webhooks
    put:
      summary: Update a webhook
      operationId: WebhooksService_UpdateWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.webhooks.v1.UpdateWebhookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: webhook_id
        description: The webhook unique identifier.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.webhooks.v1.WebhooksService.UpdateWebhookBody'
        required: true
      tags:
      - Webhooks

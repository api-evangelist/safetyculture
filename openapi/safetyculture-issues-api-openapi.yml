openapi: 3.2.0
info:
  title: Mitti Issues API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Issues
paths:
  /tasks/v1/customerconfiguration/categories:
    get:
      summary: List Categories
      operationId: CustomerConfigurationService_GetCategories
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.tasks.v1.GetCategoriesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: include_deleted
        description: 'Optional. If this is set to true, all categories including deleted

          categories will be returned.'
        in: query
        required: false
        schema:
          type: boolean
      - name: search
        description: Search used to search for specific named categories
        in: query
        required: false
        schema:
          type: string
      - name: category_ids
        description: Define specific categoryIDs to filter for
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: page_token
        description: Page token used to scroll for the next set of categories
        in: query
        required: false
        schema:
          type: string
      - name: page_size
        description: Number of categories to respond with
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort_direction
        description: Optional. Direction for sorting.
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_DIRECTION_UNSPECIFIED
          - SORT_DIRECTION_ASC
          - SORT_DIRECTION_DESC
          default: SORT_DIRECTION_UNSPECIFIED
      - name: is_managing
        description: 'Optional. Flag to indicate if the categories are being fetched to manage categories

          if true, the `"admin:incidents"` permission will be required, and category visibility is ignored.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Issues
  /tasks/v1/incident/{id}:
    get:
      summary: Get Issue
      operationId: IncidentsService_GetIncidentById
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.tasks.v1.IncidentResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: 'Required. The unique ID of the incident to retrieve. Can either be a uuid

          or a org level unique incident id. Example: IS-4352'
        in: path
        required: true
        schema:
          type: string
      tags:
      - Issues

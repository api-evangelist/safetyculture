components:
  schemas:
    s12.tasks.v1.IncidentsService.UpdateCategoryBody:
      type: object
      properties:
        category_id:
          type: string
          description: 'Required. The new category UUID for the issue.

            Call the `GetCategories` endpoint to get the available categories.'
        modified_at:
          type: string
          format: date-time
          description: Optional. The timestamp of when this event occurred.
      title: UpdateCategoryRequest represents the parameters to `UpdateCategory`
      required:
      - category_id
    s12.tasks.v1.Task.ExternalUser:
      type: object
      properties:
        id:
          type: string
          description: The UUID uniquely identifying this external user.
        email:
          type: string
          description: The email address of the external user.
      description: The external user that is assigned to a task.
    s12.tasks.v1.Task.IncidentContext:
      type: object
      properties:
        title:
          type: string
          description: Title of the incident
        description:
          type: string
          description: Description of the incident
        creator:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.Task.User'
          description: User that created the incident
        status_id:
          type: string
          description: Status ID of the incident
        category_id:
          type: string
          description: Category of the incident
        due_at:
          type: string
          format: date-time
          description: Date/time the incident is due
        priority_id:
          type: string
          description: Priority ID of the incident
        unique_id:
          type: string
          description: The human readable unique ID of the incident
        collaborators:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.tasks.v1.Task.Collaborator'
          description: The collaborators of the incident
      title: context of an incident associated with the action
    s12.tasks.v1.DeleteIncidentsRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: The list of issue UUIDs to be deleted.
        modified_at:
          type: string
          format: date-time
          description: Optional. The UTC time and date the deletion took place.
      description: DeleteIncidentsRequest represents the list of issue UUIDs to delete.
      required:
      - ids
    s12.tasks.v1.TaskTemplate:
      type: object
      properties:
        template_id:
          type: string
          description: The unique identifier of the template.
        name:
          type: string
          description: Custom defined template name.
        is_deleted:
          type: boolean
        is_archived:
          type: boolean
        is_access_denied:
          type: boolean
        owner_id:
          type: string
          description: The id of the owner of the template
      description: Metadata related to the template associated with this action.
    s12.tasks.v1.GetIncidentsRequest.Filter.TaskID:
      type: object
      properties:
        operator:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.GetIncidentsRequest.Filter.FilterOperator'
          description: 'optional. Default to FilterOperator.IN and should only be

            FilterOperator.IN'
        value:
          type: array
          items:
            type: string
          description: 'OR relation, represents the task_id should be

            one of the value provided'
      title: task id filter
    s12.tasks.v1.Task.ActionContext:
      type: object
      properties:
        title:
          type: string
          description: Title of the action
        description:
          type: string
          description: Description of the action
        creator:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.Task.User'
          description: User that created the action
        status:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.Task.Status'
          description: Status ID of the action
        due_at:
          type: string
          format: date-time
          description: Date/time the action is due
        priority_id:
          type: string
          description: Priority ID of the action
        unique_id:
          type: string
          description: The human readable unique ID of the action
        collaborators:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.tasks.v1.Task.Collaborator'
          description: The collaborators of the action
        inspection:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.Task.Inspection'
          description: The inspection of the related action (if relevant)
        type:
          allOf:
          - $ref: '#/components/schemas/s12.tasks.v1.Type'
          description: The type id and label associated with the action
      title: context of an action associated with the incident
    s12.tasks.v1.Task.ListAnswer:
      type: object
      properties:
        responses:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.tasks.v1.Task.ListResponse'
          description: Responses of inspection item
      title: Answer returned for ListItem
    s12.common.MediaType:
      type: string
      enum:
      - MEDIA_TYPE_IMAGE
      - MEDIA_TYPE_VIDEO
      - MEDIA_TYPE_PDF
      - MEDIA_TYPE_DOCX
      - MEDIA_TYPE_XLSX
      - MEDIA_TYPE_PPTX
      - MEDIA_TYPE_CSV
      description: " - MEDIA_TYPE_IMAGE: An image file (GIF, JPG, PNG, WEBP).\n - MEDIA_TYPE_VIDEO: A video file (MP4, MOV).\n - MEDIA_TYPE_PDF: A PDF document.\n - MEDIA_TYPE_DOCX: A Microsoft Word document (DOCX, DOC).\n - MEDIA_TYPE_XLSX: A Microsoft Excel spreadsheet (XLSX, XLS).\n - MEDIA_TYPE_PPTX: A Microsoft PowerPoint presentation (PPTX, PPT).\n - MEDIA_TYPE_CSV: A CSV file."
    s12.common.v1.AiMarking:
      type: object
      properties:
        ai_edited:
          type: boolean
          description: 'True when something non deterministic, in practice an LLM, produced or

            changed this content. False when no AI did, which includes content a person

            wrote and content a deterministic path produced. Absent when the origin was

            not recorded. Do not report false in place of absent.'
        human_edited:
          type: boolean
          description: 'True when a person authored or changed this content. False when no person

            did, which includes content a model generated and content a deterministic

            path produced. Absent when the origin was not recorded. Do not report false

            in place of absent.'
      description: "AiMarking carries the AI marking fact on an API representation, so a machine\ncan read whether AI and whether a person produced or changed the content.\nIt is the read side of the express path: one shared message with standard\nproperty names, rather than every domain inventing its own field for the\nsame fact.\n\nBoth fields are presence tracked. The three states each carry a different\nmeaning and must not be collapsed:\n\n  true    The actor named by the field produced or changed this content.\n  false   The actor named by the field is known not to have produced or\n          changed this content. It is a claim about that actor only.\n  absent  We did not record the origin.\n\nfalse is not evidence that a deterministic path produced the content. Known\nhuman only content can read ai_edited false, and known AI only content can\nread human_edited false. Set a field to false only when you know it is false.\nLeave it absent when you do not, so a consumer relying on the API for their\nown obligation can tell \"not true\" from \"not recorded\". EU AI Act Article\n50(2), engineering approach page."
    s12.tasks.v1.GetIncidentsRequest.Filter.AssigneeID:
      type: object
      properties:
        operator:

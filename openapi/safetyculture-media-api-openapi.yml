openapi: 3.2.0
info:
  title: Mitti Media API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Media
paths:
  /media/v1/download/{id}:
    get:
      summary: Get media download URL
      description: ' '
      operationId: MediaService_GetDownloadSignedURL
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.media.v1.SignedURLResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The unique identifier for the media item.
        in: path
        required: true
        schema:
          type: string
      - name: token
        description: The given token, unique for each media item, to grant access.
        in: query
        required: true
        schema:
          type: string
      - name: download_as_attachment_name
        description: 'Indicates the object should be downloaded as an attachment and

          saved with the given name.

          At the least, the file name should contain a name plus a 3-letter file

          extension e.g. test.png, conditions.pdf, a.jpg.'
        in: query
        required: false
        schema:
          type: string
      - name: media_type
        description: "The media type associated with the download request.\n\n - MEDIA_TYPE_IMAGE: An image file (GIF, JPG, PNG, WEBP).\n - MEDIA_TYPE_VIDEO: A video file (MP4, MOV).\n - MEDIA_TYPE_PDF: A PDF document.\n - MEDIA_TYPE_DOCX: A Microsoft Word document (DOCX, DOC).\n - MEDIA_TYPE_XLSX: A Microsoft Excel spreadsheet (XLSX, XLS).\n - MEDIA_TYPE_PPTX: A Microsoft PowerPoint presentation (PPTX, PPT).\n - MEDIA_TYPE_CSV: A CSV file."
        in: query
        required: false
        schema:
          type: string
          enum:
          - MEDIA_TYPE_IMAGE
          - MEDIA_TYPE_VIDEO
          - MEDIA_TYPE_PDF
          - MEDIA_TYPE_DOCX
          - MEDIA_TYPE_XLSX
          - MEDIA_TYPE_PPTX
          - MEDIA_TYPE_CSV
          default: MEDIA_TYPE_NONE_UNSPECIFIED
      tags:
      - Media
components:
  schemas:
    s12.media.v1.Upload.MultipartUpload:
      type: object
      properties:
        upload_id:
          type: string
          description: 'This parameter is the upload id generated by S3 when initiating a new

            multipart upload Used as an identifier of a multipart upload session'
        upload_bodies:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.media.v1.Upload.MultipartUpload.UploadPartBody'
    s12.media.v1.Download.Stream:
      type: object
      properties:
        stream_url:
          type: string
          description: URL to the HLS manifest file, used to start the streaming
        cookies:
          type: array
          items:
            type: string
          description: List of cookies to be used when requesting resource from CloudFront.
      title: Messages to be used for video streaming with HLS files
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := ptypes.MarshalAny(foo)\n     ...\n     foo := &pb.Foo{}\n     if err := ptypes.UnmarshalAny(any, foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    s12.media.v1.Upload.MultipartUpload.UploadPartBody:
      type: object
      properties:
        url:
          type: string
          description: Destination url to upload the part
        part_number:
          type: string
          format: int64
          description: Number of the part in the multipart uploading sequence
      description: 'This parameter returns the multi-part signed URL and part number

        representing the position of a part in the upload sequence for AmazonS3

        multi-part upload. It will return N number of UploadPartBody, each one is

        used to upload one part of the whole file. An UploadPartBody will be

        returned only if the file size is more than 10MB. Note that all parts

        except the last one should be larger than 5MB or the upload will fail.

        Each url is only valid for 10 minutes; this is from the first bytes

        received i.e. if upload started within 10 minutes, it is still valid even

        if upload takes more than 10 minutes to complete.'
    s12.media.v1.Download:
      type: object
      properties:
        stream_info:
          $ref: '#/components/schemas/s12.media.v1.Download.Stream'
        mp4_info:
          $ref: '#/components/schemas/s12.media.v1.Download.MP4'
      title: Information to be included for download in SignedURLResponse
    s12.media.v1.Upload:
      type: object
      properties:
        multipart_upload:
          $ref: '#/components/schemas/s12.media.v1.Upload.MultipartUpload'
      title: Information to be included for upload in SignedURLResponse
    s12.media.v1.MediaSource:
      type: string
      enum:
      - MEDIA_SOURCE_UNSPECIFIED
      - MEDIA_SOURCE_AI_GENERATED
      default: MEDIA_SOURCE_UNSPECIFIED
      description: "MediaSource identifies which client uploaded the media, not who authored its\ncontent. Unset means a user upload.\n\n - MEDIA_SOURCE_AI_GENERATED: Set for all AI-service uploads, including re-encoded copies of user media."
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/google.protobuf.Any'
    s12.media.v1.Download.MP4:
      type: object
      properties:
        url:
          type: string
          description: Signed url to download the MP4 file
        captions_url:
          type: string
          description: Signed url to download the captions file for the video
      title: Message to be used for the MP4 video file object
    s12.media.v1.SignedURLResponse:
      type: object
      properties:
        url:
          type: string
          description: 'The url has been deprecated for upload paths. For download paths, it is

            still valid. The signed URL that can be used to upload or download the

            media to the S12 system. UploadSignedURL is only valid for 5 minutes and

            DownloadSignedURL for 20 minutes; this is from the first bytes received

            i.e. if upload started within 5 minutes, it is still valid even if upload

            takes 10 minutes to complete. It is safe to reject a signed URL and

            re-request a new Upload/Download Signed URL.'
        upload_info:
          $ref: '#/components/schemas/s12.media.v1.Upload'
        download_info:
          $ref: '#/components/schemas/s12.media.v1.Download'
        source:
          $ref: '#/components/schemas/s12.media.v1.MediaSource'
      title: The URL response from `GetUploadSignedURL` and `GetDownloadSignedURL`
  securitySchemes:
    BearerAuthentication:
      type: http
      scheme: bearer

openapi: 3.2.0
info:
  title: Mitti Documents API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Documents
paths:
  /documents/v1:
    post:
      summary: Create a file
      description: Create a new file in Documents and return a URL to upload the file content to.
      operationId: DocumentsPublicService_CreateFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.CreateFileResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.CreateFileRequest'
        required: true
      tags:
      - Documents
  /documents/v1/archive/{item_id}:
    post:
      summary: Archive a file or folder
      description: Archive a file or folder in Documents.
      operationId: DocumentsPublicService_ArchiveItem
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.ArchiveItemResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: item_id
        description: 'The ID of the item (file or folder) you want to archive.

          To get the `item_id`, open the item in the SafetyCulture web app and copy the last part of the URL.

          For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

          the item ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.DocumentsPublicService.ArchiveItemBody'
        required: true
      tags:
      - Documents
  /documents/v1/bulk/add_owners:
    post:
      summary: Bulk add file owners
      description: Add owners (users or groups) to multiple files without removing existing owners.
      operationId: DocumentsPublicService_BulkAddFileOwners
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.BulkAddFileOwnersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.BulkAddFileOwnersRequest'
        description: Request to add owners to multiple files without removing existing owners.
        required: true
      tags:
      - Documents
  /documents/v1/bulk/remove_owners:
    post:
      summary: Bulk remove file owners
      description: Remove owners (users or groups) from multiple files.
      operationId: DocumentsPublicService_BulkRemoveFileOwners
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.BulkRemoveFileOwnersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.BulkRemoveFileOwnersRequest'
        description: Request to remove owners from multiple files.
        required: true
      tags:
      - Documents
  /documents/v1/bulk/update_owners:
    post:
      summary: Bulk update file owners
      description: Replace the existing owners (users or groups) of multiple files.
      operationId: DocumentsPublicService_BulkUpdateFileOwners
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.BulkUpdateFileOwnersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.BulkUpdateFileOwnersRequest'
        description: Request to update and replace the existing owners of multiple files.
        required: true
      tags:
      - Documents
  /documents/v1/children:
    post:
      summary: Get folder items
      description: Retrieve the files and folders within a specified folder.
      operationId: DocumentsPublicService_GetFolderChildren
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.GetFolderChildrenResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.GetFolderChildrenRequest'
        description: Request to get the children (files and folders) of a specified folder.
        required: true
      tags:
      - Documents
  /documents/v1/link:
    post:
      summary: Link files
      description: Link files to other areas of the platform, such as an asset.
      operationId: DocumentsPublicService_LinkFiles
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.LinkFilesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.LinkFilesRequest'
        required: true
      tags:
      - Documents
  /documents/v1/move/{item_id}:
    post:
      summary: Move a file or folder
      description: Move a file or folder to a different folder in Documents.
      operationId: DocumentsPublicService_MoveItem
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.MoveItemResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: item_id
        description: 'The ID of the item (file or folder) you want to move.

          To get the `item_id`, open the item in the SafetyCulture web app and copy the last part of the URL.

          For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

          the item ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.DocumentsPublicService.MoveItemBody'
        required: true
      tags:
      - Documents
  /documents/v1/search:
    post:
      summary: Search files and folders
      description: Search for files and folders in Documents.
      operationId: DocumentsPublicService_SearchItems
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.SearchItemsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.SearchItemsRequest'
        description: Request to search the files and folders.
        required: true
      tags:
      - Documents
  /documents/v1/{file_id}:
    patch:
      summary: Update a file
      description: Update an existing file's metadata or content.
      operationId: DocumentsPublicService_UpdateFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.documents.v1.UpdateFileResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: file_id
        description: 'The ID of the file you want to update.

          To get the `file_id`, open the file in the SafetyCulture web app and copy the last part of the URL.

          For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

          the file ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.documents.v1.DocumentsPublicService.UpdateFileBody'
        required: true
      tags:
      - Documents
components:
  schemas:
    s12.documents.v1.UpdateFileRequest.Description:
      type: object
      properties:
        value:
          type: string
      description: The new description of the file. Maximum of 1000 characters and must exclude invalid characters.
    s12.documents.v1.BulkUpdateFileOwnersResponse:
      type: object
      title: Response for the BulkUpdateFileOwners request
    s12.documents.v1.UpdateFileResponse:
      type: object
      properties:
        upload_url:
          type: string
          description: The URL where you must upload the file’s binary content. It is valid for 20 minutes.
        version_number:
          type: integer
          format: int32
          description: The version number of the file after the update.
      title: Response for the UpdateFile request
    s12.documents.v1.LinkFilesRequest:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
          description: 'The ids of the files to be linked

            To get the `file_id`, open the file in the SafetyCulture web app and copy the last part of the URL.

            For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

            the file ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        entity_ids:
          type: array
          items:
            type: string
          description: 'The ids of the entities that the file(s) are being linked to

            To get the `entity_id`, open the entity (e.g. asset) in the SafetyCulture web app and copy the last part of the URL.

            For example, in this link `https://app.safetyculture.com/assets/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

            the entity ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        domain:
          allOf:
          - $ref: '#/components/schemas/s12.documents.v1.LinkedFileDomain'
          description: 'The domain of the entity that the file(s) are being linked to

            If the entity is an asset, use `DOMAIN_ASSET`'
      title: Request to link documents to other areas of the platform e.g. an asset
      required:
      - entity_ids
      - domain
    s12.documents.v1.BulkUpdateFileOwnersRequest:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the files you want to update the owners of.

            To get the `file_id`, open the file in the SafetyCulture web app and copy the last part of the URL.

            For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

            the file ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        user_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the users you want to add as owners. Existing owners will be removed.

            To get the `user_id`, open the user in the SafetyCulture web app and copy the last part of the URL before /profile.

            For example, in this link `https://app.safetyculture.com/organisation/role_d7b113c0c6774a59b8cfdea1ab1da89a/users/user_7a7cddac38ac4dd197304ba0d05b981a/profile`,

            the user ID is `user_7a7cddac38ac4dd197304ba0d05b981a`.'
        group_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the groups you want to add as owners.

            To get the `group_id`, open the group in the SafetyCulture web app and copy the last part of the URL before /users.

            For example, in this link `https://app.safetyculture.com/organisation/role_d7b113c0c6774a59b8cfdea1ab1da89a/groups/role_1ebbbca147644b5aa4ea646429f941e7/users`,

            the group ID is `role_1ebbbca147644b5aa4ea646429f941e7`.'
      description: Request to update and replace the existing owners of multiple files.
      required:
      - file_ids
    s12.documents.v1.CreateFileResponse:
      type: object
      properties:
        file_id:
          type: string
          description: The ID of the file that was created.
        upload_url:
          type: string
          description: 'The URL where you must upload the file’s binary content.

            It is valid for 20 minutes.'
        path:
          type: string
          description: If provided, the full folder path where the file was stored.
        name:
          type: string
          description: The name of the created file.
      title: Response for the CreateFile request
    s12.documents.v1.ParentFolder:
      type: object
      properties:
        folder_id:
          type: string
          description: The ID of the parent folder
        name:
          type: string
          description: The name of the parent folder
      title: Object representing the parent folder of a file or folder
    s12.documents.v1.BulkRemoveFileOwnersResponse:
      type: object
      title: Response for the BulkRemoveFileOwners request
    s12.documents.v1.DocumentsPublicService.ArchiveItemBody:
      type: object
      description: Request to archive an item (file or folder).
    s12.documents.v1.LinkFilesResponse.LinkedFile:
      type: object
      properties:
        file_id:
          type: string
          description: The ID of the file that was linked.
        entity_id:
          type: string
          description: The ID of the entity that the file is linked to.
        link_id:
          type: string
          description: The ID of the link that was created. Link ID is a unique identifier for the link used to retrieve the link details.
    s12.documents.v1.DocumentsPublicService.UpdateFileBody:
      type: object
      properties:
        file_type:
          description: 'The type of the file to be created.

            Please note that videos are currently not supported.'
          allOf:
          - $ref: '#/components/schemas/s12.common.MediaType'
        file_size:
          type: integer
          format: int64
          description: The size of the file in bytes. Must not exceed 50MB. This field is required if `file_type` is provided.
        name:
          type: string
          description: The new name of the file. Maximum of 255 characters and must exclude invalid characters.
        description:
          $ref: '#/components/schemas/s12.documents.v1.UpdateFileRequest.Description'
        owners:
          $ref: '#/components/schemas/s12.documents.v1.UpdateFileRequest.Owners'
        valid_to:
          description: The expiry date of the file. Set year, month, and day to 0 to clear the file's expiry date.
          allOf:
          - $ref: '#/components/schemas/google.type.Date'
        file_extension:
          type: string
          description: 'The file extension of the uploaded blob (e.g. "pdf", "jpg"), without the leading dot.

            Used to populate the file''s extension when the extension cannot be derived from `name`

            or the underlying media metadata is unavailable.'
      title: Request to update the file with the specified ID
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := ptypes.MarshalAny(foo)\n     ...\n     foo := &pb.Foo{}\n     if err := ptypes.UnmarshalAny(any, foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    s12.documents.v1.SearchItemsResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.Folder'
          description: List of folders that match the search criteria.
        files:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.File'
          description: List of files that match the search criteria.
        total:
          type: integer
          format: int32
          description: Total number of files and folders that match the search criteria.
        next_page_token:
          type: string
          description: The token used to retrieve the next page of results. Empty if there are no more items.
      title: Response for the SearchItems request
    s12.documents.v1.BulkAddFileOwnersRequest:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the files you want to add owners to.

            To get the `file_id`, open the file in the SafetyCulture web app and copy the last part of the URL.

            For example, in this link `https://app.safetyculture.com/documents/document/765aa2e6-69cb-43b5-8ab4-48ab26e2a094`,

            the file ID is `765aa2e6-69cb-43b5-8ab4-48ab26e2a094`.'
        user_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the users you want to add as owners.

            To get the `user_id`, open the user in the SafetyCulture web app and copy the last part of the URL before /profile

            For example, in this link `https://app.safetyculture.com/organisation/role_d7b113c0c6774a59b8cfdea1ab1da89a/users/user_7a7cddac38ac4dd197304ba0d05b981a/profile`,

            the user ID is `user_7a7cddac38ac4dd197304ba0d05b981a`.'
        group_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the groups you want to add as owners.

            To get the `group_id`, open the group in the SafetyCulture web app and copy the last part of the URL before /users.

            For example, in this link `https://app.safetyculture.com/organisation/role_d7b113c0c6774a59b8cfdea1ab1da89a/groups/role_1ebbbca147644b5aa4ea646429f941e7/users`,

            the group ID is `role_1ebbbca147644b5aa4ea646429f941e7`.'
      description: Request to add owners to multiple files without removing existing owners.
      required:
      - file_ids
    s12.documents.v1.MoveItemResponse:
      type: object
      title: Response for the MoveItem request
    s12.common.MediaType:
      type: string
      enum:
      - MEDIA_TYPE_IMAGE
      - MEDIA_TYPE_VIDEO
      - MEDIA_TYPE_PDF
      - MEDIA_TYPE_DOCX
      - MEDIA_TYPE_XLSX
      - MEDIA_TYPE_PPTX
      - MEDIA_TYPE_CSV
      description: " - MEDIA_TYPE_IMAGE: An image file (GIF, JPG, PNG, WEBP).\n - MEDIA_TYPE_VIDEO: A video file (MP4, MOV).\n - MEDIA_TYPE_PDF: A PDF document.\n - MEDIA_TYPE_DOCX: A Microsoft Word document (DOCX, DOC).\n - MEDIA_TYPE_XLSX: A Microsoft Excel spreadsheet (XLSX, XLS).\n - MEDIA_TYPE_PPTX: A Microsoft PowerPoint presentation (PPTX, PPT).\n - MEDIA_TYPE_CSV: A CSV file."
    s12.documents.v1.Site:
      type: object
      properties:
        site_id:
          type: string
          description: The ID of the site
        name:
          type: string
          description: The name of the site
      title: A site associated with a file
    s12.documents.v1.BulkAddFileOwnersResponse:
      type: object
      title: Response for the BulkAddFileOwners request
    s12.documents.v1.File:
      type: object
      properties:
        file_id:
          type: string
          description: The ID of the file
        name:
          type: string
          description: The name of the file
        description:
          type: string
          description: The description of the file
        file_extension:
          type: string
          description: The type extension of the file
        file_size:
          type: integer
          format: int32
          description: The file size in bytes
        version_number:
          type: integer
          format: int32
          description: The current version of the file
        download_url:
          type: string
          description: The URL to download the file if specified in the request.
        labels:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.Label'
          description: The labels associated with the file
        created_at:
          type: string
          format: date-time
          description: The time the file was created
        modified_at:
          type: string
          format: date-time
          description: The time the file was last modified
        archived_at:
          type: string
          format: date-time
          description: If archived, the time the file was archived
        archived:
          type: boolean
          description: If the file is archived or not
        bookmarked:
          type: boolean
          description: If the file is bookmarked by the requested user
        ancestors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.ParentFolder'
          description: 'Ordered from Highest ancestor to the current node

            eg. [Grandparent, Parent, Current]'
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.User'
          description: The users that own the file
        groups:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.Group'
          description: The groups that own the file
        valid_from:
          allOf:
          - $ref: '#/components/schemas/google.type.Date'
          description: The date the file is valid from
        valid_to:
          allOf:
          - $ref: '#/components/schemas/google.type.Date'
          description: The date the file is valid to
        expiry_status:
          allOf:
          - $ref: '#/components/schemas/s12.common.ExpiryStatus'
          description: The expiry status of the file based on its validity period
        sites:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.documents.v1.Site'
          description: The sites the file is associated with

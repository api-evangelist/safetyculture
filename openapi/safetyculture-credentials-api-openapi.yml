openapi: 3.2.0
info:
  title: Mitti Credentials API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Credentials
paths:
  /credentials/v1/credential:
    delete:
      summary: Delete a credential including all its versions
      operationId: UserDocumentsService_DeleteDocumentForUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.DeleteDocumentForUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: document_id
        description: Required. The ID of the credential to be deleted
        in: query
        required: false
        schema:
          type: string
      - name: user_id
        description: Required. The user ID this credential is associated with
        in: query
        required: false
        schema:
          type: string
      - name: document_type_id
        description: Required. The type ID of the credential to be deleted
        in: query
        required: false
        schema:
          type: string
      tags:
      - Credentials
  /credentials/v1/credential-type:
    post:
      summary: Create a credential type
      operationId: DocumentTypesService_CreateDocumentType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.CreateDocumentTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.CreateDocumentTypeRequest'
        required: true
      tags:
      - Credentials
    put:
      summary: Update a credential type
      operationId: DocumentTypesService_UpdateDocumentType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.UpdateDocumentTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.UpdateDocumentTypeRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/credential-type/{id}:
    get:
      summary: Get a credential type
      operationId: DocumentTypesService_GetDocumentType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The identifier of the field.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Credentials
    delete:
      summary: Delete a credential type
      operationId: DocumentTypesService_DeleteDocumentType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.DeleteDocumentTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The identifier of the field.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Credentials
  /credentials/v1/credential-types:
    post:
      summary: List credential types
      operationId: DocumentTypesService_ListDocumentTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.ListDocumentTypesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.ListDocumentTypesRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/credential/delete-media:
    post:
      summary: Delete all media for a credential version
      operationId: UserDocumentsService_DeleteAllMediaForDocumentVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.DeleteAllMediaForDocumentVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.DeleteAllMediaForDocumentVersionRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/credential/version:
    get:
      summary: Get a version of a credential
      operationId: UserDocumentsService_GetDocumentVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: document_id
        description: Required. The ID of the credential to be retrieved.
        in: query
        required: false
        schema:
          type: string
      - name: version_id
        description: 'Required. The ID of the version to be retrieved.

          If this is not provided, the latest version will be retrieved.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Credentials
    post:
      summary: Add a version to a credential
      operationId: UserDocumentsService_AddDocumentVersionForUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.AddDocumentVersionForUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.AddDocumentVersionForUserRequest'
        required: true
      tags:
      - Credentials
    put:
      summary: Update a version of a credential
      operationId: UserDocumentsService_UpdateDocumentVersionForUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.UpdateDocumentVersionForUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.UpdateDocumentVersionForUserRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/credential/versions:
    post:
      summary: List all versions of a credential
      operationId: UserDocumentsService_GetDocumentHistory
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentHistoryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentHistoryRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/credentials:
    post:
      summary: List the latest version of credentials based on applied filters
      operationId: UserDocumentsService_GetDocuments
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.GetDocumentsRequest'
        required: true
      tags:
      - Credentials
  /credentials/v1/settings:
    get:
      summary: Get the Credential settings for your organization
      operationId: UserDocumentsService_GetSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.GetSettingsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      tags:
      - Credentials
    put:
      summary: Update the Credential settings for your organization
      operationId: UserDocumentsService_UpdateSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.userdocuments.v1.UpdateSettingsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.userdocuments.v1.UpdateSettingsRequest'
        required: true
      tags:
      - Credentials
components:
  schemas:
    s12.userdocuments.v1.ListDocumentTypesRequest:
      type: object
      properties:
        document_category:
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentCategory'
          description: The category of credential
        include_global:
          type: boolean
          description: Whether to include global types
        type_criteria:
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.ListTypesCriteria'
          description: The search criteria for credential types
    s12.userdocuments.v1.DocumentVersionFilter.ApprovalStatusFilter:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/s12.userdocuments.v1.DocumentApprovalStatus'
          description: The approval status values.
      description: ApprovalStatusFilter is the approval status of the document.
    s12.common.Media:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        filename:
          type: string
          description: full file name, including file extension
        media_type:
          $ref: '#/components/schemas/s12.common.MediaType'
      title: Represents an image or video
    s12.userdocuments.v1.UpdateSettingsRequest:
      type: object
      properties:
        settings:
          description: The settings to update.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.UserDocumentsSettings'
    s12.userdocuments.v1.DocumentVersionFilter.CompaniesFilter:
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          description: Company UUIDs to filter for
      description: CompaniesFilter is used to query for documents based on the companies the associated user is assigned to.
    s12.userdocuments.v1.DocumentType:
      type: object
      properties:
        id:
          type: string
          description: The ID of the document type.
        name:
          type: string
          description: The name of the type
      title: A type of document
    s12.userdocuments.v1.DocumentCategory:
      type: string
      enum:
      - DOCUMENT_CATEGORY_LICENSES_AND_CREDENTIALS
      description: '- DOCUMENT_CATEGORY_LICENSES_AND_CREDENTIALS: Licenses and credentials for users'
      title: DocumentCategory is used to specify the category of document
    s12.userdocuments.v1.DocumentVersionFilter:
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.UserID'
        document_type_id:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.DocumentTypeID'
        user_status:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.UserStatusFilter'
        expiry_status:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.ExpiryStatusFilter'
        approval_status:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.ApprovalStatusFilter'
        groups:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.GroupsFilter'
        sites:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.SitesFilter'
        companies:
          $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionFilter.CompaniesFilter'
      description: DocumentVersionFilter is used to filter document versions based on various criteria.
    s12.userdocuments.v1.CreateDocumentTypeResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the created credential type.
    s12.userdocuments.v1.ExpiryStatus:
      type: string
      enum:
      - EXPIRY_STATUS_VALID
      - EXPIRY_STATUS_EXPIRED
      - EXPIRY_STATUS_EXPIRING_SOON
      description: '@deprecated. Use s12.common.ExpiryStatus instead.

        The status of a credential based on its expiration period.'
    s12.userdocuments.v1.DeleteDocumentTypeResponse:
      type: object
      properties:
        id:
          type: string
          description: The identifier of the field.
    s12.userdocuments.v1.DocumentVersion:
      type: object
      properties:
        subject_org_id:
          type: string
          description: The ID of the organization that a credential is stored in.
        subject_user_id:
          type: string
          description: '@deprecated: use subject_user instead'
        document_type_id:
          type: string
          description: '@deprecated: use document_type instead'
        document_id:
          type: string
          description: The ID of a credential.
        document_version_id:
          type: string
          description: The ID of a credential version.
        attributes:
          description: Any intrinsic attributes associated with a credential version.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionAttributes'
        metadata:
          description: Any metadata associated with a credential version.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionMetadata'
        subject_user:
          description: The subject of a credential.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.User'
        document_type:
          description: The type of a credential.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentType'
      description: A version is the point-in-time snapshot of a credential. A credential can have multiple versions that are added and edited over time.
    s12.userdocuments.v1.UpdateSettingsResponse:
      type: object
      properties:
        settings:
          description: The updated settings.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.UserDocumentsSettings'
    s12.userdocuments.v1.UpdateDocumentTypeResponse:
      type: object
      properties:
        document_type:
          description: The updated type.
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.Type'
    s12.userdocuments.v1.UpdateDocumentVersionForUserResponse:
      type: object
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/google.protobuf.Any'
    s12.userdocuments.v1.CredentialArchivedFilter:
      type: string
      enum:
      - CREDENTIAL_ARCHIVED_FILTER_UNSPECIFIED
      - CREDENTIAL_ARCHIVED_FILTER_ARCHIVED_ONLY
      - CREDENTIAL_ARCHIVED_FILTER_ALL
      default: CREDENTIAL_ARCHIVED_FILTER_UNSPECIFIED
      description: "CredentialArchivedFilter controls which credentials are returned based on their archived status.\n\n - CREDENTIAL_ARCHIVED_FILTER_UNSPECIFIED: `CREDENTIAL_ARCHIVED_FILTER_UNSPECIFIED` returns only unarchived credentials. This is the default behavior.\n - CREDENTIAL_ARCHIVED_FILTER_ARCHIVED_ONLY: `CREDENTIAL_ARCHIVED_FILTER_ARCHIVED_ONLY` returns only archived credentials.\n - CREDENTIAL_ARCHIVED_FILTER_ALL: `CREDENTIAL_ARCHIVED_FILTER_ALL` returns both archived and unarchived credentials."
    s12.typefield.v1.ListTypesCriteria.Filter:
      type: object
      properties:
        search:
          type: string
          description: Search on a Type's name
        category:
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.TypeCategory'
          description: Search on type's category
        type_ids:
          type: array
          items:
            type: string
          description: Search on type's ids
        exclude_type_ids:
          type: array
          items:
            type: string
          description: Type ids to exclude for the response
    s12.userdocuments.v1.GetDocumentsResponse:
      type: object
      properties:
        next_page_token:
          type: string
          description: 'If there are more results available, this will be set. If this is unset, there are no more results.

            To get the next set of results, call `GetDocuments` again with `page_token` set to this value.'
        latest_document_versions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersion'
          description: The latest version of each credential returned by the query.
        total_count:
          type: integer
          format: int32
          description: 'The total count of credentials matching the query (filters applied) available

            in the current archived scope — active, archived, or all, whichever was requested.'
        total_archived_count:
          type: integer
          format: int32
          description: 'The total count of archived credentials matching the same filters as this

            request, regardless of which archived scope was requested. Used by clients

            to populate a "Show archived (N)" badge without firing a second request,

            so the count always respects the user''s active filters.'
    s12.userdocuments.v1.GetDocumentTypeResponse:
      type: object
      properties:
        document_type:
          description: The type of the document.
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.Type'
    s12.typefield.v1.ListTypesCriteria:
      type: object
      properties:
        filter:
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.ListTypesCriteria.Filter'
          description: Optional. Filters for the types listed
        page_size:
          type: integer
          format: int32
          description: Optional. The number of asset types to return. Default of 50.
        page_token:
          type: string
          description: 'Optional. If present, then retrieve the next batch of results from the

            preceding call to this method. `page_token` must be the value of

            `next_page_token` from the previous response.  The values of other method

            parameters should be identical to those in the previous call.

            For example: ''ODFBMzQ3MDYtNzQxNy00RDZGLThDNjE1MEFDMkM4MTQ3NDQ=''.'
        sort_field:
          description: Optional. The field to use for sorting.
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.ListTypesCriteria.SortField'
        sort_direction:
          description: Optional. The direction to sort types in.
          allOf:
          - $ref: '#/components/schemas/s12.common.SortDirection'
        include_stats:
          type: boolean
          description: Include stats associated with a type.
      title: Criteria defines the common criteria to list generic types. This criteria should be domain agnostic
    s12.userdocuments.v1.CreateDocumentTypeRequest:
      type: object
      properties:
        document_category:
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentCategory'
          description: The category of credential
        type_attributes:
          description: The attributes of the credential type.
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.CreateTypeAttributes'
    s12.common.SortDirection:
      type: string
      enum:
      - SORT_DIRECTION_UNSPECIFIED
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
      default: SORT_DIRECTION_UNSPECIFIED
      title: Common set of sorting directions as used by lists
    s12.userdocuments.v1.UpdateDocumentTypeRequest:
      type: object
      properties:
        update_mask:
          type: string
          description: 'The attributes (such as name etc.) you want to update for the type,

            specified in the parameters. For example, the update_mask=name parameter

            indicates that only the name will be updated in a request, any other

            attributes provided in your request body will be ignored.'
        document_type:
          description: Type which replaces the one with matching identifier on the server.
          allOf:
          - $ref: '#/components/schemas/s12.typefield.v1.Type'
    s12.userdocuments.v1.DocumentVersionFilter.SitesFilter:
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          description: Site UUIDs to filter for
    s12.userdocuments.v1.User:
      type: object
      properties:
        id:
          type: string
          description: The ID of the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
      description: Information about a SafetyCulture user.
    s12.userdocuments.v1.GetDocumentHistoryRequest:
      type: object
      properties:
        document_id:
          type: string
          description: Required. The ID of the credential.
    s12.userdocuments.v1.DocumentVersionFilter.UserID:
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          description: The UUID form of the user ID.
      description: UserID is a filter that can be used to request documents for a specific set of users.
    s12.userdocuments.v1.UserDocumentsSettings:
      type: object
      properties:
        optional_media:
          type: boolean
          description: optional_media denotes whether media is optional for credentials. If this is set to true, credentials can be created without media.
        approvals_enabled:
          type: boolean
          description: approvals_enabled denotes whether approvals are enabled for credentials. If this is set to true, credentials approval flow is taken into account.
      description: UserDocumentsSettings represents the Credential settings for your organization.
    s12.typefield.v1.TypeStats:
      type: object
      properties:
        mapping_count:
          type: integer
          format: int32
          description: The total number of mappings associated with a type.
      description: Stats associated with a type.
    s12.userdocuments.v1.DocumentVersionAttributes:
      type: object
      properties:
        media:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.common.Media'
          description: Media array to be associated with the document.
        expiry_period_start_date:
          description: The start date of a credential's expiration period.
          allOf:
          - $ref: '#/components/schemas/google.type.Date'
        expiry_period_end_date:
          description: The end date of a credential's expiration period.
          allOf:
          - $ref: '#/components/schemas/google.type.Date'
      description: Intrinsic attributes associated with a credential version.
    s12.userdocuments.v1.AddDocumentVersionForUserRequest:
      type: object
      properties:
        user_id:
          type: string
          description: Required. The user ID to add the credential to
        document_type_id:
          type: string
          description: Required. The ID of the credential type
        document_id:
          type: string
          description: Required. The ID of the credential.
        new_version_id:
          type: string
          description: Optional. The ID of the new credential version. This is an optional field, but if provided it will link the newly created credential to any recently uploaded media
        document_version_attributes:
          description: The attributes of the credential version.
          allOf:
          - $ref: '#/components/schemas/s12.userdocuments.v1.DocumentVersionAttributes'
    s12.userdocuments.v1.DeleteAllMediaForDocumentVersionRequest:
      type: object
      properties:
        document_id:
          type: string
          description: Required. The ID of the credential.
        version_id:
          type: string
          description: Required. The version ID of the credential.
        user_id:
          type: string
          description: Required. The user ID this credential is associated with
    s12.typefield.v1.Domain:
      type: string
      enum:
      - DOMAIN_UNSPECIFIED
      - DOMAIN_GLOBAL
      - DOMAIN_ASSETS
      - DOMAIN_CONTRACTORS
      - DOMAIN_LICENSES_AND_CREDENTIALS
      - DOMAIN_TASKS
      - DOMAIN_USERS
      - DOMAIN_INVESTIGATIONS
      - DOMAIN_STRUCTURES
      - DOMAIN_INTEGRATIONS_HRIS_STAGING
      default: DOMAIN_UNSPECIFIED

openapi: 3.2.0
info:
  title: Mitti Templates API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Templates
paths:
  /templates/integration/v1/templates/{template_id}/definition:
    get:
      summary: Get template definition
      description: 'Retrieve the structural definition of a template, including its item hierarchy, item types, and response sets. Use this endpoint to discover column IDs for table operations: for each TableItem, the child items define the table columns, and each child item_id is the field_id required by AddTableLine and UpdateTableLine in the Inspections API.'
      operationId: TemplateService_GetTemplateDefinition
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.GetTemplateDefinitionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template whose definition should be retrieved.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Templates
  /templates/integration/v1/templates/{template_id}/draft:
    get:
      summary: Get template draft
      description: Retrieve the template's unpublished draft content and its concurrency token. Requires edit permission on the template.
      operationId: TemplateService_GetTemplateDraft
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.GetTemplateDraftResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template whose draft should be retrieved.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Templates
    delete:
      summary: Discard a template draft
      description: Delete the template's draft. The published template is untouched. Requires edit permission on the template and the draft's current revision token.
      operationId: TemplateService_DiscardTemplateDraft
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.DiscardTemplateDraftResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template whose draft should be discarded.
        in: path
        required: true
        schema:
          type: string
      - name: if_draft_revision_is
        description: 'Discard only if the draft is exactly at this revision, taken from a prior

          read or mutation. Otherwise ABORTED / STALE_DRAFT_REVISION, with the

          current token in the ErrorInfo metadata under `current_draft_revision`,

          which is empty when the draft no longer exists.


          Required, unlike on UpdateTemplateDraft, because a discard destroys work

          and cannot be undone. The draft may hold someone else''s unpublished edits,

          so only a draft you have read can be discarded.'
        in: query
        required: true
        schema:
          type: string
      tags:
      - Templates
    post:
      summary: Open a template draft
      description: Open the published template for editing and return the draft's concurrency token. Returns the draft already open when there is one, so the call is safe to retry. Requires edit permission on the template.
      operationId: TemplateService_CreateTemplateDraft
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.CreateTemplateDraftResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template to open for editing.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.templates.pub.integration.v1.TemplateService.CreateTemplateDraftBody'
        required: true
      tags:
      - Templates
    put:
      summary: Update a template draft
      description: Apply an ordered list of operations to the template's draft, atomically. Later operations see the effects of earlier ones, and if any operation fails none are applied. Changes are not visible to end users until the template is published. Requires edit permission on the template.
      operationId: TemplateService_UpdateTemplateDraft
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.UpdateTemplateDraftResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template whose draft should be updated.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.templates.pub.integration.v1.TemplateService.UpdateTemplateDraftBody'
        required: true
      tags:
      - Templates
  /templates/integration/v1/templates/{template_id}/publish:
    post:
      summary: Publish a template draft
      description: Make the template's draft live to end users as one new version. The draft is consumed by the publish. Requires edit permission on the template and the draft's current revision token.
      operationId: TemplateService_PublishTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.pub.integration.v1.PublishTemplateResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template to publish.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.templates.pub.integration.v1.TemplateService.PublishTemplateBody'
        required: true
      tags:
      - Templates
  /templates/search:
    get:
      summary: Search modified templates
      operationId: ThePubService_SearchTemplates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.thepub.v1.SearchTemplatesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: limit
        description: Limit the number of results returned. Default is `1000`.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: field
        description: "The fields to return. Defaults to just `audit_id`.\n\n - template_id: Include `template_id` in the response.\n - name: Include `name` in the response.\n - modified_at: Include `modified_at` in the response.\n - created_at: Include `modified_at` in the response."
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - template_id
            - name
            - modified_at
            - created_at
      - name: order
        description: "The order to return results in.\n\n - asc: Order by `modified_at` in ascending order.\n - desc: Order by `modified_at` in descending order."
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: modified_after
        description: Filter results modified after this date time.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: modified_before
        description: Filter results modified before this date time.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: archived
        description: "Filter results by archived status.\n\n - false: Only include unarchived templates.\n - true: Only include archived templates.\n - both: Include both archived and unarchived templates."
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
          - both
          default: 'false'
      - name: owner
        description: "Filter results by owner.\n\n - all: Include all templates.\n - me: Only include templates owned by the requesting user.\n - other: Only include templates owned by other users."
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - me
          - other
          default: all
      tags:
      - Templates
  /templates/v1/templates/inspections/{inspection_id}:
    get:
      summary: Get template (by inspection)
      operationId: TemplatesService_GetTemplateByInspectionID
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.v1.GetTemplateByInspectionIDResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: inspection_id
        description: The ID for the inspection.
        in: path
        required: true
        schema:
          type: string
      - name: locale
        description: The preferred locale of the template.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Templates
  /templates/v1/templates/{template_id}:
    get:
      summary: Get a template
      operationId: TemplatesService_GetTemplateByID
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.v1.GetTemplateByIDResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: Unique template id
        in: path
        required: true
        schema:
          type: string
      - name: locale
        description: The preferred locale of the template.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Templates
    delete:
      summary: Delete a template by template ID
      operationId: TemplatesService_DeleteTemplateByID
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.v1.DeleteTemplateByIDResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template
        in: path
        required: true
        schema:
          type: string
      tags:
      - Templates
  /templates/v1/templates/{template_id}/archive:
    delete:
      summary: Restore an archived template
      operationId: TemplatesService_RestoreArchivedTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.v1.RestoreArchivedTemplateResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template
        in: path
        required: true
        schema:
          type: string
      tags:
      - Templates
    post:
      summary: Archive a template
      operationId: TemplatesService_ArchiveTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.templates.v1.ArchiveTemplateResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: template_id
        description: The unique identifier for the template
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.templates.v1.TemplatesService.ArchiveTemplateBody'
        required: true
      tags:
      - Templates
components:
  schemas:
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.PageItem:
      type: object
    s12.templates.v1.DynamicTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
      title: 'Dynamic item (repeated section) define template items used to wrap other item

        types with ability to multiply the inner item'
    s12.templates.v1.TemplatesService.ArchiveTemplateBody:
      type: object
      title: The parameter body to `ArchiveTemplate`
    s12.templates.v1.InstructionTemplateItem:
      type: object
      properties:
        text:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.InstructionTemplateItem.TextInstruction'
          description: Represents a Text instruction item type
        media:
          allOf:
          - $ref: '#/components/schemas/s12.common.Media'
          description: Represents a Media instruction item type
        link:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.InstructionTemplateItem.LinkInstruction'
          description: Represents a Link instruction item type
        document_link:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.InstructionTemplateItem.DocumentLinkInstruction'
          description: Represents a Link to a document instruction item type
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.TemperatureItem:
      type: object
    s12.templates.v1.LogicfieldTemplateItem.SkipTo.Category:
      type: string
      enum:
      - CATEGORY_UNSPECIFIED
      - CATEGORY_QUESTION
      - CATEGORY_PAGE
      - CATEGORY_SECTION
      default: CATEGORY_UNSPECIFIED
      title: 'The category of target item to skip to. Note: this is not used for skipping to complete the inspection

        CATEGORY_QUESTION includes all question items that currently support logic such as question, text, checkbox, signature, temperature, slider'
    s12.templates.v1.LogicfieldTemplateItem.SkipTo:
      type: object
      properties:
        target_item:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.LogicfieldTemplateItem.SkipTo.TargetItem'
          description: Skip to a specific item in the inspection
        complete:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.LogicfieldTemplateItem.SkipTo.Complete'
          description: Skip to complete the inspection
      title: SkipTo defines the target to skip to when logic conditions are met
    s12.templates.pub.integration.v1.TemplateDefinition.ResponseSets:
      type: object
      properties:
        template_response_sets:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.templates.pub.integration.v1.TemplateDefinition.TemplateResponseSet'
          description: Response sets defined within this template.
        global_response_sets:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.templates.pub.integration.v1.TemplateDefinition.GlobalResponseSet'
          description: References to shared global response sets used by this template.
      description: ResponseSets contains all response sets associated with this template.
    s12.templates.v1.DrawingTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
        media:
          allOf:
          - $ref: '#/components/schemas/s12.common.Media'
          description: Media stores background image used for annotation
      title: Drawing define template items with user annotated images
    s12.common.MediaType:
      type: string
      enum:
      - MEDIA_TYPE_IMAGE
      - MEDIA_TYPE_VIDEO
      - MEDIA_TYPE_PDF
      - MEDIA_TYPE_DOCX
      - MEDIA_TYPE_XLSX
      - MEDIA_TYPE_PPTX
      - MEDIA_TYPE_CSV
      description: " - MEDIA_TYPE_IMAGE: An image file (GIF, JPG, PNG, WEBP).\n - MEDIA_TYPE_VIDEO: A video file (MP4, MOV).\n - MEDIA_TYPE_PDF: A PDF document.\n - MEDIA_TYPE_DOCX: A Microsoft Word document (DOCX, DOC).\n - MEDIA_TYPE_XLSX: A Microsoft Excel spreadsheet (XLSX, XLS).\n - MEDIA_TYPE_PPTX: A Microsoft PowerPoint presentation (PPTX, PPT).\n - MEDIA_TYPE_CSV: A CSV file."
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.SiteItem:
      type: object
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.SliderItem:
      type: object
    s12.templates.v1.TextSingleTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
        text_format:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TextSingleTemplateItem.TextFormat'
          description: Defines text format used to validate the item value
        calculation_data:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.CalculationData'
          description: Defines calculation data used to identify the calculation type of item
        reading_config_id:
          type: string
          description: ID of the reading config linked to this item
      title: Text Single items define template items used as single line text input
    s12.templates.pub.integration.v1.TemplateSettings:
      type: object
      properties:
        skip_completion_confirmation:
          type: boolean
          description: Whether the completion confirmation dialog is skipped.
      description: 'TemplateSettings holds a template''s behavior settings. Every field is

        populated on reads. This message appears in responses only.'
    s12.templates.v1.InvalidTemplateItem:
      type: object
      title: Invalid items define template items that are corrupted
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.NumberItem:
      type: object
    s12.templates.v1.ArchiveTemplateResponse:
      type: object
      title: Result returned from ArchiveTemplate
    s12.templates.v1.TemplateItem:
      type: object
      properties:
        id:
          type: string
          description: id of given item
        label:
          type: string
          description: label of given item
        children:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.templates.v1.TemplateItem'
          description: child items of given field
        section:
          $ref: '#/components/schemas/s12.templates.v1.SectionTemplateItem'
        text:
          $ref: '#/components/schemas/s12.templates.v1.TextTemplateItem'
        list:
          $ref: '#/components/schemas/s12.templates.v1.ListTemplateItem'
        question:
          $ref: '#/components/schemas/s12.templates.v1.QuestionTemplateItem'
        checkbox:
          $ref: '#/components/schemas/s12.templates.v1.CheckboxTemplateItem'
        logicfield:
          $ref: '#/components/schemas/s12.templates.v1.LogicfieldTemplateItem'
        dynamicfield:
          $ref: '#/components/schemas/s12.templates.v1.DynamicTemplateItem'
        media:
          $ref: '#/components/schemas/s12.templates.v1.MediaTemplateItem'
        address:
          $ref: '#/components/schemas/s12.templates.v1.AddressTemplateItem'
        datetime:
          $ref: '#/components/schemas/s12.templates.v1.DateTimeTemplateItem'
        textsingle:
          $ref: '#/components/schemas/s12.templates.v1.TextSingleTemplateItem'
        drawing:
          $ref: '#/components/schemas/s12.templates.v1.DrawingTemplateItem'
        signature:
          $ref: '#/components/schemas/s12.templates.v1.SignatureTemplateItem'
        category:
          $ref: '#/components/schemas/s12.templates.v1.CategoryTemplateItem'
        temperature:
          $ref: '#/components/schemas/s12.templates.v1.TemperatureTemplateItem'
        slider:
          $ref: '#/components/schemas/s12.templates.v1.SliderTemplateItem'
        instruction:
          $ref: '#/components/schemas/s12.templates.v1.InstructionTemplateItem'
        switch:
          $ref: '#/components/schemas/s12.templates.v1.SwitchTemplateItem'
        scanner:
          $ref: '#/components/schemas/s12.templates.v1.ScannerTemplateItem'
        asset:
          $ref: '#/components/schemas/s12.templates.v1.AssetTemplateItem'
        site:
          $ref: '#/components/schemas/s12.templates.v1.SiteTemplateItem'
        company:
          $ref: '#/components/schemas/s12.templates.v1.CompanyTemplateItem'
        table:
          $ref: '#/components/schemas/s12.templates.v1.TemplateItem.TableDefinition'
        tablesection:
          $ref: '#/components/schemas/s12.templates.v1.TableSection'
        unsupported:
          $ref: '#/components/schemas/s12.templates.v1.UnsupportedTemplateItem'
        invalid:
          $ref: '#/components/schemas/s12.templates.v1.InvalidTemplateItem'
      title: Wrapper for template items collection
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.CheckboxItem:
      type: object
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.MediaItem:
      type: object
    s12.templates.v1.TemplateItemOptions:
      type: object
      properties:
        is_mandatory:
          type: boolean
          description: is_mandatory defines if user required to provide field value
        weighting:
          type: number
          format: double
          description: weighting represents value used to calculate inspection score
      title: Common template item options
    s12.templates.v1.LogicfieldTemplateItem.SkipTo.TargetItem:
      type: object
      properties:
        id:
          type: string
          description: 'ID of the item to skip to: this can be a question, page or section ID'
        category:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.LogicfieldTemplateItem.SkipTo.Category'
          description: The category of item to skip to
      title: Item represents skipping to a specific item
    s12.templates.v1.SwitchTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
      title: 'Switch items are legacy item which define question with boolean answer value

        type - Yes/No, data structure is same as checkbox (True/False)'
    s12.templates.v1.DateTimeTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
        enable_date:
          type: boolean
          description: Enable date turns on input for date values
        enable_time:
          type: boolean
          description: Enable date turns on input for time values
      title: Date Time define template items with date and(or) time
    s12.templates.v1.Template.AccessLevel:
      type: string
      enum:
      - ACCESS_LEVEL_UNKNOWN
      - ACCESS_LEVEL_VIEW
      - ACCESS_LEVEL_EDIT
      - ACCESS_LEVEL_DELETE
      default: ACCESS_LEVEL_UNKNOWN
    s12.templates.v1.NumberComparison:
      type: object
      properties:
        value:
          type: number
          format: double
      description: Used to compare values against a single number.
    s12.templates.pub.integration.v1.DiscardTemplateDraftResponse:
      type: object
      description: DiscardTemplateDraftResponse response for `rpc DiscardTemplateDraft`.
    s12.templates.pub.integration.v1.TemplateDefinition.GlobalResponseSet:
      type: object
      properties:
        response_set_id:
          type: string
          description: The unique identifier for the global response set.
      description: 'GlobalResponseSet references a shared response set by ID.

        The full response list for a global response set is not included inline;

        use the response sets API to retrieve it.'
    s12.templates.v1.CheckboxTemplateItem:
      type: object
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/s12.templates.v1.TemplateItemOptions'
          description: Common template item options
      title: 'Checkbox items define question with boolean answer value type - Yes/No

        (True/False)'
    s12.templates.v1.Template.ProcurementConfigIdentity:
      type: object
      properties:
        config_id:
          type: string
        version:
          type: integer
          format: int32
      description: Identifies an immutable Marketplace procurement config version.
    s12.templates.pub.integration.v1.UpdateTemplateDraftResponse:
      type: object
      properties:
        revision:
          type: string
          description: Opaque concurrency token for the draft as it stands after this change.
        previous_revision:
          type: string
          description: 'The revision these operations were applied on top of. Empty when this call

            created the draft.


            A template can be edited from more than one place at once. A person may be

            in the web editor while an integration calls the API. When this differs

            from the revision you last saw, another editor changed the draft in between

            and your local copy is behind; refetch it. This is advisory and reported

            after the fact. To refuse the write instead, send if_draft_revision_is.'
        side_effects:
          description: Changes the server made beyond what was asked for.
          allOf:
          - $ref: '#/components/schemas/s12.templates.pub.integration.v1.SideEffects'
      description: UpdateTemplateDraftResponse response for `rpc UpdateTemplateDraft`.
    s12.templates.v1.InstructionTemplateItem.DocumentLinkInstruction:
      type: object
      properties:
        link_id:
          type: string
          description: ID of the document link associated with this instruction item
        document_node_id:
          type: string
          description: ID of the document node that the link points to
    s12.templates.pub.integration.v1.TemplateDefinition.TemplateItem.TableItem:
      type: object
      properties:
        max_lines:

openapi: 3.2.0
info:
  title: Mitti Companies API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Companies
paths:
  /companies/v1/companies:
    post:
      summary: List companies
      description: Lists contractor companies based on applied filters, with support for sorting and pagination.
      operationId: ContractorsService_ListContractorCompanies
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListContractorCompaniesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListContractorCompaniesRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
  /companies/v1/company:
    post:
      summary: Create a company
      description: 'Creates a new contractor company in your SafetyCulture organization. Requires the ''Companies: Manage'' permission.'
      operationId: ContractorsService_CreateContractorCompany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.CreateContractorCompanyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.CreateContractorCompanyRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
    get:
      summary: Get a company
      description: Retrieves a contractor company by its ID, including compliance statistics.
      operationId: ContractorsService_GetContractorCompany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.GetContractorCompanyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: company_type_id
        description: Optional. The ID of the contractor company type.
        in: query
        required: false
        schema:
          type: string
      - name: company_id
        description: Required. The ID of the contractor company.
        in: query
        required: true
        schema:
          type: string
      - name: include_compliance_stats
        description: Deprecated. This does nothing. Compliance statistics are now always included in the response.
        in: query
        required: false
        schema:
          type: boolean
      - name: include_user_credential_compliance_stats
        description: Temporary migration flag. When true, includes user credential compliance statistics in the response. Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
    put:
      summary: Update a company
      description: Updates an existing contractor company by providing its ID and a field mask of attributes to change.
      operationId: ContractorsService_UpdateContractorCompany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.UpdateContractorCompanyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.UpdateContractorCompanyRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
    delete:
      summary: Delete a company
      description: 'Deletes a contractor company. Requires the ''Companies: Manage'' permission.'
      operationId: ContractorsService_DeleteContractorCompany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.DeleteContractorCompanyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: company_type_id
        description: Deprecated. This does nothing.
        in: query
        required: false
        schema:
          type: string
      - name: company_id
        description: Required. The ID of the contractor company.
        in: query
        required: true
        schema:
          type: string
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
  /companies/v1/documents:
    post:
      summary: List company documents
      description: Lists documents for a company based on applied filters, with support for sorting and pagination.
      operationId: CompanyDocumentsService_ListCompanyDocuments
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListCompanyDocumentsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListCompanyDocumentsRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about company documents
        url: https://help.safetyculture.com/en-US/005046/
  /companies/v1/documents/type:
    delete:
      summary: Delete a company document type
      description: 'Deletes a company document type. Requires the ''Companies: Manage'' permission.'
      operationId: CompanyDocumentsService_DeleteCompanyDocumentType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.DeleteCompanyDocumentTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: type_id
        description: Required. The ID of the document type.
        in: query
        required: true
        schema:
          type: string
      tags:
      - Companies
      externalDocs:
        description: Learn more about company documents
        url: https://help.safetyculture.com/en-US/005046/
  /companies/v1/documents/types:
    post:
      summary: List company document types
      description: Lists all company document types available in the organization.
      operationId: CompanyDocumentsService_ListCompanyDocumentTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListCompanyDocumentTypesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListCompanyDocumentTypesRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about company documents
        url: https://help.safetyculture.com/en-US/005046/
  /companies/v1/type-metrics:
    post:
      summary: List company type metrics
      description: Lists company types with a breakdown of status metrics for each type.
      operationId: ContractorCompanyTypesService_ListCompanyTypesMetrics
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListCompanyTypesMetricsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListCompanyTypesMetricsRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about company types
        url: https://help.safetyculture.com/en-US/005043/
  /companies/v1/type/{id}:
    get:
      summary: Get a company type
      description: Retrieves a company type by its ID.
      operationId: ContractorCompanyTypesService_GetCompanyType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.GetCompanyTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: The identifier of the field.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Companies
      externalDocs:
        description: Learn more about company types
        url: https://help.safetyculture.com/en-US/005043/
  /companies/v1/types:
    post:
      summary: List company types
      description: Lists company types based on applied filters.
      operationId: ContractorCompanyTypesService_ListCompanyTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListCompanyTypesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListCompanyTypesRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about company types
        url: https://help.safetyculture.com/en-US/005043/
  /companies/v1/users:
    post:
      summary: List company users
      description: Lists users in a company along with their roles and metadata.
      operationId: ContractorsService_ListCompanyUserMetadata
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.contractors.v1.ListCompanyUserMetadataResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.contractors.v1.ListCompanyUserMetadataRequest'
        required: true
      tags:
      - Companies
      externalDocs:
        description: Learn more about Companies
        url: https://help.safetyculture.com/en-US/004114/
components:
  schemas:
    s12.contractors.v1.CompanyDocument:
      type: object
      properties:
        id:
          type: string
        resource_version_id:
          type: string
        title:
          type: string
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        version_number:
          type: integer
          format: int32
        source_id:
          type: string
        file_size:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: '@deprecated. Use created_by_user instead.'
        archived:
          type: boolean
        archived_at:
          type: string
          format: date-time
        archived_by:
          type: string
        company_document_type:
          $ref: '#/components/schemas/s12.contractors.v1.CompanyDocumentType'
        issue_date:
          $ref: '#/components/schemas/google.type.Date'
        expiration_date:
          $ref: '#/components/schemas/google.type.Date'
        parent_id:
          type: string
        approval_status:
          $ref: '#/components/schemas/s12.documents.v1.ApprovalStatus'
        created_by_user:
          $ref: '#/components/schemas/s12.common.UserDocument'
        media:
          $ref: '#/components/schemas/s12.common.Media'
        doc_expiry_status:
          $ref: '#/components/schemas/s12.common.ExpiryStatus'
        modified_by_user:
          $ref: '#/components/schemas/s12.common.UserDocument'
        fulfills:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.contractors.v1.FulfilledRequirementRef'
          description: 'Output-only. References to CompanyRequirements (scoped to the requesting

            org) that this document currently fulfils. A document fulfils a

            requirement when it is recorded as the fulfilling_entity on that

            requirement row.


            Today, only the caller-org''s requirements are surfaced — even though the

            same document may transitively fulfil requirements held by other buyer

            orgs that track the same contractor. May be empty.'
        ai_compliance_audit:
          description: 'Output-only. The result of running AI compliance review against the rule

            configured for this document''s type, for this specific version. Unset

            when no rule is configured for the type, or when no audit has been

            scheduled yet for this version.'
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.AiDocumentComplianceAudit'
    s12.contractors.v1.ListCompanyUserMetadataRequest:
      type: object
      properties:
        company_id:
          type: string
          description: Required. The ID of the contractor company.
        filter:
          description: Additional filters to apply to the request.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.ContractorCompanyUserFilter'
        sort_field:
          description: The field to sort by.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.ContractorCompanyUserSortField'
        page_size:
          type: integer
          format: int32
          description: The number of users to return in a single request.
        page_token:
          type: string
          description: If present, will fetch the next page of results. This must be the value of `next_page_token` from the response.
        sort_direction:
          description: Optional. The sort order to apply. Defaults to ascending when unspecified.
          allOf:
          - $ref: '#/components/schemas/s12.common.SortDirection'
      required:
      - company_id
    s12.contractors.v1.DeleteCompanyDocumentTypeResponse:
      type: object
    s12.contractors.v1.ListCompanyDocumentTypesFilter:
      type: object
      properties:
        document_type_ids:
          type: array
          items:
            type: string
          description: Filter by the document type id of the document. If not provided, all types are returned.
    s12.contractors.v1.CompanyDocumentsFilter:
      type: object
      properties:
        is_archived:
          type: boolean
          description: Filter by archived status. Default is unarchived only.
        type_ids:
          type: array
          items:
            type: string
          description: Filter by document type. If not provided, all types are returned.
        approval_statuses:
          type: array
          items:
            $ref: '#/components/schemas/s12.documents.v1.ApprovalStatus'
          description: Filter by the approval status of the document. If not provided, all statuses are returned.
        doc_expiry_statuses:
          type: array
          items:
            $ref: '#/components/schemas/s12.common.ExpiryStatus'
          description: Filter by the expiry status of the document. If not provided, all statuses are returned.
        modified_at:
          description: Filter by the modified at timestamp of the document. If not provided, all documents are returned.
          allOf:
          - $ref: '#/components/schemas/s12.documents.v1.Duration'
    s12.contractors.v1.ListCompanyDocumentsResponse:
      type: object
      properties:
        company_document_list:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.contractors.v1.CompanyDocument'
          description: The list of documents in the company.
        next_page_token:
          type: string
          description: The next page token.
        total_count:
          type: integer
          format: int32
          description: 'The total number of documents that match the filter (in the current

            archived scope — active or archived, whichever was requested).'
        total_archived_count:
          type: integer
          format: int32
          description: 'The total number of archived documents that match the same filters as

            this request, regardless of which archived scope was requested. Used by

            clients to populate a "Show archived (N)" badge without firing a second

            request, so the count always respects the user''s active filters.'
    s12.contractors.v1.ContractorCompanyAttributes:
      type: object
      properties:
        name:
          type: string
          description: The name of the company.
        contact_details:
          description: The contact details of the company.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.CompanyContactDetails'
        image:
          description: Image to be associated with the company.
          allOf:
          - $ref: '#/components/schemas/s12.common.Media'
        external_reference_id:
          type: string
          description: An optional external reference ID for the company that is used in external systems. Enforces uniqueness.
        status:
          description: The status of the company.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.ContractorCompanyStatus'
        compliance_statistics:
          description: The compliance statistics of the company.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.CompanyComplianceStatistics'
        user_credential_compliance_statistics:
          description: 'The user credential compliance statistics of the company.

            Only populated for users with credential management permissions.'
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.CompanyUserCredentialComplianceStatistics'
        notes:
          type: string
          description: An internal note about the company, visible only to users with admin:companies permission.
        site_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the sites to associate with this company.

            On create: links all provided sites to the new company.

            On update: replaces the full set of site associations (include in update_mask to apply).'
        linked_sites:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.contractors.v1.ContractorCompanyLinkedSite'
          description: 'The sites currently linked to this company, including resolved site names.

            Populated on read responses only; to modify the site associations use site_ids.'
          readOnly: true
        outstanding_document_request_count:
          type: integer
          format: int32
          description: 'The number of document requests made to this company that are still outstanding.

            A request is outstanding when the company has not uploaded a document against it,

            or when the document they uploaded was rejected.


            Populated on list responses only. Endpoints that return a single company leave it at 0,

            so do not read it from those; call the list endpoint if you need this count.'
          readOnly: true
      description: Intrinsic attributes associated with a contractor company.
    s12.contractors.v1.CreateContractorCompanyResponse:
      type: object
    s12.common.ExpiryStatus:
      type: string
      enum:
      - EXPIRY_STATUS_VALID
      - EXPIRY_STATUS_EXPIRED
      - EXPIRY_STATUS_EXPIRING_SOON
      description: The expiry status of an object based on its validity period.
    s12.contractors.v1.FulfilledRequirementRef:
      type: object
      properties:
        reference_id:
          type: string
          description: 'The reference_id of the fulfilled CompanyRequirement. For

            requirement_type = DOCUMENT_TYPE this is the document type ID and matches

            CompanyDocument.company_document_type.id.'
      description: 'FulfilledRequirementRef is a lightweight reference from a document to a

        CompanyRequirement it fulfils. Kept minimal because the document already

        carries display context (document type id + name) — callers can correlate

        reference_id against CompanyDocument.company_document_type.id without

        additional lookups.'
    s12.contractors.v1.AiDocumentComplianceAuditStatus:
      type: string
      enum:
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_UNSPECIFIED
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_NOT_YET_QUEUED
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_QUEUED
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_RUNNING
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_COMPLETED
      - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_FAILED
      default: AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_UNSPECIFIED
      description: "AiDocumentComplianceAuditStatus is the lifecycle of an audit run.\n\n - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_NOT_YET_QUEUED: A rule is configured for the document's type but this version was\nnever audited — typically because the rule was created after the\nversion was uploaded. The frontend should surface a \"Run audit\"\naffordance rather than a verdict.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_QUEUED: Scheduled but not yet started.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_RUNNING: Currently being evaluated by the AI.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_COMPLETED: Evaluation finished — see result + summary_prose.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_STATUS_FAILED: The evaluator errored out (e.g. unsupported media, AI gateway failure).\nSee summary_prose for a brief reason."
    s12.contractors.v1.ContractorCompanySortField:
      type: string
      enum:
      - COMPANY_SORT_FIELD_COMPANY_TYPE_NAME
      - COMPANY_SORT_FIELD_COMPANY_NAME
      - COMPANY_SORT_FIELD_COMPANY_STATUS
      - COMPANY_SORT_FIELD_OUTSTANDING_DOCUMENT_REQUESTS
      description: "ContractorCompanySortField is used to define the sorting criteria of contractor companies.\n\n - COMPANY_SORT_FIELD_COMPANY_TYPE_NAME: Sort by company type name.\n - COMPANY_SORT_FIELD_COMPANY_NAME: Sort by company name.\n - COMPANY_SORT_FIELD_COMPANY_STATUS: Sort by company status.\n - COMPANY_SORT_FIELD_OUTSTANDING_DOCUMENT_REQUESTS: Sort by the number of outstanding document requests."
    s12.contractors.v1.AiDocumentComplianceAuditResult:
      type: string
      enum:
      - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_UNSPECIFIED
      - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_COMPLIANT
      - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_NON_COMPLIANT
      - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_UNCERTAIN
      default: AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_UNSPECIFIED
      description: "AiDocumentComplianceAuditResult is the AI's verdict on a completed audit.\n\n - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_COMPLIANT: Document satisfies the rule's criteria.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_NON_COMPLIANT: Document fails one or more parts of the rule's criteria.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_RESULT_UNCERTAIN: The AI could not form a confident verdict (e.g. illegible scan, missing\npages). Falls back to manual review regardless of action_mode."
    s12.contractors.v1.ContractorCompanyStatus:
      type: string
      enum:
      - CONTRACTOR_COMPANY_STATUS_ACTIVE
      - CONTRACTOR_COMPANY_STATUS_PENDING
      - CONTRACTOR_COMPANY_STATUS_DEACTIVATED
      description: "The status of a contractor company.\n\n - CONTRACTOR_COMPANY_STATUS_ACTIVE: The company is active.\n - CONTRACTOR_COMPANY_STATUS_PENDING: The company is pending approval.\n - CONTRACTOR_COMPANY_STATUS_DEACTIVATED: The company is deactivated."
    s12.contractors.v1.AiDocumentComplianceAuditCompletedOutcome:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/s12.contractors.v1.AiDocumentComplianceAuditResult'
        summary_prose:
          type: string
          description: 'Plain-English explanation of the verdict, produced by the AI.

            Always set.'
      description: 'AiDocumentComplianceAuditCompletedOutcome is the payload when the AI produced a

        verdict (status = COMPLETED). Includes UNCERTAIN — that''s still a

        completed run, just one that fell back to manual review.'
    s12.contractors.v1.CompanyDocumentTypeForm:
      type: object
      properties:
        media:
          description: The form file. media.token provides the signed download URL.
          allOf:
          - $ref: '#/components/schemas/s12.common.Media'
        added_by_user_id:
          type: string
          description: The user that attached the current form.
        added_at:
          type: string
          format: date-time
          description: When the current form was attached.
      description: 'CompanyDocumentTypeForm is a reusable blank form that lives on a document

        type. Key contacts download, fill out, and return it; it is reused on every

        request for that type instead of being re-uploaded per request.'
    s12.common.SubscriptionSeatTypes:
      type: string
      enum:
      - SUBSCRIPTION_SEAT_TYPE_UNSPECIFIED
      - SUBSCRIPTION_SEAT_TYPE_PREMIUM
      - SUBSCRIPTION_SEAT_TYPE_COLLABORATOR
      - SUBSCRIPTION_SEAT_TYPE_LITE
      - SUBSCRIPTION_SEAT_TYPE_SERVICE_USER
      - SUBSCRIPTION_SEAT_TYPE_SUPPORT
      default: SUBSCRIPTION_SEAT_TYPE_UNSPECIFIED
      title: SubscriptionSeatTypes is a list of potential subscription seat types
    s12.contractors.v1.ListCompanyDocumentsRequest:
      type: object
      properties:
        company_id:
          type: string
          description: Required. The ID of the contractor company.
        filter:
          $ref: '#/components/schemas/s12.contractors.v1.CompanyDocumentsFilter'
        sort_field:
          description: The field to sort by.
          allOf:
          - $ref: '#/components/schemas/s12.contractors.v1.CompanyDocumentSortField'
        sort_direction:
          description: The sort order.
          allOf:

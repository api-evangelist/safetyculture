            $ref: '#/components/schemas/s12.contractors.v1.ContractorCompanyStatus'
          description: Optional. The contractor company statuses to filter by. If not provided, all statuses will be returned.
        needs_attention:
          type: boolean
          description: 'Deprecated. Will currently override compliance_filters if set.

            Whether to include only companies that need attention due to non-compliance.'
        compliance_filters:
          type: array
          items:
            $ref: '#/components/schemas/s12.contractors.v1.ComplianceFilterType'
          description: 'Optional. Filter by specific compliance issues (OR logic between selected types).

            If empty, no compliance filtering is applied.

            Companies will be returned if they match ANY of the selected compliance filter types.'
        address_filter:
          description: 'Optional. Filter by address-related criteria (country and/or administrative area).

            Filtering is case-insensitive. Multiple values within the same filter type use OR logic.

            Country and administrative area filters combine with AND logic.'

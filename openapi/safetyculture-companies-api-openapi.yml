      description: "AiDocumentComplianceAuditFailureReason is a coarse categorization of why an audit run failed to complete.\n\n - AI_DOCUMENT_COMPLIANCE_AUDIT_FAILURE_REASON_INTERNAL_ERROR: Unclassified internal error.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_FAILURE_REASON_UNSUPPORTED_MEDIA_TYPE: File format not supported by the evaluator (e.g. .dwg, .zip).\n - AI_DOCUMENT_COMPLIANCE_AUDIT_FAILURE_REASON_TIMEOUT: Evaluator timed out.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_FAILURE_REASON_RULE_OWNER_REMOVED: The rule's current_actor_user_id could not be resolved.\n - AI_DOCUMENT_COMPLIANCE_AUDIT_FAILURE_REASON_FILE_TOO_LARGE: The document's file is too large for the evaluator to process (e.g. an\nimage exceeding the model's per-image byte limit)."

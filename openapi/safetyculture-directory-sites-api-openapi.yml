openapi: 3.2.0
info:
  title: Mitti Directory (Sites) API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Directory (Sites)
paths:
  /directory/v1/folder:
    post:
      summary: Create a folder
      operationId: Directory_CreateFolder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.CreateFolderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.directory.v1.CreateFolderRequest'
        description: The parameters for `CreateFolderRequest`
        required: true
      tags:
      - Directory (Sites)
  /directory/v1/folder/{id}:
    get:
      summary: Retrieve a folder
      operationId: Directory_GetFolder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetFolderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier to retrieve info for
        in: path
        required: true
        schema:
          type: string
      - name: with_ancestors
        description: When true, an array of the folders ancestors will also be returned.
        in: query
        required: false
        schema:
          type: boolean
      - name: with_all_children_count
        description: 'When true, the total count of all children underneath the folder will be

          returned. This is a recursive count and will include children of children'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Directory (Sites)
    patch:
      summary: Update a folder
      operationId: Directory_UpdateFolderProperties
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.UpdateFolderPropertiesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier of the folder to be updated.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.directory.v1.Directory.UpdateFolderPropertiesBody'
        required: true
      tags:
      - Directory (Sites)
  /directory/v1/folder/{id}/users:
    get:
      summary: Retrieve users associated to a folder, includes both directly and indirectly…
      operationId: Directory_GetAllUsersByFolder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetAllUsersByFolderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier we want to get all the users for
        in: path
        required: true
        schema:
          type: string
      - name: get_users_of_descendants
        description: 'Optional. When true, it will return all of the members of a specified folder

          and its children folders recursively. Default false, will return all of the

          members of a specified folder and its parent/ancestor folders.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Directory (Sites)
    delete:
      summary: Remove association for multiple users to a specific folder
      operationId: Directory_RemoveUsersAssociation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.RemoveUsersAssociationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier we want to remove users from
        in: path
        required: true
        schema:
          type: string
      - name: user_ids
        description: List of UserIDs for users with an association type of "MEMBER" to be disassociated with the given folder
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Directory (Sites)
  /directory/v1/folder/{id}/users/associated:
    get:
      summary: Retrieve users directly associated to a folder
      operationId: Directory_GetUsersByFolder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetUsersByFolderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier we want to get the users for
        in: path
        required: true
        schema:
          type: string
      tags:
      - Directory (Sites)
  /directory/v1/folder/{id}/users/inherited:
    get:
      summary: Retrieve users indirectly associated (inherited) to a folder
      operationId: Directory_GetInheritedUsersByFolder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetInheritedUsersByFolderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: Required. The folder identifier we want to get the users for
        in: path
        required: true
        schema:
          type: string
      tags:
      - Directory (Sites)
  /directory/v1/folders:
    get:
      summary: List folders
      operationId: Directory_GetFolders
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetFoldersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: page_size
        description: 'Required. This determines the max number of folders returned in the

          response.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'Optional. base64 encoded. If this field is present, the list of folders

          returned will start from the row after this token.'
        in: query
        required: false
        schema:
          type: string
      - name: order_by.sort_field
        description: "The field to order by\n\n - SORT_FIELD_UNSPECIFIED: The sort field is unspecified\n - SORT_FIELD_NAME: Sort the folder by name\n - SORT_FIELD_FOLDER_ID: Sort the folders by folder id\n - SORT_FIELD_USER_ID: Sort the folders by user id\n - SORT_FIELD_CREATED_AT: Sort the folders by created at\n - SORT_FIELD_MODIFIED_AT: Sort the folders by modified at"
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_FIELD_UNSPECIFIED
          - SORT_FIELD_NAME
          - SORT_FIELD_FOLDER_ID
          - SORT_FIELD_USER_ID
          - SORT_FIELD_CREATED_AT
          - SORT_FIELD_MODIFIED_AT
          default: SORT_FIELD_UNSPECIFIED
      - name: order_by.sort_order
        description: "The direction to order by\n\n - SORT_ORDER_UNSPECIFIED: The sort order is not specified\n - SORT_ORDER_ASCENDING: The sort order is asc\n - SORT_ORDER_DESCENDING: The sort order is desc"
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_ORDER_UNSPECIFIED
          - SORT_ORDER_ASCENDING
          - SORT_ORDER_DESCENDING
          default: SORT_ORDER_UNSPECIFIED
      - name: only_leaf_nodes
        description: 'Optional. When true, GetFolders will only return leaf node folders. leaf

          nodes are folders that do not have children  Defaults to false.'
        in: query
        required: false
        schema:
          type: boolean
      - name: with_ancestors
        description: 'Optional. When true, folders will be returned with a list of their

          ancestors as well. Defaults to false'
        in: query
        required: false
        schema:
          type: boolean
      - name: include_deleted
        description: When true, deleted folders will also be returned
        in: query
        required: false
        schema:
          type: boolean
      - name: ignore_folders_disabled
        description: 'Optional. When true, folders will still be returned when disabled for the

          organisation'
        in: query
        required: false
        schema:
          type: boolean
      - name: domain
        description: 'domain represents the type/domain/hierarchy for the folder. This is used

          for getting folders of a certain domain, i.e. getting all `template`

          folders or `site` folders'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Directory (Sites)
    delete:
      summary: Delete folders (bulk)
      operationId: Directory_DeleteFolders
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.DeleteFoldersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: folder_ids
        description: Required. Folder ids of the folders to be deleted
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: cascade_up
        description: 'Deleting folders will always cascade down. If a parent is deleted, then all

          of its children are deleted. When cascade_up is true, if a child is

          deleted, and it''s parent no longer has any children, then it will be

          deleted too. This will cascade all the way up the tree.'
        in: query
        required: false
        schema:
          type: boolean
      - name: domain
        description: 'domain represents the type/domain/hierarchy for the folder. This is used

          for deleting folders within a specified domain'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Directory (Sites)
  /directory/v1/folders/move:
    post:
      summary: Move folder to another parent folder or as a root folder
      operationId: Directory_MoveFolders
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.MoveFoldersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.directory.v1.MoveFoldersRequest'
        description: The parameters for `MoveFoldersRequest`
        required: true
      tags:
      - Directory (Sites)
  /directory/v1/folders/search:
    post:
      summary: Search folders
      operationId: Directory_SearchFolders
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.SearchFoldersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.directory.v1.SearchFoldersRequest'
        description: The parameters for `SearchFoldersRequest`
        required: true
      tags:
      - Directory (Sites)
  /directory/v1/organization/labels:
    get:
      summary: Get custom labels
      operationId: Directory_GetOrgLabels
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetOrgLabelsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      tags:
      - Directory (Sites)
  /directory/v1/parent/{id}/folders:
    get:
      summary: Get folders (by parent)
      operationId: Directory_GetFoldersByParent
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetFoldersByParentResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: id
        description: 'Optional. The identifier of the parent folder.

          When no parent folder ID is given all top level root folders

          will be returned'
        in: path
        required: true
        schema:
          type: string
      - name: include_members_count
        description: 'Optional. Whether to return the directly associated members

          count with the folders. Defaults to false.'
        in: query
        required: false
        schema:
          type: boolean
      - name: limit
        description: The number of results to be returned.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'Optional. base64 encoded. If this field is present, the list of folders

          returned will start from the row after this token.'
        in: query
        required: false
        schema:
          type: string
      - name: include_inherited_members_count
        description: 'Optional. Whether to include the number of inherited members

          for each folder'
        in: query
        required: false
        schema:
          type: boolean
      - name: domain
        description: 'domain represents the type/domain/hierarchy for the folder. This is used

          for getting folders of a certain domain, i.e. getting all `template`

          folders or `site` folders'
        in: query
        required: false
        schema:
          type: string
      - name: only_assigned_folders
        description: 'When true, GetFoldersByParent will only return folders that are assigned to

          the user making the request. Defaults to false'
        in: query
        required: false
        schema:
          type: boolean
      - name: with_deleted_folders
        description: Optional. When true, deleted and non-deleted folders will be returned.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Directory (Sites)
  /directory/v1/user/folder_ids:
    get:
      summary: List folders the requesting user is associated with
      operationId: Directory_GetFolderIDsForUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.GetFolderIDsForUserResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      tags:
      - Directory (Sites)
  /directory/v1/user/{user_id}/folders:
    delete:
      summary: Remove association for a specific user to multiple folders
      operationId: Directory_RemoveFoldersAssociation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.RemoveFoldersAssociationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: user_id
        description: Required. The user identifier we want to remove folders from
        in: path
        required: true
        schema:
          type: string
      - name: folder_ids
        description: Required. List of folder IDs to remove association to given user
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Directory (Sites)
  /directory/v1/users/folders/membership:
    post:
      summary: Associate users to folders
      description: Add a list of one or more users to a list of one or more folders.
      operationId: Directory_AddUsersFoldersAssociations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.directory.v1.AddUsersFoldersAssociationsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.directory.v1.AddUsersFoldersAssociationsRequest'
        required: true
      tags:
      - Directory (Sites)
components:
  schemas:
    s12.directory.v1.CreateFolderRequest:
      type: object
      properties:
        name:
          type: string
          description: Required. Non-empty folder name. Limited to maximum 250 characters.
        parent_id:
          type: string
          description: 'Optional. Parent folder UUID. If unspecified, will be created as a root

            folder'
        id:
          type: string
          description: Optional. Folder UUID. If unspecified, backend will generate the ID.
        meta_label:
          type: string
          description: 'Required. Must be one of: "location", "area", "region", "state", or "country".

            Note that these meta labels may not match custom site hierarchy labels used by the organization.'
        domain:
          type: string
          description: 'domain represents the type/domain/hierarchy for the folder. This is used

            for getting folders of a certain domain, i.e. getting all `template`

            folders or `site` folders'
      description: The parameters for `CreateFolderRequest`
      title: CreateFolderRequest
      required:
      - name
      - meta_label
    s12.directory.v1.GetFoldersByParentResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.directory.v1.FolderWithMembersCount'
          description: 'List of children folders with a count of

            their explicitly associated members

            When `include_members_count` is set to false

            `members_count` in `FolderWithMembersCount` is

            always set to the default zero value'
        next_page_token:
          type: string
          description: 'Optional. base64 encoded. If this field is present, the value should be

            used in subsequent calls to GetFoldersByParent to get the next page of

            results. Otherwise, no further calls should be made.'
      description: Result returned from `GetFoldersByParentResponse`
      title: GetFoldersByParentResponse
    s12.directory.v1.FolderWithAncestors:
      type: object
      properties:
        folder:
          allOf:
          - $ref: '#/components/schemas/s12.directory.v1.Folder'
          description: The folder we are interested in
        ancestors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.directory.v1.Folder'
          description: 'The folders ancestors. For example, when returning a `location` leaf node,

            the ancestors will be the [`area`,`region`] folders, when applicable'
        members_count:
          type: integer
          format: int32
          description: Members count are the count of active users associated with the folder.
        has_children:
          type: boolean
          description: Whether the folder has children or not
      description: FolderWithAncestors represents a a folder with an array of ancestor folders
      title: FolderWithAncestors
    s12.directory.v1.RemoveFoldersAssociationResponse.Status:
      type: string
      enum:
      - UNKNOWN
      - REMOVED
      - NOT_FOUND
      default: UNKNOWN
      description: "- UNKNOWN: Status unknown\n - REMOVED: Folder was successfully removed from the user\n - NOT_FOUND: Folder user association was not found"
      title: Resulting status values after removing a folder from a user
    s12.directory.v1.AddUsersFoldersAssociationsResponse.Status:
      type: string
      enum:
      - STATUS_UNSPECIFIED
      - STATUS_ADDED
      - STATUS_ALREADY_DIRECT_MEMBER
      - STATUS_ALREADY_INHERITED_MEMBER
      - STATUS_REMOVED
      default: STATUS_UNSPECIFIED
      description: "- STATUS_UNSPECIFIED: Status unknown\n - STATUS_ADDED: Folder was successfully associated to the user\n - STATUS_ALREADY_DIRECT_MEMBER: User was already a direct member of the folder\n - STATUS_ALREADY_INHERITED_MEMBER: User was already an inherited member of the folder\n - STATUS_REMOVED: User was removed from the folder (side-effect of being added to an ancestor)"
      title: Resulting status values after associating a folder and user
    s12.directory.v1.AddUsersFoldersAssociationsResponse.FolderAssignmentsStatuses:
      type: object
      properties:
        users:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/s12.directory.v1.AddUsersFoldersAssociationsResponse.Status'
          description: 'Map of UserIDs for users with an association type of "MEMBER" with their

            resulting status after adding access to the folder. This map corresponds to the

            list of UserIDs passed through `user_ids` in `AddUsersFoldersAssociationsRequest`'
        manager_status:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/s12.directory.v1.AddUsersFoldersAssociationsResponse.Status'
          description: 'Map of UserIDs for users with an association type of "MANAGER" with their

            resulting status after adding access to the folder. This map corresponds to the

            list of UserIDs passed through `manager_user_ids` in `AddUsersFoldersAssociationsRequest`'
      title: FolderAssignmentsStatuses maps the user IDs to their status for the given folder
    s12.directory.v1.DeleteFoldersResponse:
      type: object
      properties:
        folder_ids:
          type: array
          items:
            type: string
          description: List of deleted folderIDs
      description: Result returned from `DeleteFoldersResponse`
      title: DeleteFoldersResponse
    s12.directory.v1.AddUsersFoldersAssociationsRequest:
      type: object
      properties:
        assignments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/s12.directory.v1.AddUsersFoldersAssociationsRequest.FolderAssignments'
          description: Map of folder ID to users assignments
      title: AddUsersFoldersAssociationsRequest is the request for the `AddUsersFoldersAssociations` endpoint
    s12.directory.v1.MoveFoldersResponse:
      type: object
      properties:
        new_parent_id:
          type: string
          description: 'New parent folder ID. Empty means the folder has been moved

            as root.'
      description: Result returned from `MoveFoldersResponse`
      title: MoveFoldersResponse
    s12.directory.v1.SearchFoldersResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/s12.directory.v1.FolderWithAncestors'
          description: An array of folders with their ancestors that match the search results
        folder_count:
          type: integer
          format: int32
          description: The total number of folders found for the search query
        next_page_token:
          type: string
          description: 'Optional. base64 encoded. If this field is present, the value should be

            used in subsequent calls to SearchFolders to get the next page of results.

            Otherwise, no further calls should be made.'
        folders_enabled:
          type: boolean
          description: Whether or not the org settings setting is enabled.
      description: Result returned from `SearchFoldersResponse`
      title: SearchFoldersResponse
    s12.directory.v1.GetAllUsersByFolderResponse:
      type: object
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: 'The list of user_ids that have explicit and inherited access to the

            requested folder'
      description: Result returned from `GetAllUsersByFolderResponse`
      title: GetAllUsersByFolderResponse
    s12.directory.v1.RemoveFoldersAssociationResponse:
      type: object
      properties:
        folder_status:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/s12.directory.v1.RemoveFoldersAssociationResponse.Status'
          description: 'Map of folders ids with their resulting status after removing the user

            access to that folder. This map is populated with the list of folders

            passed in through the `RemoveFoldersAssociation`

            For example: <Key,Value> -> <5441fffcde344415bb7ccaceda27e196,

            Status>'
      description: Result returned from `RemoveFoldersAssociationResponse`
      title: RemoveFoldersAssociationResponse
    s12.directory.v1.GetFolderIDsForUserResponse:
      type: object
      properties:
        folder_ids:
          type: array
          items:
            type: string
          description: 'List of folder IDs the user has access to.

            For example: ''5441fffcde344415bb7ccaceda27e196'''
        folder_paths:
          type: array
          items:
            type: string
          description: 'List of folder paths the user has access to.

            For example: ''07c7acbf5b1f450d817e5ebb11fda832.5441fffcde344415bb7ccaceda27e196'''
      description: Result returned from `GetFolderIDsForUserResponse`
      title: GetFolderIDsForUserResponse
    s12.directory.v1.FoldersOrderBy:
      type: object
      example:
        sort_field: 1
        sort_order: 1
      properties:
        sort_field:
          allOf:
          - $ref: '#/components/schemas/s12.directory.v1.FoldersOrderBy.SortField'
          description: The field to order by
        sort_order:
          allOf:

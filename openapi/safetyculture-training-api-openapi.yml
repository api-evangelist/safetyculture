      summary: Get courses by collection
      description: Retrieves all courses in a collection.
      operationId: TrainingCollectionsService_GetCoursesByCourseCollectionId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.training.collections.v1.GetCoursesByCourseCollectionIdResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: courseCollectionId
        description: ID of the collection
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        description: '[Optional] The number of items to return. Defaults to 25. You can specify a value between 1 to 1000.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: coursewareVersionType
        description: Version type of the courses (1 = Published, 2 = Latest)
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: includeDraft
        description: Include draft courses
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Training
  /training/courseprogress/v1/reset:

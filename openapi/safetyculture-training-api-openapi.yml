openapi: 3.2.0
info:
  title: Mitti Training API
  version: v1.349.8
  contact:
    name: Mitti Support
    url: https://help.mitti.com
    email: support@mitti.com
servers:
- url: https://api.mitti.com
security:
- BearerAuthentication: []
tags:
- name: Training
paths:
  /training/analytics/v1/courses/statistics:
    get:
      summary: Get Course Statistics
      description: Retrieves all course statistics for courses in your organization.
      operationId: TrainingAnalyticsService_GetCourseStatistics
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.training.analytics.v1.GetCourseStatisticsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: pageSize
        description: '[Optional] The number of items to return. Defaults to 25. You can specify a value between 1 to 1000.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: courseId
        description: '[Optional] Course ID to filter by'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Training
  /training/analytics/v1/lessons/attempts:

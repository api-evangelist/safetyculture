      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: courseId
        description: '[Optional] Course ID to filter by'
        in: query
        required: false
        schema:
          type: string
      - name: maxEventDatetime
        description: '[Optional] The max date of the event. Defaults to current date. Cannot be more than 7 days after MinEventDateTime. Expects UTC date.'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: minEventDatetime
        description: '[Optional] The min date of the event. Defaults to 7 days ago. Expects UTC date.'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      tags:
      - Training

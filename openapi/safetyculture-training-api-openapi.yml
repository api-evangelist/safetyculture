                $ref: '#/components/schemas/s12.training.courseprogress.v1.ResetCourseProgressResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/s12.training.courseprogress.v1.ResetCourseProgressRequest'
        required: true
      tags:
      - Training
  /training/courses/v1:
    get:
      summary: Get courses
      description: Retrieves all courses in your organization.
      operationId: TrainingCoursesService_GetCourses
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/s12.training.courses.v1.GetCoursesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: pageSize
        description: '[Optional] The number of items to return. Defaults to 25. You can specify a value between 1 to 1000.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: modifiedSince
        description: '[Optional] The The minimum modified date of the course.'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: publicationStatus
        description: "[Optional] The publication status of the course.\n\n - PUBLICATION_STATUS_UNKNOWN: Unknown publication status\n - PUBLICATION_STATUS_PUBLISHED: course is published"
        in: query
        required: false
        schema:
          type: string
          enum:
          - PUBLICATION_STATUS_UNKNOWN
          - PUBLICATION_STATUS_PUBLISHED
          default: PUBLICATION_STATUS_UNKNOWN
      - name: courseIds
        description: '[Optional] Filter by specific course IDs. If empty, all courses matching other filters will be returned.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: locale
        description: '[Optional] The preferred locale of the course.'
        in: query
        required: false
        schema:
          type: string
      - name: searchTerm
        description: '[Optional] The search term to filter out courses'
        in: query
        required: false
        schema:
          type: string
      - name: groupIds
        description: '[Optional] Filter by assigned group IDs. If empty, all courses matching other filters will be returned.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: siteIds
        description: '[Optional] Filter by assigned site IDs. If empty, all courses matching other filters will be returned.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: userId
        description: '[Optional] Filter by a users enrolled Courses. If empty, all courses matching other filters will be returned.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Training
  /training/courses/v1/{courseId}/assignments:

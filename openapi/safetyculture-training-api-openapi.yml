        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: userId
        description: '[Optional] User ID to filter by'
        in: query
        required: false
        schema:
          type: string
      - name: courseId
        description: '[Optional] Course ID to filter by'
        in: query
        required: false
        schema:
          type: string
      - name: courseExternalId
        description: '[Optional] Course external ID to filter by'

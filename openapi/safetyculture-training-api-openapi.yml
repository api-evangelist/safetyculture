          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: userId
        description: User ID to filter by
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        description: '[Optional] The number of items to return. Defaults to 25. You can specify a value between 1 to 1000.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: '[Optional] The current page number. Default to 1. Must be at least 1.'

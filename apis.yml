aid: safetyculture
name: SafetyCulture
description: >-
  SafetyCulture (formerly iAuditor) is a workplace operations and safety platform used
  by frontline teams to run inspections, capture and track issues, assign corrective
  actions, manage assets and sites, deliver training, and provision users. Its public
  REST API at https://api.safetyculture.io exposes more than 380 documented operations
  across inspections, templates, assets, actions, issues, users, groups, schedules,
  training, credentials, and webhooks, secured with bearer API tokens (service-user and
  personal). Near real-time webhooks stream a rich catalog of inspection, action,
  incident, media, and training events, and SCIM 2.0 supports user provisioning via
  Microsoft Entra ID and Okta.

source: https://developer.mitti.com/reference/authentication
docs: https://developer.mitti.com/reference/authentication
summary:
  types:
  - http
  scheme: bearer
  api_key_in:
  - header
  oauth2_flows: []
  note: 'REST API: bearer API token whose effective permissions mirror the token owner (user or service user). No
    OAuth 2.0 flow for the REST API. The remote MCP server (https://mcp.mitti.com/mcp, Early Access) uses OAuth
    2.0: the client authorizes against the user''s Mitti account and receives a token scoped to that one connection.'
schemes:
- name: bearerAuth
  type: http
  scheme: bearer
  in: header
  header: Authorization
  format: 'Authorization: Bearer {api_token}'
  sources:
  - https://developer.mitti.com/reference/authentication
token_kinds:
- kind: service_user_token
  description: Shared integration / long-running automation token. Up to 20 active tokens per organization. Configurable
    inactivity expiry (31, 45, 60, or 180 days). Scoped by selected permission sets.
  generate_at: Organization > Integrations > API tokens
- kind: user_token
  description: Personal token whose access mirrors a specific user. Up to 10 active tokens per user. Expires after
    30 days of inactivity.
  generate_at: My Profile > Settings > API tokens
authorization_model: The API only returns or changes data the token owner can access, evaluated through permissions
  (which actions are allowed) and access rules (which items are visible).
requirements:
  service_user_tokens: Mitti Premium Plan or Enterprise Plan; up to 20 active service user tokens per organization
mcp_oauth:
  endpoint: https://mcp.mitti.com/mcp
  docs: https://developer.mitti.com/docs/connect-an-ai-tool-to-mitti
  scopes_documented: false

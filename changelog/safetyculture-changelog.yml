- version: null
  date: '2026-08-04'
  title: Automatic seat purchasing can now be turned off per organization
  type: added
  breaking: true
  highlights:
  - If an organization turns this setting off, any API or SCIM call that would add a user beyond the organization's
    contracted seat count now fails with a seat-limit error, instead of automatically purchasing a seat. Manually
    adding a user through the web app is unaffected either way.
  url: https://developer.mitti.com/changelog/automatic-seat-purchasing-can-now-be-turned-off-per-organization
  breaking_note: Behavioural/entitlement change that can make previously-succeeding calls fail for affected organizations
    (as the entry describes); the API contract itself did not change.

      Color is info - STATUS_BADGE_COLOR_NEGATIVE: Color is negative - STATUS_BADGE_COLOR_POSITIVE: Color is positive - STATUS_BADGE_COLOR_WARNING:
      Color is warning - STATUS_BADGE_COLOR_SURFACE: Color is surface'
